  .btn.ghost{background:transparent}

  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

  .datenav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .datenav .dlab{flex:1;text-align:center;font-weight:650;font-size:15.5px}
  .datenav .dlab .xs{display:block;margin-top:1px}
  .navb{width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);
    color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:17px;flex:0 0 auto}
  /* ring + macros */
  .ringwrap{display:flex;align-items:center;gap:16px}
  .ring{position:relative;width:132px;height:132px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring .mid .n{font-size:26px;font-weight:750;letter-spacing:-.5px}
  .ring .mid .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
  .macros{flex:1;min-width:0}

  .mac .row1{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
  .mac .nm{font-weight:600}

  .mac.p i{background:var(--pcol)} .mac.c i{background:var(--ccol)} .mac.f i{background:var(--fcol)}

  .mealhd .t{font-weight:650;font-size:15px;flex:1}
  .mealhd .cals{font-size:12.5px;color:var(--muted)}
  .entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
  .entry:first-of-type{border-top:0}
  .entry .nm{flex:1;min-width:0}
  .entry .nm .n1{font-size:14.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .entry .nm .n2{font-size:11.5px;color:var(--muted2)}
  .entry .k{font-size:14px;font-weight:650;color:var(--accent);white-space:nowrap}

  .pitem{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13.5px}

  .pitem .k{color:var(--accent);font-size:12px;font-weight:650;margin-left:auto}
  .padd{font-size:12.5px;color:var(--accent);font-weight:650;cursor:pointer;padding:3px 0;display:inline-block}

  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}

  details.g summary::-webkit-details-marker{display:none}
  details.g .bd{padding:0 0 13px;font-size:13px;color:var(--muted);line-height:1.55}
  details.g .bd b{color:var(--text)}

  .empty{color:var(--muted2);font-size:13px;text-align:center;padding:14px 0}
  textarea.gro{min-height:180px;font-size:13.5px;line-height:1.6}
  .hide{display:none!important}

var KEY="fuel_v1";

var S=load();
function fresh(){
  return {version:1,
    profile:{sex:"F",age:26,ht:65,wt:135,act:1.45,goal:"recomp"},
    t:{auto:true,kcal:1750,p:120,c:200,f:55,water:8},
    foods:[], meals:[], log:{}, plan:{}, recent:[]};
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return fresh();
    var s=JSON.parse(raw), f=fresh();
    for(var k in f) if(s[k]===undefined) s[k]=f[k];
    return s;
  }catch(e){ return fresh(); }
}
function save(){ localStorage.setItem(KEY,JSON.stringify(S)); }
function uid(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function r0(n){ return Math.round(n); }
function r1(n){ return Math.round(n*10)/10; }

/* dates */
function iso(dt){ var y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate();
  return y+"-"+(m<10?"0":"")+m+"-"+(d<10?"0":"")+d; }
function today(){ return iso(new Date()); }
function parseISO(d){ var p=d.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function addDays(d,n){ var dt=parseISO(d); dt.setDate(dt.getDate()+n); return iso(dt); }
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDay(d){ var dt=parseISO(d), t=today();
  if(d===t) return "Today";
  if(d===addDays(t,-1)) return "Yesterday";
  if(d===addDays(t,1)) return "Tomorrow";
  return DOW[dt.getDay()]+", "+MON[dt.getMonth()]+" "+dt.getDate(); }

/* targets — Mifflin-St Jeor, activity multiplier, goal adjustment */
function calcTargets(p){
  var kg=p.wt*0.45359, cm=p.ht*2.54;
  var bmr=10*kg+6.25*cm-5*p.age+(p.sex==="F"?-161:5);
  var tdee=bmr*p.act;
  var adj={cut:0.80,recomp:0.90,maintain:1.0,gain:1.10}[p.goal]||1;
  var kcal=Math.max(1200,r0(tdee*adj/10)*10);
  var prot=r0(p.wt*(p.goal==="cut"||p.goal==="recomp"?0.9:0.8));
  var fat=Math.max(35,r0(kcal*0.27/9));
  var carb=Math.max(0,r0((kcal-prot*4-fat*9)/4));
  return {kcal:kcal,p:prot,c:carb,f:fat,tdee:r0(tdee),bmr:r0(bmr)};
}
function tgt(){
  if(S.t.auto){ var c=calcTargets(S.profile); return {kcal:c.kcal,p:c.p,c:c.c,f:c.f,water:S.t.water||8}; }
  return {kcal:S.t.kcal,p:S.t.p,c:S.t.c,f:S.t.f,water:S.t.water||8};
}

/* log helpers */
function day(d){ if(!S.log[d]) S.log[d]={e:[],w:0}; return S.log[d]; }
function totals(d){
  var L=S.log[d], t={k:0,p:0,c:0,f:0};
  if(!L) return t;
  L.e.forEach(function(en){ t.k+=en.k*en.q; t.p+=en.p*en.q; t.c+=en.c*en.q; t.f+=en.f*en.q; });
  return t;
}
function foodById(ref){ /* ref {t:'b'|'c'|'m', id} */
  if(ref.t==="b"){ var r=DB[ref.id]; if(!r) return null;
    return {n:r[0],s:r[1],k:r[2],p:r[3],c:r[4],f:r[5],cat:r[6]}; }
  if(ref.t==="c"){ var f=S.foods.find(function(x){return x.id===ref.id;});
    return f?{n:f.n,s:f.s,k:f.k,p:f.p,c:f.c,f:f.f,cat:"X"}:null; }
  if(ref.t==="m"){ return S.meals.find(function(x){return x.id===ref.id;})||null; }
  return null;
}
function mealTotals(m){
  var t={k:0,p:0,c:0,f:0};
  m.items.forEach(function(i){ t.k+=i.k*i.q; t.p+=i.p*i.q; t.c+=i.c*i.q; t.f+=i.f*i.q; });
  return t;
}
function pushRecent(ref){
  S.recent=S.recent.filter(function(r){ return !(r.t===ref.t&&r.id===ref.id); });
  S.recent.unshift({t:ref.t,id:ref.id});
  S.recent=S.recent.slice(0,14);
}

    +'</div></div></div>';

    h+='<div class="card tight"><div class="row between"><h3 style="margin:0">🗓️ Planned</h3>'
      +'<button class="btn xsm" onclick="logAllPlanned()">Log all</button></div>';

    var ents=[]; L.e.forEach(function(e,i){ if(e.slot===sl[0]) ents.push({e:e,i:i}); });
    var k=ents.reduce(function(a,x){return a+x.e.k*x.e.q;},0);
    h+='<div class="card tight"><div class="mealhd"><span>'+sl[2]+'</span><span class="t">'+sl[1]+'</span>'

function macBar(nm,cls,v,t){

    +'<span>'+r0(v)+' / '+t+' g</span></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';
}
function nav(n){ cur=addDays(cur,n); render(); }
function jumpToday(){ cur=today(); render(); }
function setWater(n){ var L=day(cur); L.w=(L.w===n&&n===1)?0:n; save(); render(); }
function logWeight(){

function copyDay(from){
  var src=S.log[from]; if(!src) return;
  var L=day(cur);
  src.e.forEach(function(e){ L.e.push({slot:e.slot,n:e.n,s:e.s,q:e.q,k:e.k,p:e.p,c:e.c,f:e.f}); });

var addSlot="b", addFilter="recent", addQ="", planTarget=null; // planTarget = {d, slot} when picking for the plan
function openAdd(slot){ addSlot=slot; planTarget=null; addFilter=S.recent.length?"recent":"all"; addQ=""; drawAdd(); }
function openPlanPick(d,slot){ planTarget={d:d,slot:slot}; addFilter="meals"; addQ=""; drawAdd(); }
function drawAdd(){
  var h='<div class="grab"></div><h3>'+(planTarget?"Add to plan · "+slotName(planTarget.slot):"Add food · "+slotName(addSlot))+'</h3>'
    +'<input type="search" id="q" placeholder="Search foods…" value="'+esc(addQ)+'" oninput="addQ=this.value;drawList()" autocomplete="off">'

function seg(id,lab){ return '<span class="seg'+(addFilter===id?" on":"")+'" onclick="addFilter=\''+id+'\';drawAdd()">'+lab+'</span>'; }
function slotName(s){ var f=SLOTS.find(function(x){return x[0]===s;}); return f?f[1]:s; }
function searchable(n){ return n.toLowerCase(); }
function drawList(){
  var el=document.getElementById("list"); if(!el) return;
  var q=addQ.trim().toLowerCase(), h="";
  if(addFilter==="quick"){
    h='<div class="xs" style="margin:4px 0 10px">Log anything by calories — macros optional.</div>'
      +'<label class="fld"><span class="lab">Name</span><input id="qkN" placeholder="e.g. Restaurant dinner"></label>'
      +'<div class="grid2"><label class="fld"><span class="lab">Calories</span><input id="qkK" type="number" inputmode="numeric"></label>'
      +'<label class="fld"><span class="lab">Protein g (opt.)</span><input id="qkP" type="number" inputmode="decimal"></label>'
      +'<label class="fld"><span class="lab">Carbs g (opt.)</span><input id="qkC" type="number" inputmode="decimal"></label>'
      +'<label class="fld"><span class="lab">Fat g (opt.)</span><input id="qkF" type="number" inputmode="decimal"></label></div>'
      +'<button class="btn primary" onclick="quickAdd()">Add to '+slotName(planTarget?planTarget.slot:addSlot)+'</button>';
    el.innerHTML=h; return;
  }
  var rows=[];
  if(addFilter==="meals"||q===""&&addFilter==="meals"){}
  if(addFilter==="recent"&&!q){
    S.recent.forEach(function(ref){
      var f=foodById(ref); if(!f) return;
      if(ref.t==="m") rows.push({t:"m",id:ref.id,n:f.n,s:f.items.length+" items",k:mealTotals(f).k,em:f.e||"🍽️"});
      else rows.push({t:ref.t,id:ref.id,n:f.n,s:f.s,k:f.k,em:CATEM[f.cat]||"⭐"});
    });
    if(!rows.length) h='<div class="empty">Nothing logged yet — try All foods.</div>';
  }else{
    var showMeals=(addFilter==="meals"||addFilter==="recent"||addFilter==="all"||!!q);
    if(showMeals&&addFilter!=="mine"){
      S.meals.forEach(function(m){
        if(q&&searchable(m.n).indexOf(q)<0) return;
        if(addFilter==="all"&&!q) return;
        rows.push({t:"m",id:m.id,n:m.n,s:m.items.length+" items",k:mealTotals(m).k,em:m.e||"🍽️"});
      });
    }
    if(addFilter==="mine"||addFilter==="all"||q){
      S.foods.forEach(function(f){
        if(q&&searchable(f.n).indexOf(q)<0) return;
        rows.push({t:"c",id:f.id,n:f.n,s:f.s,k:f.k,em:"⭐"});
      });
    }
    if(addFilter==="all"||q){
      DB.forEach(function(r,i){
        if(q&&searchable(r[0]).indexOf(q)<0) return;
        rows.push({t:"b",id:i,n:r[0],s:r[1],k:r[2],em:CATEM[r[6]]});
      });
    }
    if(!rows.length) h='<div class="empty">No matches. Use Quick add for one-offs.</div>';
  }
  rows=rows.slice(0,60);
  rows.forEach(function(r){
    h+='<div class="frow" onclick="pick(\''+r.t+'\',\''+r.id+'\')">'
      +'<div class="em">'+r.em+'</div><div class="nm"><div class="n1">'+esc(r.n)+'</div>'
      +'<div class="n2">'+esc(r.s)+'</div></div><div class="k">'+r0(r.k)+'<span class="xs">kcal</span></div></div>';
  });
  el.innerHTML=h;
}
function pick(t,id){
  if(t==="b") id=+id;
  var ref={t:t,id:id}, f=foodById(ref); if(!f) return;
  if(planTarget){ /* planning: add ref directly, meals or foods */
    var P=S.plan[planTarget.d]||(S.plan[planTarget.d]={});
    (P[planTarget.slot]||(P[planTarget.slot]=[])).push(ref);
    save(); closeSheet(); render(); return;
  }
  if(t==="m"){ /* log every item of the meal */
    var L=day(cur);
    f.items.forEach(function(i){ L.e.push({slot:addSlot,n:i.n,s:i.s,q:i.q,k:i.k,p:i.p,c:i.c,f:i.f}); });
    pushRecent(ref); save(); closeSheet(); render(); return;
  }
  /* food: qty confirm */
  var h='<div class="grab"></div><h3>'+esc(f.n)+'</h3>'
    +'<div class="macline"><span><b>'+r0(f.k)+'</b> kcal</span><span>P <b>'+r1(f.p)+'</b></span>'
    +'<span>C <b>'+r1(f.c)+'</b></span><span>F <b>'+r1(f.f)+'</b></span><span class="muted">per '+esc(f.s)+'</span></div>'
    +qtyRow(1)
    +'<button class="btn primary" onclick="confirmAdd(\''+t+'\',\''+id+'\')">Add to '+slotName(addSlot)+'</button>';
  openSheet(h);
}
function qtyRow(q){
  return '<div class="qtyrow"><div class="qb" onclick="bumpQty(-0.25)">−</div>'
    +'<input id="qty" type="number" inputmode="decimal" step="0.25" min="0.1" value="'+q+'">'
    +'<div class="qb" onclick="bumpQty(0.25)">+</div></div>';
}
function bumpQty(d){
  var el=document.getElementById("qty");
  el.value=Math.max(0.25,Math.round(((parseFloat(el.value)||1)+d)*4)/4);
}
function confirmAdd(t,id){
  if(t==="b") id=+id;
  var ref={t:t,id:id}, f=foodById(ref); if(!f) return;
  var q=Math.max(0.1,parseFloat(document.getElementById("qty").value)||1);
  day(cur).e.push({slot:addSlot,n:f.n,s:f.s,q:q,k:f.k,p:f.p,c:f.c,f:f.f});
  pushRecent(ref); save(); closeSheet(); render();
}
function quickAdd(){
  var n=document.getElementById("qkN").value.trim()||"Quick add";
  var k=parseFloat(document.getElementById("qkK").value)||0;
  if(!k){ document.getElementById("qkK").focus(); return; }
  var p=parseFloat(document.getElementById("qkP").value)||0;
  var c=parseFloat(document.getElementById("qkC").value)||0;
  var f=parseFloat(document.getElementById("qkF").value)||0;
  if(planTarget){
    /* store as custom food so the plan can reference it */
    var cf={id:uid(),n:n,s:"1 serving",k:k,p:p,c:c,f:f};
    S.foods.push(cf);
    var P=S.plan[planTarget.d]||(S.plan[planTarget.d]={});
    (P[planTarget.slot]||(P[planTarget.slot]=[])).push({t:"c",id:cf.id});
  }else{
    day(cur).e.push({slot:addSlot,n:n,s:"1 serving",q:1,k:k,p:p,c:c,f:f});
  }
  save(); closeSheet(); render();
}

/* ============ PLAN ============ */
function weekStart(off){
  var t=parseISO(today()); t.setDate(t.getDate()-t.getDay()+off*7); return iso(t); /* Sunday start */
}
function resolvePlanRef(ref){
  var f=foodById(ref); if(!f) return null;
  if(ref.t==="m") return {n:f.n,k:mealTotals(f).k,em:f.e||"🍽️",items:f.items};
  return {n:f.n,k:f.k,em:ref.t==="c"?"⭐":(CATEM[f.cat]||"🍽️"),items:[{n:f.n,s:f.s,q:1,k:f.k,p:f.p,c:f.c,f:f.f}]};
}
function renderPlan(){
  var ws=weekStart(weekOff), we=addDays(ws,6);
  var h='<div class="weeknav">'
    +'<button class="navb" onclick="weekOff--;render()">‹</button>'
    +'<div class="dlab">'+(weekOff===0?"This week":weekOff===1?"Next week":fmtShort(ws)+" – "+fmtShort(we))
    +'<span class="xs" style="display:block">'+fmtShort(ws)+' – '+fmtShort(we)+'</span></div>'
    +'<button class="navb" onclick="weekOff++;render()">›</button></div>';
  if(!S.meals.length)
    h+='<div class="banner">Tip: build reusable meals in the <b>Foods</b> tab (🥑) — then planning a week takes seconds.</div>';
  for(var i=0;i<7;i++){
    var d=addDays(ws,i), P=S.plan[d]||{}, dayK=0;
    SLOTS.forEach(function(sl){ (P[sl[0]]||[]).forEach(function(r){ var x=resolvePlanRef(r); if(x) dayK+=x.k; }); });
    h+='<div class="card tight"><div class="row between" style="margin-bottom:4px">'
      +'<b style="font-size:14.5px">'+(d===today()?"Today":DOW[parseISO(d).getDay()])+' <span class="xs">'+fmtShort(d)+'</span></b>'
      +(dayK?'<span class="small" style="color:var(--accent);font-weight:650">'+r0(dayK)+' kcal</span>':"")+'</div>';
    SLOTS.forEach(function(sl){
      var arr=P[sl[0]]||[];
      h+='<div class="pslot"><span class="sl">'+sl[1]+'</span>';
      arr.forEach(function(ref,j){
        var x=resolvePlanRef(ref);
        h+='<div class="pitem"><span>'+(x?x.em+" "+esc(x.n):"(deleted)")+'</span>'
          +(x?'<span class="k">'+r0(x.k)+'</span>':"")
          +'<span class="x" onclick="unplan(\''+d+'\',\''+sl[0]+'\','+j+')">✕</span></div>';
      });
      h+='<span class="padd" onclick="openPlanPick(\''+d+'\',\''+sl[0]+'\')">+ add</span></div>';
    });
    h+='</div>';
  }
  h+='<button class="btn" onclick="groceryList(\''+ws+'\')">🛒 Grocery list for this week</button>';
  return h;
}
function fmtShort(d){ var dt=parseISO(d); return MON[dt.getMonth()]+" "+dt.getDate(); }
function unplan(d,slot,j){
  var P=S.plan[d]; if(!P||!P[slot]) return;
  P[slot].splice(j,1); save(); render();
}
function logPlanned(slot,i){
  var P=S.plan[cur]; if(!P||!P[slot]||!P[slot][i]) return;
  var x=resolvePlanRef(P[slot][i]); if(!x) return;
  var L=day(cur);
  x.items.forEach(function(it){ L.e.push({slot:slot,n:it.n,s:it.s,q:it.q,k:it.k,p:it.p,c:it.c,f:it.f}); });
  save(); render();
}
function logAllPlanned(){
  var P=S.plan[cur]; if(!P) return;
  var L=day(cur);
  SLOTS.forEach(function(sl){
    (P[sl[0]]||[]).forEach(function(ref){
      var x=resolvePlanRef(ref); if(!x) return;
      x.items.forEach(function(it){ L.e.push({slot:sl[0],n:it.n,s:it.s,q:it.q,k:it.k,p:it.p,c:it.c,f:it.f}); });
    });
  });
  save(); render();
}
function groceryList(ws){
  var agg={};
  for(var i=0;i<7;i++){
    var P=S.plan[addDays(ws,i)]; if(!P) continue;
    SLOTS.forEach(function(sl){
      (P[sl[0]]||[]).forEach(function(ref){
        var x=resolvePlanRef(ref); if(!x) return;
        x.items.forEach(function(it){
          var key=it.n+"|"+it.s;
          if(!agg[key]) agg[key]={n:it.n,s:it.s,q:0};
          agg[key].q+=it.q;
        });
      });
    });
  }
  var keys=Object.keys(agg).sort();
  if(!keys.length){ openSheet('<div class="grab"></div><h3>🛒 Grocery list</h3><div class="empty">Nothing planned this week yet.</div>'); return; }
  var txt=keys.map(function(k){ var a=agg[k]; return "• "+a.n+" — "+r1(a.q)+" × "+a.s; }).join("\n");
  openSheet('<div class="grab"></div><h3>🛒 Grocery list</h3>'
    +'<div class="xs" style="margin-bottom:8px">Everything planned this week, combined. Copy it into your shared Notes list.</div>'
    +'<textarea class="gro" id="groTxt" readonly>'+esc(txt)+'</textarea>'
    +'<div class="btn-row" style="margin-top:10px"><button class="btn" onclick="closeSheet()">Close</button>'
    +'<button class="btn primary" onclick="copyGro()">Copy</button></div>');
}
function copyGro(){
  var t=document.getElementById("groTxt");
  t.select(); t.setSelectionRange(0,99999);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t.value);
  else document.execCommand("copy");
  event.target.textContent="Copied ✓";
}

    +(m._existing?'<button class="btn danger" onclick="delMeal()">Delete</button>':"")

function drawMealResults(q){
  q=(q||"").trim().toLowerCase();
  var el=document.getElementById("mRes"), h="";
  if(!q){ el.innerHTML=""; return; }
  var rows=[];
  S.foods.forEach(function(f){ if(searchable(f.n).indexOf(q)>-1) rows.push({n:f.n,s:f.s,k:f.k,p:f.p,c:f.c,f:f.f,em:"⭐"}); });
  DB.forEach(function(r){ if(searchable(r[0]).indexOf(q)>-1) rows.push({n:r[0],s:r[1],k:r[2],p:r[3],c:r[4],f:r[5],em:CATEM[r[6]]}); });
  rows.slice(0,12).forEach(function(r,i){
    window["_mr"+i]=r;
    h+='<div class="frow" onclick="addMealItem('+i+')"><div class="em">'+r.em+'</div>'
      +'<div class="nm"><div class="n1">'+esc(r.n)+'</div><div class="n2">'+esc(r.s)+'</div></div>'
      +'<div class="k">'+r0(r.k)+'<span class="xs">kcal</span></div></div>';
  });
  el.innerHTML=h;
}
function addMealItem(i){
  var r=window["_mr"+i]; if(!r) return;
  draftMeal.items.push({n:r.n,s:r.s,q:1,k:r.k,p:r.p,c:r.c,f:r.f});
  drawMeal();
}
function saveMeal(){
  var m=draftMeal;
  m.n=(document.getElementById("mN").value||"").trim();
  m.e=(document.getElementById("mE").value||"🍽️").trim()||"🍽️";
  if(!m.n||!m.items.length) return;
  var wasExisting=m._existing; delete m._existing;
  if(wasExisting){ var i=S.meals.findIndex(function(x){return x.id===m.id;}); if(i>-1) S.meals[i]=m; else S.meals.push(m); }
  else S.meals.push(m);
  draftMeal=null; save(); closeSheet(); render();
}
function delMeal(){
  S.meals=S.meals.filter(function(x){return x.id!==draftMeal.id;});
  draftMeal=null; save(); closeSheet(); render();
}

/* ============ TRENDS ============ */
function renderTrends(){
  var T=tgt(), t=today();
  /* 7-day stats */
  var k7=0,p7=0,n7=0;
  for(var i=0;i<7;i++){
    var d=addDays(t,-i), L=S.log[d];
    if(L&&L.e.length){ var tot=totals(d); k7+=tot.k; p7+=tot.p; n7++; }
  }
  var h='<div class="kpis">'
    +'<div class="kpi"><div class="v">'+(n7?r0(k7/n7):"–")+'</div><div class="k">avg kcal / 7d</div></div>'
    +'<div class="kpi"><div class="v">'+(n7?r0(p7/n7)+"g":"–")+'</div><div class="k">avg protein / 7d</div></div>'
    +'<div class="kpi"><div class="v">'+n7+'/7</div><div class="k">days logged</div></div></div>';
  /* 14-day calories chart */
  h+='<div class="card"><h3>Calories — last 14 days</h3><div class="chart">'+kcalChart(14,T.kcal)+'</div>'
    +'<div class="xs" style="margin-top:6px">Dashed line = your '+T.kcal+' kcal target. Consistency over weeks matters more than any single day.</div></div>';
  /* weight chart */
  var wpts=weightSeries(90);
  h+='<div class="card"><h3>Weight</h3>';
  if(wpts.length>=2){
    var first=wpts[0].v, last=wpts[wpts.length-1].v, diff=r1(last-first);
    h+='<div class="small muted" style="margin-bottom:4px">'+last+' lb now · '+(diff>0?"+":"")+diff+' lb over '+wpts.length+' logs</div>'
      +'<div class="chart">'+weightChart(wpts)+'</div>'
      +'<div class="xs" style="margin-top:6px">Day-to-day swings are water, not fat — watch the weekly trend.</div>';
  }else{
    h+='<div class="empty">Log weight on the Today tab (any days you like) and the trend appears here.</div>';
  }
  h+='</div>';
  return h;
}
function kcalChart(days,target){
  var t=today(), pts=[];
  for(var i=days-1;i>=0;i--){
    var d=addDays(t,-i), L=S.log[d];
    pts.push({d:d,k:(L&&L.e.length)?totals(d).k:0});
  }
  var W=340,H=150,pad=6,bw=(W-pad*2)/days;
  var mx=Math.max(target*1.25,pts.reduce(function(a,p){return Math.max(a,p.k);},0),1);
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  var ty=H-14-(target/mx)*(H-26);
  pts.forEach(function(p,i){
    var bh=(p.k/mx)*(H-26), x=pad+i*bw, y=H-14-bh;
    var col=p.k===0?"var(--bg2)":(p.k>target*1.05?"var(--danger)":"url(#bg1)");
    s+='<rect x="'+(x+1.5)+'" y="'+y+'" width="'+(bw-3)+'" height="'+Math.max(bh,p.k?2:1)+'" rx="3" fill="'+col+'"/>';
    var dt=parseISO(p.d);
    if(i%2===(days%2===0?1:0)) s+='<text x="'+(x+bw/2)+'" y="'+(H-3)+'" font-size="7.5" fill="var(--muted2)" text-anchor="middle">'+dt.getDate()+'</text>';
  });
  s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><linearGradient id="bg1" x1="0" y1="1" x2="0" y2="0">'
    +'<stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs>'
    +s.slice(('<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">').length)
    +'<line x1="'+pad+'" y1="'+ty+'" x2="'+(W-pad)+'" y2="'+ty+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>'
    +'</svg>';
  return s;
}
function weightSeries(days){
  var t=today(), pts=[];
  for(var i=days-1;i>=0;i--){
    var d=addDays(t,-i), L=S.log[d];
    if(L&&L.wt) pts.push({d:d,v:L.wt});
  }
  return pts;
}
function weightChart(pts){
  var W=340,H=130,pad=8;
  var vs=pts.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vs)-1, mx=Math.max.apply(null,vs)+1;
  var X=function(i){ return pad+(pts.length===1?0:(i/(pts.length-1))*(W-pad*2)); };
  var Y=function(v){ return H-16-((v-mn)/(mx-mn))*(H-30); };
  var path=pts.map(function(p,i){ return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1); }).join(" ");
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    +'<path d="'+path+'" fill="none" stroke="url(#wg1)" stroke-width="2.5" stroke-linecap="round"/>'
    +'<defs><linearGradient id="wg1" x1="0" y1="0" x2="1" y2="0">'
    +'<stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs>';
  pts.forEach(function(p,i){ s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="3" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>'; });
  s+='<text x="'+pad+'" y="10" font-size="9" fill="var(--muted2)">'+mx.toFixed(0)+'</text>'
    +'<text x="'+pad+'" y="'+(H-4)+'" font-size="9" fill="var(--muted2)">'+mn.toFixed(0)+'</text></svg>';
  return s;
}

    +'</select></label></div>';
  h+='<h2 class="section">Daily targets</h2><div class="card">'
    +'<div class="row between" style="margin-bottom:10px"><b>Calculate automatically</b>'
    +'<button class="btn xsm" onclick="S.t.auto=!S.t.auto;save();render()">'+(S.t.auto?"On ✓":"Off")+'</button></div>';
  if(S.t.auto){
    h+='<div class="small muted">From your profile: maintenance ≈ <b style="color:var(--text)">'+c.tdee+'</b> kcal/day.</div>'
      +'<div class="kpis" style="margin-top:10px;margin-bottom:0">'
      +'<div class="kpi"><div class="v">'+c.kcal+'</div><div class="k">kcal</div></div>'
      +'<div class="kpi"><div class="v">'+c.p+'g</div><div class="k">protein</div></div>'
      +'<div class="kpi"><div class="v">'+c.c+'g / '+c.f+'g</div><div class="k">carbs / fat</div></div></div>';
  }else{
    h+='<div class="grid2">'
      +'<label class="fld"><span class="lab">Calories</span><input id="tK" type="number" value="'+S.t.kcal+'" onchange="setT()"></label>'
      +'<label class="fld"><span class="lab">Protein g</span><input id="tP" type="number" value="'+S.t.p+'" onchange="setT()"></label>'
      +'<label class="fld"><span class="lab">Carbs g</span><input id="tC" type="number" value="'+S.t.c+'" onchange="setT()"></label>'
      +'<label class="fld"><span class="lab">Fat g</span><input id="tF" type="number" value="'+S.t.f+'" onchange="setT()"></label></div>';
  }
  h+='<label class="fld" style="margin-top:12px;margin-bottom:0"><span class="lab">Water goal (cups)</span>'
    +'<input id="tW" type="number" inputmode="numeric" value="'+(S.t.water||8)+'" onchange="S.t.water=Math.max(1,Math.min(16,parseInt(this.value)||8));save();render()"></label>';
  h+='</div>';
  /* guide */
  h+='<h2 class="section">How this works</h2>'
    +'<details class="g"><summary>Where your calorie target comes from</summary><div class="bd">'
    +'Resting burn is estimated with the <b>Mifflin-St Jeor equation</b> — the most accurate standard formula in validation studies — then multiplied by your activity level to get maintenance, and adjusted for your goal. A modest deficit (10–20%) loses fat while keeping muscle and staying livable; crash deficits mostly cost muscle and adherence.'
    +'<div class="cite">Frankenfield 2005 (ADA review); Helms 2014; Garthe 2011.</div></div></details>'
    +'<details class="g"><summary>Why protein is the anchor</summary><div class="bd">'
    +'Protein target is <b>0.8–0.9 g per lb</b> of body weight. Meta-analysis shows ~0.7 g/lb (1.6 g/kg) maximizes muscle retention and growth; a bit extra helps in a deficit and keeps you full. Hit protein first every day — calories second, carbs/fat are flexible.'
    +'<div class="cite">Morton 2018 (BJSM meta-analysis); Helms 2014.</div></div></details>'
    +'<details class="g"><summary>How to actually use this app</summary><div class="bd">'
    +'1) Log everything for 2–3 weeks — accuracy beats perfection; Quick add is fine for messy meals. 2) Weigh 2–4×/week, same time of day, and watch the <b>trend</b>, not the number. 3) If the weekly average isn’t moving after ~3 weeks, drop calories ~100 or add a little activity. 4) Build your usual meals in the Foods tab so logging takes seconds — friction is what kills tracking.</div></details>'
    +'<details class="g"><summary>Food values &amp; accuracy</summary><div class="bd">'
    +'Built-in foods use USDA-style averages per common serving — good enough for trends. For packaged foods you eat often, make a custom food from the label. Restaurant meals are usually <b>20–30% more</b> than they look; when unsure, round up.</div></details>';
  /* data */
  h+='<h2 class="section">Data</h2><div class="card tight">'
    +'<div class="btn-row"><button class="btn" onclick="exportData()">Export backup</button>'
    +'<button class="btn" onclick="importData()">Import</button></div>'
    +'<button class="btn danger" style="margin-top:10px" onclick="resetAll()">Reset everything</button>'
    +'<div class="xs" style="margin-top:9px">Everything lives on this phone (localStorage) — nothing is uploaded anywhere. Export a backup now and then.</div></div>';
  h+='<div class="xs" style="text-align:center;margin:18px 0 6px">Fuel · part of Daily Dashboard · <a href="../index.html" style="color:var(--accent)">← back to dashboard</a></div>';
  return h;
}
function actOpt(v,l,curv){ return '<option value="'+v+'"'+(Math.abs(curv-v)<0.01?" selected":"")+'>'+l+'</option>'; }
function goalOpt(v,l,curv){ return '<option value="'+v+'"'+(curv===v?" selected":"")+'>'+l+'</option>'; }
function setP(){
  var p=S.profile;
  p.sex=document.getElementById("pSex").value;
  p.age=Math.max(14,parseInt(document.getElementById("pAge").value)||p.age);
  p.ht=Math.max(48,parseFloat(document.getElementById("pHt").value)||p.ht);
  p.wt=Math.max(70,parseFloat(document.getElementById("pWt").value)||p.wt);
  p.act=parseFloat(document.getElementById("pAct").value)||p.act;
  p.goal=document.getElementById("pGoal").value;
  save(); render();
}
function setT(){
  S.t.kcal=Math.max(800,parseInt(document.getElementById("tK").value)||S.t.kcal);
  S.t.p=Math.max(0,parseInt(document.getElementById("tP").value)||S.t.p);
  S.t.c=Math.max(0,parseInt(document.getElementById("tC").value)||S.t.c);
  S.t.f=Math.max(0,parseInt(document.getElementById("tF").value)||S.t.f);
  save(); render();
}
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="fuel-backup-"+today()+".json";
  a.click();
}
function importData(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var s=JSON.parse(rd.result);
        if(!s||typeof s!=="object"||!s.profile) throw 0;
        S=s; save(); render(); alert("Backup restored ✓");
      }catch(e){ alert("That file doesn't look like a Fuel backup."); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function resetAll(){
  if(!confirm("Delete ALL Fuel data on this device? This can't be undone."))return;
  S=fresh(); save(); render();
}

/* boot */
show("today");
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("../sw.js");
</script>
</body>
</html>
