<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0d0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Sculpt — Lean Strength</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0d0f14; --bg2:#11141b; --card:#161a22; --card2:#1c2230;
    --line:#262d3a; --text:#e7eaf1; --muted:#8b93a7; --muted2:#5e6679;
    --a1:#2dd4bf; --a2:#a3e635; --accent:#34e0c4;
    --warn:#fbbf24; --danger:#f87171; --good:#34d399;
    --grad:linear-gradient(135deg,#2dd4bf 0%,#a3e635 100%);
    --r:16px; --r2:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; font-size:15px;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:560px;margin:0 auto;padding:0 16px}
  header.top{
    position:sticky;top:0;z-index:30;background:rgba(13,15,20,.85);
    backdrop-filter:saturate(160%) blur(12px);
    padding:14px 16px 10px;border-bottom:1px solid var(--line);
    margin:0 -16px 14px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);
    display:grid;place-items:center;color:#06241f;flex:0 0 auto}
  .logo svg{width:18px;height:18px}
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.3px}
  .brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .grow{flex:1}
  .chip{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);
    padding:4px 9px;border-radius:999px;white-space:nowrap}
  h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:22px 2px 10px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .card.tight{padding:13px 14px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)} .small{font-size:12.5px} .xs{font-size:11.5px}
  .pill{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.3px;
    padding:3px 8px;border-radius:999px;text-transform:uppercase}
  .pill.Legs{background:#1d2e2a;color:#5eead4} .pill.Core{background:#2a2536;color:#c4b5fd}
  .pill.Arms{background:#312522;color:#fca5a5} .pill.Back{background:#1f2937;color:#93c5fd}
  .pill.Chest{background:#33271d;color:#fcd34d} .pill.Shoulders{background:#2b2b1d;color:#fde68a}
  .pill.Conditioning{background:#162a22;color:#6ee7b7}
  .btn{appearance:none;border:0;border-radius:var(--r2);padding:13px 16px;font-size:15px;font-weight:600;
    cursor:pointer;background:var(--card2);color:var(--text);border:1px solid var(--line);width:100%}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--grad);color:#06241f;border:0}
  .btn.ghost{background:transparent}
  .btn.sm{padding:8px 12px;font-size:13px;width:auto}
  .btn.danger{color:var(--danger);border-color:#3a2326}
  .btn-row{display:flex;gap:10px}
  input,select{font-family:inherit;font-size:15px;color:var(--text);background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  label.fld{display:block;margin-bottom:12px}
  label.fld .lab{font-size:12px;color:var(--muted);margin-bottom:6px;display:block}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  /* Day cards */
  .day{display:flex;align-items:center;gap:13px;cursor:pointer}
  .day .num{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;
    font-weight:700;font-size:16px;color:var(--accent);flex:0 0 auto;border:1px solid var(--line)}
  .day.next .num{background:var(--grad);color:#06241f;border:0}
  .day .t{font-weight:600;font-size:15.5px}
  .day .d{font-size:12.5px;color:var(--muted);margin-top:1px}
  .day .arr{color:var(--muted2)}
  .tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  /* Session */
  .ex{margin-bottom:12px}
  .ex .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ex .name{font-weight:650;font-size:15.5px}
  .ex .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .ex .note{font-size:12px;color:var(--muted);margin-top:8px;padding:8px 10px;background:var(--bg2);border-radius:9px;border:1px solid var(--line)}
  .ex .warn{color:#fcd34d;border-color:#3a3219;background:#1e1a10}
  .ex .swap{color:#6ee7b7;border-color:#16352b;background:#0f1f19}
  .setline{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:9px}
  .setline .sn{color:var(--muted);font-size:12.5px;text-align:center}
  .setline input{padding:10px;text-align:center}
  .setline.head .sn,.setline.head span{font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px;text-align:center}
  .done{width:44px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
    display:grid;place-items:center;cursor:pointer;color:var(--muted2)}
  .done.on{background:var(--good);color:#062417;border:0}
  .done svg{width:18px;height:18px}
  .setbtns{display:flex;gap:8px;margin-top:10px}
  .setbtns .btn{padding:7px;font-size:12.5px}
  /* Rest bar */
  #rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom));
    width:calc(100% - 32px);max-width:528px;background:var(--card2);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:40;
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #rest.on{display:flex}
  #rest .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:54px}
  #rest .bar{flex:1;height:6px;background:var(--bg);border-radius:999px;overflow:hidden}
  #rest .bar i{display:block;height:100%;background:var(--grad);width:100%}
  #rest button{flex:0 0 auto;width:auto}
  /* nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:35;background:rgba(13,15,20,.92);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
  nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  nav.tabs button{background:none;border:0;color:var(--muted2);padding:6px 0;display:flex;flex-direction:column;
    align-items:center;gap:3px;font-size:10.5px;cursor:pointer;font-family:inherit}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button.on{color:var(--accent)}
  /* misc */
  .stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center}
  .stat .v{font-size:22px;font-weight:700} .stat .l{font-size:11px;color:var(--muted);margin-top:2px}
  .toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--good);color:#062417;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;
    z-index:60;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px}
  .hist{border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
  .disc{font-size:11.5px;color:var(--muted2);margin-top:6px;line-height:1.5}
  .toggle{width:46px;height:28px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);
    position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
  .toggle.on{background:var(--good);border-color:var(--good)}
  .toggle i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
  .toggle.on i{left:20px}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--card2);color:var(--text)}
  ul.lean{margin:8px 0 0;padding-left:18px} ul.lean li{margin-bottom:7px;font-size:13.5px}
  .kpi{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kpi:last-child{border-bottom:0}
  a.link{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand row">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
      </div>
      <div>
        <h1>Sculpt</h1>
        <div class="sub" id="hdrSub">Lean strength · legs · core · arms</div>
      </div>
      <div class="grow"></div>
      <div class="chip" id="hdrChip">4-day</div>

  </header>

  <main id="view"></main>
</div>

<div id="rest">
  <span class="t" id="restT">0:00</span>
  <div class="bar"><i id="restBar"></i></div>

</div>

<nav class="tabs"><div class="in">
  <button data-action="nav:train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg><span>Train</span></button>
  <button data-action="nav:history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg><span>History</span></button>
  <button data-action="nav:progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg><span>Progress</span></button>
  <button data-action="nav:guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg><span>Guide</span></button>
  <button data-action="nav:settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
</div></nav>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" />

<script>
/* ---------- Exercise programs ---------- */
// shoulder: {lvl:'caution'|'avoid', note, sub}
const C = (note)=>({lvl:'caution',note});
const A = (note,sub)=>({lvl:'avoid',note,sub});

const PROGRAMS = {
  3:{ name:"3-Day Full-Body", days:[
    {name:"Lower + Core — Quad focus", tags:["Legs","Core"], ex:[
      {n:"Goblet Squat",g:"Legs",s:4,r:"8–12",rest:90,note:"Chest tall, sit down between your heels."},
      {n:"Dumbbell Romanian Deadlift",g:"Legs",s:3,r:"8–12",rest:90,note:"Push hips back, soft knees, feel the hamstrings."},
      {n:"Walking Lunge",g:"Legs",s:3,r:"10–12 / leg",rest:75},
      {n:"Leg Extension",g:"Legs",s:3,r:"12–15",rest:60},
      {n:"Hanging Knee Raise",g:"Core",s:3,r:"10–15",rest:60},
      {n:"Plank",g:"Core",s:3,r:"30–45 s",rest:45},
    ]},
    {name:"Upper — Arms focus", tags:["Arms","Back","Chest"], ex:[
      {n:"Neutral-Grip Lat Pulldown",g:"Back",s:3,r:"8–12",rest:90,note:"Neutral (palms-facing) grip is easiest on the shoulder.",shoulder:C("Pull to upper chest, no shrugging. Stop if it pinches.")},
      {n:"Chest-Supported DB Row",g:"Back",s:3,r:"10–12",rest:75},
      {n:"Incline DB Press",g:"Chest",s:3,r:"8–12",rest:90,shoulder:C("Keep bench ≤30°, elbows ~45°. Stop short of any pain.")},
      {n:"DB Biceps Curl",g:"Arms",s:3,r:"10–12",rest:60},
      {n:"Triceps Rope Pushdown",g:"Arms",s:3,r:"10–15",rest:60},
      {n:"Hammer Curl",g:"Arms",s:2,r:"10–12",rest:60},
      {n:"Face Pull",g:"Shoulders",s:3,r:"15–20",rest:45,note:"Great for shoulder health — pull to your eyes, thumbs back."},
    ]},
    {name:"Lower + Core — Glute / Ham focus", tags:["Legs","Core"], ex:[
      {n:"Hip Thrust",g:"Legs",s:4,r:"8–12",rest:90,note:"Ribs down, squeeze glutes hard at the top."},
      {n:"Bulgarian Split Squat",g:"Legs",s:3,r:"8–12 / leg",rest:90},
      {n:"Seated Leg Curl",g:"Legs",s:3,r:"10–15",rest:60},
      {n:"Hip Abduction (machine / band)",g:"Legs",s:3,r:"15–20",rest:45},
      {n:"Standing Calf Raise",g:"Legs",s:3,r:"12–20",rest:45},
      {n:"Cable Crunch",g:"Core",s:3,r:"12–15",rest:60},
      {n:"Pallof Press",g:"Core",s:3,r:"10 / side",rest:45},
    ]},
  ]},
  4:{ name:"4-Day Lower / Upper", days:[
    {name:"Lower A — Quad & Glute", tags:["Legs"], ex:[
      {n:"Back Squat (or Goblet)",g:"Legs",s:4,r:"6–10",rest:120,note:"Brace, full depth you can control."},
      {n:"Romanian Deadlift",g:"Legs",s:3,r:"8–12",rest:90},
      {n:"Walking Lunge",g:"Legs",s:3,r:"10–12 / leg",rest:75},
      {n:"Leg Extension",g:"Legs",s:3,r:"12–15",rest:60},
      {n:"Standing Calf Raise",g:"Legs",s:3,r:"12–20",rest:45},
      {n:"Hanging Leg Raise",g:"Core",s:3,r:"10–15",rest:60},
    ]},
    {name:"Upper — Arms & Back", tags:["Arms","Back","Chest"], ex:[
      {n:"Neutral-Grip Lat Pulldown",g:"Back",s:3,r:"8–12",rest:90,shoulder:C("Neutral grip, pull to upper chest. No pain through the shoulder.")},
      {n:"Chest-Supported DB Row",g:"Back",s:3,r:"10–12",rest:75},
      {n:"Incline DB Press",g:"Chest",s:3,r:"8–12",rest:90,shoulder:C("Bench ≤30°, elbows tucked ~45°, stop short of pain.")},
      {n:"DB Biceps Curl",g:"Arms",s:3,r:"10–12",rest:60},
      {n:"Triceps Rope Pushdown",g:"Arms",s:3,r:"10–15",rest:60},
      {n:"Face Pull",g:"Shoulders",s:3,r:"15–20",rest:45,note:"Shoulder-healthy — pull to eyes, externally rotate."},
      {n:"Hammer Curl",g:"Arms",s:2,r:"10–12",rest:60},
    ]},
    {name:"Lower B — Glute & Hamstring", tags:["Legs","Core"], ex:[
      {n:"Hip Thrust",g:"Legs",s:4,r:"8–12",rest:90,note:"Ribs down, full lockout, pause at the top."},
      {n:"Bulgarian Split Squat",g:"Legs",s:3,r:"8–12 / leg",rest:90},
      {n:"Seated Leg Curl",g:"Legs",s:3,r:"10–15",rest:60},
      {n:"Hip Abduction (machine / band)",g:"Legs",s:3,r:"15–20",rest:45},
      {n:"Seated Calf Raise",g:"Legs",s:3,r:"12–20",rest:45},
      {n:"Cable Crunch",g:"Core",s:3,r:"12–15",rest:60},
    ]},
    {name:"Arms & Core", tags:["Arms","Core"], ex:[
      {n:"DB Biceps Curl",g:"Arms",s:3,r:"10–12",rest:60},
      {n:"Triceps Rope Pushdown",g:"Arms",s:3,r:"10–15",rest:60},
      {n:"Incline DB Curl",g:"Arms",s:3,r:"10–12",rest:60},
      {n:"Overhead Cable Triceps Extension",g:"Arms",s:3,r:"12–15",rest:60,shoulder:A("Overhead position can stress the shoulder.","Cross-Body / Single-Arm Triceps Pushdown")},
      {n:"Cable Lateral Raise",g:"Shoulders",s:2,r:"12–15",rest:45,shoulder:C("Light weight, raise only to shoulder height, thumbs slightly up.")},
      {n:"Hanging Leg Raise",g:"Core",s:3,r:"10–15",rest:60},
      {n:"Pallof Press",g:"Core",s:3,r:"10 / side",rest:45},
      {n:"Plank",g:"Core",s:3,r:"30–60 s",rest:45},
      {n:"Incline Walk (finisher)",g:"Conditioning",s:1,r:"10–15 min",rest:0,note:"Optional zone-2 finisher."},
    ]},
  ]},
  5:{ name:"5-Day Sculpt Split", days:[
    {name:"Quads & Calves", tags:["Legs"], ex:[
      {n:"Back Squat (or Goblet)",g:"Legs",s:4,r:"6–10",rest:120},
      {n:"Leg Press",g:"Legs",s:3,r:"10–15",rest:90},
      {n:"Walking Lunge",g:"Legs",s:3,r:"10–12 / leg",rest:75},
      {n:"Leg Extension",g:"Legs",s:3,r:"12–15",rest:60},
      {n:"Standing Calf Raise",g:"Legs",s:4,r:"12–20",rest:45},
    ]},
    {name:"Back & Biceps", tags:["Back","Arms"], ex:[
      {n:"Neutral-Grip Lat Pulldown",g:"Back",s:4,r:"8–12",rest:90,shoulder:C("Neutral grip, control the stretch, no pain.")},
      {n:"Chest-Supported DB Row",g:"Back",s:3,r:"10–12",rest:75},
      {n:"Straight-Arm Pulldown",g:"Back",s:3,r:"12–15",rest:60},
      {n:"DB Biceps Curl",g:"Arms",s:3,r:"10–12",rest:60},
      {n:"Hammer Curl",g:"Arms",s:3,r:"10–12",rest:60},
      {n:"Face Pull",g:"Shoulders",s:3,r:"15–20",rest:45,note:"Shoulder-healthy accessory."},
    ]},
    {name:"Glutes & Hamstrings", tags:["Legs"], ex:[
      {n:"Hip Thrust",g:"Legs",s:4,r:"8–12",rest:90},
      {n:"Romanian Deadlift",g:"Legs",s:3,r:"8–12",rest:90},
      {n:"Bulgarian Split Squat",g:"Legs",s:3,r:"8–12 / leg",rest:90},
      {n:"Seated Leg Curl",g:"Legs",s:3,r:"10–15",rest:60},
      {n:"Hip Abduction (machine / band)",g:"Legs",s:3,r:"15–20",rest:45},
      {n:"Seated Calf Raise",g:"Legs",s:3,r:"12–20",rest:45},
    ]},
    {name:"Chest & Triceps", tags:["Chest","Arms"], ex:[
      {n:"Incline DB Press",g:"Chest",s:4,r:"8–12",rest:90,shoulder:C("Bench ≤30°, elbows ~45°, stop short of pain.")},
      {n:"Flat DB Press (or Push-Up)",g:"Chest",s:3,r:"10–12",rest:75,shoulder:C("Keep range pain-free; push-ups are a great low-stress option.")},
      {n:"Low-to-Mid Cable Fly",g:"Chest",s:3,r:"12–15",rest:60},
      {n:"Triceps Rope Pushdown",g:"Arms",s:3,r:"10–15",rest:60},
      {n:"Triceps Kickback",g:"Arms",s:3,r:"12–15",rest:45},
      {n:"Face Pull",g:"Shoulders",s:2,r:"15–20",rest:45},
    ]},

const KEY='sculpt_v1';
const DEF={
  profile:{name:"",age:26,heightFt:5,heightIn:5,weight:135,goal:"Lean up / recomposition"},
  settings:{program:4,shoulderSafe:true,units:"lb"},
  sessions:[], bodyweights:[], last:{}
};
let DB = load();
let state = { tab:'train', active:null };
let restTimer=null;

function load(){
  try{ const r=JSON.parse(localStorage.getItem(KEY)); if(r) return Object.assign(structuredClone(DEF),r);}catch(e){}
  return structuredClone(DEF);
}
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }

/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const view=$('#view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtDate=iso=>{const d=new Date(iso+'T00:00:00');return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});};
const topReps=r=>{const m=String(r).match(/(\d+)(?!.*\d)/);return m?+m[1]:null;};
function curProgram(){ return PROGRAMS[DB.settings.program]; }
function resolveEx(e){
  // returns display object honoring shoulderSafe swaps
  const ss=DB.settings.shoulderSafe, sh=e.shoulder;
  let name=e.n, swapped=false, warn=null;
  if(sh){
    if(sh.lvl==='avoid' && ss){ name=sh.sub; swapped=true; }
    else { warn = sh; }
  }
  return {...e, dn:name, swapped, warn:warn};
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}
function beep(){
  try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.001,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.4,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);
  o.start();o.stop(a.currentTime+.5);}catch(e){}
  if(navigator.vibrate)navigator.vibrate(200);
}

/* ---------- Rest timer ---------- */
let restEnd=0, restTotal=0;
function startRest(sec){
  if(!sec)return;
  restTotal=sec; restEnd=Date.now()+sec*1000;
  $('#rest').classList.add('on'); tickRest();
  clearInterval(restTimer); restTimer=setInterval(tickRest,200);
}
function tickRest(){
  const left=Math.max(0,Math.round((restEnd-Date.now())/1000));
  $('#restT').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('#restBar').style.width=(left/restTotal*100)+'%';
  if(left<=0){clearInterval(restTimer);$('#rest').classList.remove('on');beep();}
}
function stopRest(){clearInterval(restTimer);$('#rest').classList.remove('on');}

/* ---------- Views ---------- */
function render(){
  $('#hdrChip').textContent=DB.settings.program+'-day';

}

function bwChart(bw){
  const data=bw.slice(-30), W=496,H=120,pad=22;
  const ws=data.map(d=>d.w), min=Math.min(...ws), max=Math.max(...ws);
  const rng=(max-min)||1;
  const x=i=>pad+(data.length<2?0:i/(data.length-1)*(W-pad*2));
  const y=v=>H-pad-((v-min)/rng)*(H-pad*1.6);
  const pts=data.map((d,i)=>`${x(i).toFixed(1)},${y(d.w).toFixed(1)}`).join(' ');
  const first=data[0].w, lastv=data[data.length-1].w, diff=(lastv-first).toFixed(1);
  const dColor=diff<0?'var(--good)':diff>0?'var(--warn)':'var(--muted)';
  return `<div style="margin-top:14px">
    <div class="row between" style="margin-bottom:6px"><span class="muted small">last ${data.length} entries</span>
    <span class="small" style="color:${dColor};font-weight:600">${diff>0?'+':''}${diff} ${DB.settings.units}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">
      <polyline fill="none" stroke="url(#g)" stroke-width="2.5" points="${pts}" stroke-linejoin="round" stroke-linecap="round"/>
      ${data.map((d,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(d.w).toFixed(1)}" r="2.6" fill="#a3e635"/>`).join('')}
      <text x="${pad}" y="12" fill="var(--muted2)" font-size="10">${max}</text>
      <text x="${pad}" y="${H-4}" fill="var(--muted2)" font-size="10">${min}</text>
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a3e635"/></linearGradient></defs>
    </svg></div>`;
}

/* ---------- Utilities ---------- */
function daysAgo(iso){return (Date.now()-new Date(iso+'T00:00:00').getTime())/864e5;}

/* ---------- Actions ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]'); if(!t)return;
  const [act,...rest]=t.dataset.action.split(':');

  if(act==='nav'){ state.active=null; state.tab=rest[0]; render(); return; }
  if(act==='start-day'){ beginSession(+rest[0]); return; }
  if(act==='cancel-session'){ if(confirm('Discard this session? Logged sets won’t be saved.')){state.active=null;stopRest();render();} return; }
  if(act==='finish-session'){ finishSession(); return; }
  if(act==='done'){ toggleDone(+rest[0],+rest[1]); return; }
  if(act==='addset'){ state.active.exercises[+rest[0]].sets.push({weight:'',reps:'',done:false}); renderSession(); return; }
  if(act==='delset'){ const s=state.active.exercises[+rest[0]].sets; if(s.length>1)s.pop(); renderSession(); return; }
  if(act==='rest-add'){ restEnd+=15000; tickRest(); return; }
  if(act==='rest-skip'){ stopRest(); return; }
  if(act==='log-bw'){ logBW(); return; }
  if(act==='save-profile'){ saveProfile(); return; }
  if(act==='set-program'){ DB.settings.program=+rest[0]; save(); render(); toast(rest[0]+'-day split selected'); return; }
  if(act==='toggle-shoulder'){ DB.settings.shoulderSafe=!DB.settings.shoulderSafe; save(); render(); return; }
  if(act==='export'){ exportData(); return; }
  if(act==='import'){ $('#importFile').click(); return; }
  if(act==='reset'){ if(confirm('Erase all workouts, body-weight log and settings? This cannot be undone.')){DB=structuredClone(DEF);save();state.active=null;state.tab='train';render();toast('All data reset');} return; }
});

document.addEventListener('input',e=>{
  const t=e.target.closest('[data-input]'); if(!t||!state.active)return;
  const [k,ei,si]=t.dataset.input.split(':');
  const set=state.active.exercises[+ei].sets[+si];
  const v=t.value===''?'':parseFloat(t.value);
  if(k==='w')set.weight=v; else set.reps=v;
});

function beginSession(idx){
  const d=curProgram().days[idx];
  state.active={ date:todayISO(), dayIdx:idx, dayName:d.name,
    exercises: d.ex.map(e=>{const r=resolveEx(e);
      return {n:e.n,dn:r.dn,g:e.g,s:e.s,r:e.r,rest:e.rest,note:e.note,swapped:r.swapped,warn:r.warn,
        sets:Array.from({length:e.s},()=>({weight:'',reps:'',done:false}))};
    })};
  state.tab='train'; render();
}

function toggleDone(ei,si){
  const set=state.active.exercises[ei].sets[si];
  set.done=!set.done;
  if(set.done){ const ex=state.active.exercises[ei]; renderSession(); if(ex.rest) startRest(ex.rest); }
  else renderSession();
}

function finishSession(){
  const a=state.active;
  const exercises=a.exercises.map(e=>({
    name:e.dn,
    sets:e.sets.filter(s=>s.reps!=='' && s.reps>0).map(s=>({weight:s.weight===''?0:s.weight,reps:s.reps}))
  })).filter(e=>e.sets.length);
  if(!exercises.length){ toast('Log at least one set first'); return; }
  // update last weights (heaviest set per exercise)
  exercises.forEach(e=>{ const top=e.sets.reduce((m,x)=>x.weight>m.weight?x:m,e.sets[0]); DB.last[e.name]={weight:top.weight,reps:top.reps}; });
  DB.sessions.push({ id:Date.now(), date:a.date, dayIdx:a.dayIdx, dayName:a.dayName, exercises });
  save(); state.active=null; stopRest();
  state.tab='train'; render();
  toast('Workout saved 💪');
}

function logBW(){
  const v=parseFloat($('#bwInput').value); if(!v){toast('Enter a weight');return;}
  const today=todoOrToday();
  const ex=DB.bodyweights.find(b=>b.date===today);
  if(ex)ex.w=v; else DB.bodyweights.push({date:today,w:v});
  DB.bodyweights.sort((a,b)=>a.date<b.date?-1:1);
  DB.profile.weight=v; save(); renderProgress(); toast('Logged '+v+' '+DB.settings.units);
}
function todoOrToday(){return todayISO();}

function saveProfile(){
  DB.profile.name=$('#pName').value.trim();
  DB.profile.age=+$('#pAge').value||DB.profile.age;
  DB.profile.heightFt=+$('#pFt').value||DB.profile.heightFt;
  DB.profile.heightIn=+$('#pIn').value||0;
  DB.profile.weight=+$('#pWt').value||DB.profile.weight;
  DB.profile.goal=$('#pGoal').value.trim()||DB.profile.goal;
  save(); toast('Profile saved'); render();
}

function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='sculpt-backup-'+todayISO()+'.json'; a.click();
  URL.revokeObjectURL(url); toast('Backup downloaded');
}
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); DB=Object.assign(structuredClone(DEF),d); save(); state.active=null; render(); toast('Backup imported'); }catch(err){ toast('Invalid file'); } };
  r.readAsText(f); e.target.value='';
});

/* ---------- First run defaults ---------- */
if(!DB.profile.name && DB.sessions.length===0 && !localStorage.getItem(KEY)){
  // seed sensible defaults for the intended user, but leave name blank for them to set
  DB.profile={name:"",age:26,heightFt:5,heightIn:5,weight:135,goal:"Lean up / recomposition"};
  DB.settings={program:4,shoulderSafe:true,units:"lb"};
  save();
}

render();

/* ---------- PWA: register dashboard service worker + persist storage ---------- */
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("../sw.js");
if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
</script>
