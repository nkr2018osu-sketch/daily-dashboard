<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0d0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Sculpt — Lean Strength</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0d0f14; --bg2:#11141b; --card:#161a22; --card2:#1c2230;
    --line:#262d3a; --text:#e7eaf1; --muted:#8b93a7; --muted2:#5e6679;
    --a1:#2dd4bf; --a2:#a3e635; --accent:#34e0c4;
    --warn:#fbbf24; --danger:#f87171; --good:#34d399; --bad:#f87171;
    --grad:linear-gradient(135deg,#2dd4bf 0%,#a3e635 100%);
    --r:16px; --r2:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; font-size:15px;
    padding-bottom:calc(120px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:560px;margin:0 auto;padding:0 16px}
  header.top{
    position:sticky;top:0;z-index:30;background:rgba(13,15,20,.85);
    backdrop-filter:saturate(160%) blur(12px);
    padding:14px 16px 10px;border-bottom:1px solid var(--line);margin:0 -16px 14px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);
    display:grid;place-items:center;color:#06241f;flex:0 0 auto}
  .logo svg{width:18px;height:18px}
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.3px}
  .brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .grow{flex:1}
  .chip{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);
    padding:4px 9px;border-radius:999px;white-space:nowrap}
  h2.section{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:22px 2px 10px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .card.tight{padding:13px 14px}
  .card h3{margin:0 0 6px;font-size:16px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)} .small{font-size:12.5px} .xs{font-size:11.5px;color:var(--muted2)}
  .tiny{color:var(--muted2);font-size:12px}
  .pill{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.3px;
    padding:3px 8px;border-radius:999px;text-transform:uppercase}
  .pill.acc{color:#06241f;background:var(--grad)}
  .pill.Glutes,.pill.Legs{background:#1d2e2a;color:#5eead4} .pill.Quads{background:#1d2e2a;color:#5eead4}
  .pill.Hamstrings{background:#16302a;color:#6ee7b7} .pill.Calves{background:#16302a;color:#6ee7b7}
  .pill.Core{background:#2a2536;color:#c4b5fd} .pill.Abs{background:#2a2536;color:#c4b5fd}
  .pill.Arms,.pill.Biceps,.pill.Triceps{background:#312522;color:#fca5a5}
  .pill.Back{background:#1f2937;color:#93c5fd} .pill.Chest{background:#33271d;color:#fcd34d}
  .pill.Shoulders{background:#2b2b1d;color:#fde68a} .pill.Conditioning{background:#162a22;color:#6ee7b7}
  .btn{appearance:none;border:0;border-radius:var(--r2);padding:13px 16px;font-size:15px;font-weight:600;
    cursor:pointer;background:var(--card2);color:var(--text);border:1px solid var(--line);width:100%}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--grad);color:#06241f;border:0}
  .btn.ghost{background:transparent}
  .btn.sm{padding:8px 12px;font-size:13px;width:auto}
  .btn.danger{color:var(--danger);border-color:#3a2326;background:transparent}
  .btn-row{display:flex;gap:10px}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label.fld{display:block;margin-bottom:12px}
  label.fld .lab{font-size:12px;color:var(--muted);margin-bottom:6px;display:block}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  select.wide{width:100%}
  /* day cards */
  .day{display:flex;align-items:center;gap:13px;cursor:pointer}
  .day .num{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;
    font-weight:700;font-size:15px;color:var(--accent);flex:0 0 auto;border:1px solid var(--line)}
  .day.next .num{background:var(--grad);color:#06241f;border:0}
  .day .t{font-weight:600;font-size:15.5px}
  .day .d{font-size:12.5px;color:var(--muted);margin-top:1px}
  .day .arr{color:var(--muted2)}
  .tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  /* kpis */
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;text-align:center}
  .kpi .v{font-size:20px;font-weight:700;color:var(--accent)}
  .kpi .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
  /* exercise / session */
  .ex{margin-bottom:12px}
  .ex .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ex .name{font-weight:650;font-size:15.5px}
  .ex .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .recbox{margin:10px 0 4px;padding:9px 11px;background:var(--card2);border-radius:10px;font-size:13.5px;
    border-left:3px solid var(--accent);cursor:pointer}
  .recbox.find{border-left-color:var(--warn)}
  .recbox.deload{border-left-color:var(--warn)}
  .recbox .why{color:var(--muted);font-size:12px;margin-top:5px;display:none;line-height:1.5}
  .recbox.open .why{display:block}
  .note{font-size:12px;color:var(--muted);margin-top:8px;padding:8px 10px;background:var(--bg2);border-radius:9px;border:1px solid var(--line)}
  .note.warn{color:#fcd34d;border-color:#3a3219;background:#1e1a10}
  .note.swap{color:#6ee7b7;border-color:#16352b;background:#0f1f19}
  .setrow{display:grid;grid-template-columns:30px 1fr 1fr 50px 44px;gap:6px;align-items:center;margin-top:8px}
  .setrow input,.setrow select{padding:10px 4px;text-align:center}
  .setrow.head>span{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.3px;text-align:center}
  .setn{color:var(--muted);font-size:12.5px;text-align:center;cursor:pointer}
  .setn b{color:var(--accent)}
  .done{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
    display:grid;place-items:center;cursor:pointer;color:var(--muted2)}
  .done.on{background:var(--good);color:#062417;border:0}
  .done svg{width:18px;height:18px}
  .exlinks{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
  .exlinks a,.exlinks span{color:var(--accent);font-size:12.5px;text-decoration:none;font-weight:600;cursor:pointer}
  .cues{display:none;margin:10px 0 0;padding:11px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
  .cues.open{display:block}
  .cues .why{color:var(--a2);font-size:12.5px;margin:0 0 7px;font-weight:600}
  .cues ul{margin:0;padding-left:18px;color:var(--muted)} .cues li{margin-bottom:4px;font-size:13px}
  textarea.exnote{margin-top:8px;min-height:38px;font-size:13px}
  /* rest bar */
  #rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom));
    width:calc(100% - 32px);max-width:528px;background:var(--card2);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:40;
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #rest.on{display:flex}
  #rest .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:54px}
  #rest .bar{flex:1;height:6px;background:var(--bg);border-radius:999px;overflow:hidden}
  #rest .bar i{display:block;height:100%;background:var(--grad);width:100%}
  #rest button{flex:0 0 auto;width:auto}
  /* nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:35;background:rgba(13,15,20,.92);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
  nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
  nav.tabs button{background:none;border:0;color:var(--muted2);padding:6px 0;display:flex;flex-direction:column;
    align-items:center;gap:3px;font-size:10.5px;cursor:pointer;font-family:inherit}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button.on{color:var(--accent)}
  /* misc */
  .toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--good);color:#062417;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;
    z-index:60;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px}
  .histday{border-bottom:1px solid var(--line);padding:11px 0}
  .histday:last-child{border-bottom:0}
  .disc{font-size:11.5px;color:var(--muted2);margin-top:6px;line-height:1.5}
  .toggle{width:46px;height:28px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);
    position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
  .toggle.on{background:var(--good);border-color:var(--good)}
  .toggle i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
  .toggle.on i{left:20px}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--card2);color:var(--text)}
  ul.lean{margin:8px 0 0;padding-left:18px} ul.lean li{margin-bottom:7px;font-size:13.5px}
  .kpi-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kpi-row:last-child{border-bottom:0}
  a.link{color:var(--accent);text-decoration:none}
  svg.chart{display:block;width:100%;height:auto;overflow:visible}
  .axis{fill:var(--muted2);font-size:10px}
  .volrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px}
  .volrow .lbl{width:82px;color:var(--muted)}
  .volrow .track{flex:1;background:var(--bg2);border-radius:4px;position:relative;height:14px}
  .volrow .bar{height:100%;border-radius:4px;background:var(--accent)}
  .volrow .n{width:30px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  details{margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  details summary{padding:14px;font-weight:650;cursor:pointer;list-style:none;font-size:14.5px}
  details summary::-webkit-details-marker{display:none}
  details summary:after{content:"+";float:right;color:var(--muted2)}
  details[open] summary:after{content:"–"}
  details .body{padding:0 14px 14px;color:var(--muted);font-size:13.5px;line-height:1.55}
  details .body a{color:var(--accent)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none;align-items:flex-end;justify-content:center}
  .modal.on{display:flex}
  .modal .sheet{background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    width:100%;max-width:560px;max-height:82vh;overflow:auto;border:1px solid var(--line);border-bottom:0}
  .subopt{display:block;width:100%;text-align:left;margin:6px 0;padding:13px;border-radius:10px;
    background:var(--card2);border:1px solid var(--line);color:var(--text);font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand row">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg></div>
      <div><h1>Sculpt</h1><div class="sub">science-based · legs · core · arms</div></div>
      <div class="grow"></div>
      <div class="chip" id="hdrChip">4-day</div>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="rest">
  <span class="t" id="restT">0:00</span>
  <div class="bar"><i id="restBar"></i></div>
  <button class="btn sm ghost" onclick="restAdd(15)">+15s</button>
  <button class="btn sm primary" onclick="stopRest()">Skip</button>
</div>

<nav class="tabs"><div class="in">
  <button id="nav-train" onclick="go('train')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg><span>Train</span></button>
  <button id="nav-history" onclick="go('history')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg><span>History</span></button>
  <button id="nav-progress" onclick="go('progress')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg><span>Progress</span></button>
  <button id="nav-guide" onclick="go('guide')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg><span>Guide</span></button>
  <button id="nav-settings" onclick="go('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
</div></nav>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="modal-body"></div></div>
<input type="file" id="importFile" accept="application/json" style="display:none" />

<script>
"use strict";
/* ============================================================
   EXERCISE DATABASE
   Selection + cues reflect current hypertrophy research and the
   teaching of coaches like Bret Contreras (glutes) and Jeff
   Nippard. Stretch/lengthened-position emphasis is built into the
   cues (Maeo 2021 — seated leg curl; incline curl; etc.).
   mg = primary muscle (counts 1 set), mg2 = secondary (0.5).
   inc = weight jump (lb). inc:0 = bodyweight/time, reps-progress.
   shoulder:{lvl:'caution'|'avoid', note, subId} for the injury.
   ============================================================ */
const EX = {
  /* ---- GLUTES / HAMS / QUADS ---- */
  hipthrust:{name:"Barbell Hip Thrust", mg:["Glutes"], mg2:["Hamstrings"], inc:10, rest:120, bar:true,
    why:"The #1 glute builder — loads the glutes hardest at full hip extension (Contreras EMG). Grows glutes as well as squats, with a bit more on the glutes specifically.",
    cues:["Upper back on the bench, chin tucked, ribs down","Drive through your heels to full lockout — squeeze the glutes 1 sec at the top","Tuck the pelvis under at the top; don't arch the low back"],
    q:"Bret Contreras barbell hip thrust form", subs:["gluteback","cablekickback","stepup"]},
  gobletsquat:{name:"Goblet Squat", mg:["Quads","Glutes"], inc:5, rest:90,
    why:"A joint-friendly squat that's easy to load progressively and reach real depth — great quad + glute developer.",
    cues:["Hold the dumbbell at your chest, elbows down","Sit straight down between your hips, heels flat","Knees track over toes; go as deep as you control"],
    q:"goblet squat proper form", subs:["backsquat","legpress","walkinglunge"]},
  backsquat:{name:"Barbell Back Squat", mg:["Quads","Glutes"], inc:5, rest:150, bar:true,
    why:"Best all-round lower-body builder; squats grow quads and adductors more than hip thrusts and glutes just as well (Plotkin 2023).",
    cues:["Bar on your upper back, big brace before you descend","Sit down to at least parallel, knees out","Drive the floor apart on the way up"],
    q:"Squat University how to squat", subs:["gobletsquat","legpress"]},
  legpress:{name:"Leg Press", mg:["Quads","Glutes"], inc:10, rest:120,
    why:"Lets you push the quads/glutes hard with zero balance or shoulder demand — easy to add weight every week.",
    cues:["Feet mid-platform, shoulder width","Lower until knees reach your chest under control — deep range","Don't lock the knees out hard at the top"],
    q:"Jeff Nippard leg press technique", subs:["gobletsquat","backsquat"]},
  bulgarian:{name:"Bulgarian Split Squat", mg:["Quads","Glutes"], mg2:["Hamstrings"], inc:5, rest:90,
    why:"Unilateral — fixes side-to-side imbalances and hammers the glutes through a big stretch. A favorite for shaping the lower body.",
    cues:["Rear foot on a bench, most weight on the front leg","Lean the torso forward slightly to bias the glute","Drop straight down, knee toward the toes, full depth"],
    q:"Bulgarian split squat form glutes", subs:["walkinglunge","stepup","gobletsquat"]},
  walkinglunge:{name:"Walking Lunge", mg:["Quads","Glutes"], inc:5, rest:75,
    why:"Long-stride lunges put the glute under a deep stretch each rep — strong stimulus and great for the legs.",
    cues:["Take a long step; drop the back knee toward the floor","Push through the front heel to stand and step through","Stay tall, brace the core"],
    q:"walking lunge proper form glutes", subs:["bulgarian","stepup"]},
  stepup:{name:"Dumbbell Step-Up", mg:["Glutes","Quads"], inc:5, rest:75,
    why:"Knee-high step-ups bias the glute strongly and are very low-stress on the joints.",
    cues:["Use a box that puts the thigh at ~parallel","Drive through the top heel — minimal push from the bottom foot","Control the way down"],
    q:"dumbbell step up form glutes", subs:["bulgarian","walkinglunge"]},
  rdl:{name:"Romanian Deadlift", mg:["Hamstrings","Glutes"], inc:5, rest:120, bar:true,
    why:"Trains the hamstrings and glutes at long muscle length (the stretch) — one of the best posterior-chain builders.",
    cues:["Soft knees, push the hips back, bar/dumbbells drag down the thighs","Go until you feel a strong hamstring stretch — not the floor","Squeeze the glutes to stand tall; flat back throughout"],
    q:"Jeff Nippard romanian deadlift technique", subs:["seatedlegcurl","gluteback"]},
  seatedlegcurl:{name:"Seated Leg Curl", mg:["Hamstrings"], inc:5, rest:75,
    why:"Seated (hip-flexed) curls train the hamstrings at a longer length and built MORE muscle than lying curls in a 12-wk MRI study (Maeo 2021).",
    cues:["Pad snug above the heels, thighs locked down","Curl all the way, control a 2–3 sec stretch back","Let the hamstring fully lengthen each rep"],
    q:"seated leg curl form hamstrings", subs:["rdl","gluteback"]},
  legext:{name:"Leg Extension", mg:["Quads"], inc:5, rest:75,
    why:"Isolates the quads (incl. the rectus femoris that squats miss). Lean back slightly to train them at a longer length.",
    cues:["Line your knee up with the machine pivot","Pause and squeeze at the top","3-second lowering — control the stretch"],
    q:"Jeff Nippard leg extension technique", subs:["legpress","gobletsquat"]},

/* ============================================================ PROGRESSION ENGINE
   Transparent double progression:
   - Hit the TOP of the rep range on every set at target effort -> add the
     smallest jump, rebuild from the bottom.
   - Below the bottom two sessions running -> back off ~10%.
   - Otherwise -> same weight, add a rep.
   Bodyweight/time moves (inc:0) progress by reps/seconds only.
   Deload: -20% load, half the sets. */
function lastPerfs(exId,n){
  const out=[];
  for(let i=DB.history.length-1;i>=0&&out.length<n;i--){
    const w=DB.history[i]; if(w.deload) continue;
    for(const en of w.entries){ if(en.ex===exId && en.sets.length){ out.push({date:w.date, sets:en.sets}); break; } }
  }
  return out;
}
function recommend(slot){
  const exId=exIdFor(slot), ex=EXD(exId)||{inc:5,name:exId};
  const hist=lastPerfs(exId,2);
  const isBW = ex.inc===0;
  if(!hist.length){
    return {type:"find", weight:isBW?"":null, repsAim:slot.lo,
      text:isBW?("First time — aim "+slot.lo+"–"+slot.hi):"First time — find your working weight",
      why:isBW?("Pick a number you can hit cleanly around "+slot.lo+"–"+slot.hi+", leaving a rep or two in the tank. The engine then asks you to beat it.")
              :("Choose a load you could do for ~"+slot.lo+"–"+slot.hi+" reps with "+slot.rir+" left in the tank. Err light — the engine takes over next session.")};
  }
  const last=hist[0];
  if(isBW){
    const best=Math.max(...last.sets.map(s=>s.r||0));
    const aim=best+1;
    return {type:"reps", weight:"", repsAim:aim,
      text:"Beat last time — aim "+aim+(slot.id&&EX[slot.ex]&&EX[slot.ex].inc===0&&ex.name==="Plank"?" sec":""),
      why:"Last time: "+last.sets.map(s=>s.r).join(", ")+". Add a rep (or a few seconds) wherever you can — that's progressive overload for bodyweight moves."};
  }
  const w0=Math.max(...last.sets.map(s=>s.w||0));
  const top=last.sets.filter(s=>(s.w||0)>=w0);
  const allTop = top.length>0 && top.every(s=> s.r>=slot.hi && (s.rir==null || s.rir>=slot.rir || s.fail));
  const anyBelow = top.some(s=> s.r<slot.lo);
  const prevBelow = hist[1] && Math.max(...hist[1].sets.map(s=>s.w||0))>=w0 && hist[1].sets.some(s=> s.r<slot.lo);
  let rec;
  if(allTop){
    const nw=roundInc(w0+unitInc(ex),ex);
    rec={type:"up", weight:nw, repsAim:slot.lo, text:"⬆ Go up to "+nw+" "+DB.settings.units+" × "+slot.lo+"+",
      why:"Last session you hit "+slot.hi+"+ reps on every set at "+w0+" "+DB.settings.units+" at the target effort. Add the smallest jump and rebuild reps from "+slot.lo+"."};
  } else if(anyBelow && prevBelow){
    const nw=roundInc(w0*0.9,ex);
    rec={type:"down", weight:nw, repsAim:slot.lo, text:"⬇ Back off to "+nw+" "+DB.settings.units,
      why:"Two sessions below "+slot.lo+" reps at "+w0+" "+DB.settings.units+". Take ~10% off, own the range again, then climb back — grinding a stall just buries recovery."};
  } else {
    const best=Math.max(...top.map(s=>s.r));
    const aim=Math.min(slot.hi,best+1);
    rec={type:"reps", weight:w0, repsAim:aim, text:"Same weight ("+w0+" "+DB.settings.units+") — beat your reps",
      why:"Last time: "+top.map(s=>s.r).join(", ")+" reps at "+w0+" "+DB.settings.units+". Add a rep where you can (aim "+aim+"). When every set reaches "+slot.hi+", the weight goes up."};
  }
  if(DB.settings.deload && rec.weight){
    rec.weight=roundInc(rec.weight*0.8,ex); rec.type="deload";
    rec.text="Deload: "+rec.weight+" "+DB.settings.units+" — easy sets";
    rec.why="Deload week: 20% off and half the sets, 4+ reps in reserve. You're shedding fatigue, not chasing growth this week.";
  }
  return rec;
}
function warmupPlan(workW,ex){
  if(!workW || !ex.bar) return null;
  const bar=DB.settings.units==="kg"?20:45, steps=[];
  if(workW>bar*1.3) steps.push(bar+" × 8");
  [0.5,0.7,0.87].forEach((p,i)=>{ const w=roundInc(workW*p,ex); if(w>bar && w<workW) steps.push(w+" × "+[5,3,1][i]); });
  return steps.length?steps:null;
}
function bestE1RM(exId){ let b=0; for(const w of DB.history){ if(w.deload)continue; for(const en of w.entries){ if(en.ex!==exId)continue; for(const s of en.sets){ const v=e1rm(s.w,s.r,s.rir); if(v>b)b=v; } } } return b; }
function bestRepsAt(exId,wt){ let b=0; for(const w of DB.history){ if(w.deload)continue; for(const en of w.entries){ if(en.ex!==exId)continue; for(const s of en.sets){ if(s.w===wt&&s.r>b)b=s.r; } } } return b; }
function heaviestSet(exId){ let b=null; for(const w of DB.history){ if(w.deload)continue; for(const en of w.entries){ if(en.ex!==exId)continue; for(const s of en.sets){ if(!b||s.w>b.w||(s.w===b.w&&s.r>b.r))b=s; } } } return b; }

function restAdd(s){ restEnd+=s*1000; tickRest(); }

    })};

}

function discardSession(){ modal(`<h3 style="margin-top:0">Discard this workout?</h3><div class="muted" style="margin-bottom:14px">Logged sets will be lost.</div>

function finishSession(){
  const a=DB.active;
  const entries=a.entries.map(en=>({ slot:en.slot, ex:en.ex, exName:dispName(en), note:en.note,
    sets:en.sets.filter(s=>s.r!==""&&s.r>0).map(s=>({w:s.w===""?0:s.w, r:s.r, rir:(s.rir==="F"?0:+s.rir), fail:s.rir==="F", t:s.t||undefined})) }))
    .filter(en=>en.sets.length);
  if(!entries.length){ toast("Log at least one set first"); return; }
  // PR detection
  const prs=[];
  for(const en of entries){ const prev=bestE1RM(en.ex); const now=Math.max(...en.sets.map(s=>e1rm(s.w,s.r,s.rir))); if(prev&&now>prev*1.001) prs.push(dispNameOf(en.ex)); }
  const dur=Math.max(1,Math.round((Date.now()-new Date(a.date).getTime())/60000));
  DB.history.push({ id:a.id, date:a.date, dayIdx:a.dayIdx, dayName:a.dayName, program:a.program, deload:a.deload, dur:dur, entries:entries });
  DB.active=null; save(); stopRest(); go("train");
  if(DB.history.length%8===0) toast("Saved 💪 — "+DB.history.length+" logged. Back up in Settings!");
  else if(prs.length) toast("🎉 New strength PR: "+prs.slice(0,2).join(", "));

  else DB.swaps[slotId]=exId;
  DB.active.entries[si].ex=exId;

function plateSheet(si){
  const en=DB.active.entries[si];
  const w=+(en.sets.find(s=>s.w!=="")||{}).w||0;
  const u=DB.settings.units, bar=u==="kg"?20:45;

  modal(`<h3 style="margin-top:0">Plate math</h3><div class="muted">${w||"—"} ${u} total · ${bar} ${u} bar</div>

}

function weekVolume(weeksAgo){
  const now=new Date(); const dow=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-dow-7*weeksAgo);
  const sun=new Date(mon); sun.setDate(mon.getDate()+7);
  const v={}; MUSCLES.forEach(m=>v[m]=0);
  for(const w of DB.history){ const d=new Date(w.date); if(d<mon||d>=sun) continue;
    for(const en of w.entries){ const ex=EXD(en.ex); if(!ex)continue;
      (ex.mg||[]).forEach(m=>{ if(v[m]!=null) v[m]+=en.sets.length; });
      (ex.mg2||[]).forEach(m=>{ if(v[m]!=null) v[m]+=en.sets.length*0.5; }); } }
  return v;
}
function lineChart(pts,decimals){
  if(pts.length<1) return '<div class="xs">No data yet.</div>';
  const W=496,H=150,P=26;
  const xs=pts.map(p=>p.t), ys=pts.map(p=>p.v);
  const x0=Math.min(...xs), x1=Math.max(...xs)||x0+1; let y0=Math.min(...ys),y1=Math.max(...ys); if(y0===y1){y0*=.96;y1*=1.04;}
  const X=t=>P+(W-2*P)*(x1===x0?.5:(t-x0)/(x1-x0)), Y=v=>H-P-(H-2*P)*((v-y0)/(y1-y0));
  const path=pts.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
  const f=v=>decimals?v.toFixed(1):Math.round(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a3e635"/></linearGradient></defs>
    <text class="axis" x="${P}" y="${Y(y1)-5}">${f(y1)} ${DB.settings.units}</text>
    <text class="axis" x="${P}" y="${Y(y0)+12}">${f(y0)}</text>
    <path d="${path}" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.2" fill="#a3e635"/>`).join("")}</svg>`;
}
function drawCharts(){
  const e1=$("#chartE1");
  if(e1&&chartEx){ const pts=[]; for(const w of DB.history){ if(w.deload)continue; for(const en of w.entries){ if(en.ex!==chartEx)continue; const b=Math.max(...en.sets.map(s=>e1rm(s.w,s.r,s.rir))); if(isFinite(b)&&b>0) pts.push({t:new Date(w.date).getTime(),v:b}); } } e1.innerHTML=lineChart(pts,false); }
  const bw=$("#chartBW");
  if(bw){ const cut=Date.now()-160*864e5; const pts=DB.bodyweights.map(b=>({t:new Date(b.date).getTime(),v:b.w})).filter(p=>p.t>=cut); bw.innerHTML=pts.length<2?'<div class="xs">Log a few weigh-ins to see the trend line.</div>':lineChart(pts,true); }
  const va=$("#volAudit");
  if(va){ const wk=weekVolume(0); let rows=""; for(const m of MUSCLES){ const val=wk[m],pct=Math.min(100,val/VOL_HI*100); const col=val>=VOL_LO?"var(--good)":(val>0?"var(--warn)":"var(--line)");
    rows+=`<div class="volrow"><div class="lbl">${m==="Abs"?"Core":m}</div><div class="track"><div style="position:absolute;left:${VOL_LO/VOL_HI*100}%;top:0;bottom:0;width:1px;background:var(--muted2)"></div><div class="bar" style="width:${pct}%;background:${col}"></div></div><div class="n">${val%1?val.toFixed(1):val}</div></div>`; }
    va.innerHTML=rows+`<div class="xs" style="margin-top:6px">Tick = ${VOL_LO}-set minimum. Build toward the band on your priority muscles.</div>`; }
}
function logBW(inputId){
  const el=$("#"+inputId); const v=parseFloat(el.value); if(!v||v<=0){ toast("Enter a weight"); return; }
  const t=todayISO(); DB.bodyweights=DB.bodyweights.filter(b=>b.date!==t); DB.bodyweights.push({date:t,w:v});
  DB.bodyweights.sort((a,b)=>a.date<b.date?-1:1); DB.profile.weight=v; save(); render(); toast("Logged "+v+" "+DB.settings.units);
}

/* ============================================================ GUIDE */
function rGuide(){
  const p=curProgram(), pr=DB.profile;
  const pLo=Math.round(pr.weight*0.8), pHi=Math.round(pr.weight*1.0);
  const principles=[
    ["Progressive overload is the whole game","Muscle grows when you ask it to do a little more over time. Each exercise's box tells you exactly how — hit the top of the rep range on every set, then add the smallest weight jump and rebuild. The app does the math; you just beat last time.","progressive overload explained"],
    ["Train close to failure (1–3 reps in reserve)","Effort drives growth. Most sets should end 1–3 reps short of failure; isolation work can go to failure. Log RIR honestly — the progression engine runs on it.","how hard should you train to failure RIR"],
    ["Glutes: hip thrusts AND squats","A 2023 study found hip thrusts and squats grow the glutes about equally — hip thrusts slightly more on the glutes, squats more on quads & adductors. That's why both anchor your leg days. Direct glute work (abduction, kickbacks) shapes the upper glute.","Bret Contreras hip thrust vs squat glutes"],
    ["Train muscles in the stretch","Loading a muscle when it's long is a powerful growth driver. Seated leg curls beat lying curls for hamstrings in a 12-week MRI study; the same idea makes incline curls, RDLs and deep lunges so effective. Control the lengthening phase.","training lengthened position stretch hypertrophy"],
    ["Volume: ~10–20 hard sets per muscle / week","Under ~10 leaves gains on the table; past ~20 is mostly fatigue. Start near the bottom and add sets only when progress stalls. The Progress tab audits this for you.","how many sets per muscle per week"],
    ["Hit each muscle ~2× per week","Spreading volume over two sessions beats one giant day — better quality sets, same total work. Every split here does that.","training frequency twice per week"],
    ["Eat & sleep to lean up","~"+pLo+"–"+pHi+" g protein/day, a small calorie deficit (~250–400) for ~0.5 lb/wk, 8–10k steps, and 7–9 h sleep. Slow loss + lifting hard = you keep the muscle and lose the fat.","protein intake to build muscle lose fat"],
  ];
  let h=`<div class="card"><div style="font-weight:650;font-size:16px">${esc(p.name)}</div>
    <p class="small muted" style="margin:8px 0 0">A recomposition plan focused on legs, core and arms — built so you can add a little each week and watch it on the Progress tab. Tap any exercise's <b>📋 Cues</b> and <b>▶ Video</b> during a workout for form.</p></div>`;
  h+=`<h2 class="section">Principles (the app's actual logic)</h2>`;
  h+=principles.map(p=>`<details><summary>${p[0]}</summary><div class="body">${p[1]}<br><br><a href="${ytq(p[2])}" target="_blank" rel="noopener">▶ Watch a coach explain it</a></div></details>`).join("");
  h+=`<h2 class="section">Shoulder-safe approach</h2><div class="card"><ul class="lean">
    <li>No heavy overhead pressing in any program — by design.</li>
    <li>Pressing is limited to <b>incline DB ≤30°</b> with tucked elbows; swap to push-ups or cable fly if anything pinches.</li>
    <li><b>Face pulls</b> + light lateral raises build the rear delt / rotator cuff to keep the joint healthy.</li>
    <li>Shoulder-safe mode (Settings) auto-swaps overhead moves like overhead triceps for friendly versions and flags anything to be careful with.</li>
    <li>Pain is a stop signal — and a one-time check with a physio for the injury is worth it.</li></ul></div>`;
  h+=`<h2 class="section">Lean-up basics</h2><div class="card"><ul class="lean">
    <li><b>Protein:</b> ~${pLo}–${pHi} g/day (0.8–1 g/lb) — protects muscle in a deficit.</li>
    <li><b>Calories:</b> small deficit (~250–400/day) for ≈0.5 lb/wk. Slow loss keeps strength & curves.</li>
    <li><b>Steps/cardio:</b> 8–10k steps + 2–3 easy zone-2 sessions (20–30 min).</li>
    <li><b>Sleep:</b> 7–9 h — biggest lever for recovery and the shoulder.</li>
    <li><b>Judge progress</b> by the weekly weight average (Progress tab), the mirror, and lifts going up — not the daily scale.</li></ul></div>`;
  h+=`<h2 class="section">Full program</h2>`;
  p.days.forEach((d,i)=>{ h+=`<div class="card"><div style="font-weight:650">Day ${i+1} · ${esc(d.name)}</div>
    <div style="margin-top:8px">${d.slots.map(slot=>{ const id=exIdFor(slot),ex=EXD(id); return `<div class="kpi-row"><span>${esc(ex?ex.name:id)}${autoSwapped(slot)?' <span class="xs" style="color:var(--good)">↺</span>':''}</span><span class="muted">${slot.sets}×${slot.lo}–${slot.hi}</span></div>`; }).join("")}</div></div>`; });
  h+=`<p class="disc">Sources: Contreras et al. EMG (2015) &amp; hip-thrust vs squat hypertrophy (Frontiers in Physiology, 2023); Maeo et al. seated vs lying leg curl (2021). Sculpt is general fitness guidance, not medical advice — clear the shoulder injury with a clinician.</p>`;
  return h;
}

/* ============================================================ SETTINGS */
function rSettings(){
  const pr=DB.profile, st=DB.settings;
  return `<h2 class="section">Profile</h2><div class="card">
    <label class="fld"><span class="lab">Name</span><input id="pName" value="${esc(pr.name)}" placeholder="Your name"></label>
    <div class="grid3">
      <label class="fld"><span class="lab">Age</span><input id="pAge" type="number" value="${pr.age}"></label>
      <label class="fld"><span class="lab">Height ft</span><input id="pFt" type="number" value="${pr.heightFt}"></label>
      <label class="fld"><span class="lab">in</span><input id="pIn" type="number" value="${pr.heightIn}"></label></div>
    <div class="grid2">
      <label class="fld" style="margin:0"><span class="lab">Weight (${st.units})</span><input id="pWt" type="number" value="${pr.weight}"></label>
      <label class="fld" style="margin:0"><span class="lab">Goal</span><input id="pGoal" value="${esc(pr.goal)}"></label></div>
    <button class="btn primary" style="margin-top:6px" onclick="saveProfile()">Save profile</button></div>

  <h2 class="section">Training split</h2><div class="card">
    <div class="seg">${[3,4,5].map(n=>`<button class="${st.program===n?'on':''}" onclick="setProgram(${n})">${n}-day</button>`).join("")}</div>
    <p class="small muted" style="margin:10px 2px 0">${esc(PROGRAMS[st.program].name)} — all emphasize legs, core &amp; arms. Pick by how many days you can train.</p></div>

  <h2 class="section">Options</h2><div class="card">
    <div class="row between" style="margin-bottom:14px"><div><div style="font-weight:600">Shoulder-safe mode</div><div class="small muted" style="margin-top:2px">Swap overhead lifts &amp; flag risky ones</div></div>
      <div class="toggle ${st.shoulderSafe?'on':''}" onclick="DB.settings.shoulderSafe=!DB.settings.shoulderSafe;save();render()"><i></i></div></div>
    <div class="row between" style="margin-bottom:14px"><div><div style="font-weight:600">Deload week</div><div class="small muted" style="margin-top:2px">−20% load, half the sets</div></div>
      <div class="toggle ${st.deload?'on':''}" onclick="DB.settings.deload=!DB.settings.deload;save();render()"><i></i></div></div>
    <div class="row between"><div style="font-weight:600">Units</div>
      <div class="seg" style="width:140px"><button class="${st.units==='lb'?'on':''}" onclick="DB.settings.units='lb';save();render()">lb</button><button class="${st.units==='kg'?'on':''}" onclick="DB.settings.units='kg';save();render()">kg</button></div></div></div>

  <h2 class="section">Your data</h2><div class="card">
    <p class="small muted" style="margin:0 0 12px">Stored on this device only (private). Export a backup so you never lose your log.</p>
    <div class="btn-row" style="margin-bottom:10px"><button class="btn" onclick="exportData()">Export backup</button><button class="btn" onclick="document.getElementById('importFile').click()">Import</button></div>
    <button class="btn danger" onclick="resetAll()">Reset all data</button></div>
  <p class="disc">Part of your <a class="link" href="../index.html">daily dashboard</a>. Add to home screen for the full-screen app. Not medical advice.</p>`;
}
function saveProfile(){
  DB.profile.name=$("#pName").value.trim();
  DB.profile.age=+$("#pAge").value||DB.profile.age;
  DB.profile.heightFt=+$("#pFt").value||DB.profile.heightFt;
  DB.profile.heightIn=+$("#pIn").value||0;
  DB.profile.weight=+$("#pWt").value||DB.profile.weight;
  DB.profile.goal=$("#pGoal").value.trim()||DB.profile.goal;
  save(); toast("Profile saved"); render();
}
function setProgram(n){ DB.settings.program=n; save(); render(); toast(n+"-day split selected"); }
function exportData(){ const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="sculpt-backup-"+todayISO()+".json"; a.click(); URL.revokeObjectURL(a.href); toast("Backup downloaded"); }
$("#importFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||(!d.history&&!d.sessions)) throw 0; DB=d.version===2?Object.assign(freshDB(),d):d; if(DB.version!==2){ localStorage.setItem(KEY,JSON.stringify(d)); DB=load(); } save(); DB.active=null; render(); toast("Backup imported"); }catch(err){ toast("Invalid backup file"); } }; r.readAsText(f); e.target.value=""; });
function resetAll(){ modal(`<h3 style="margin-top:0">Erase everything?</h3><div class="muted" style="margin-bottom:14px">All workouts, weigh-ins and settings. Export a backup first — this can't be undone.</div>
  <div class="btn-row"><button class="btn ghost grow" onclick="closeModal()">Cancel</button>
  <button class="btn grow" style="background:var(--bad);color:#2a0d0d" onclick="localStorage.removeItem(KEY);DB=freshDB();save();closeModal();go('train')">Erase</button></div>`); }

/* ============================================================ SHARED */
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove("show"),2400); }
function modal(html){ $("#modal-body").innerHTML=html; $("#modal").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });

/* first-run defaults already handled by freshDB(); just render */
render();

/* PWA */
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("../sw.js");
if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
</script>
</body>
</html>
