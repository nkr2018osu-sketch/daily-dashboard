<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#b5663f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Dashboard" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" />
<title>Daily Dashboard</title>
<style>
  :root{
    --bg:#f3ede2; --card:#fffdf8; --ink:#3a3530; --muted:#8a8178; --line:#e7ddcd;
    --terra:#b5663f; --terra-soft:#f0dccf; --sage:#6f7d5e; --sage-soft:#e2e8d6;
    --amber:#c08a2d; --amber-soft:#f3e6c8; --teal:#3f8c86; --sand:#d9b98c;
    --shadow:0 1px 2px rgba(60,45,30,.06), 0 6px 18px rgba(60,45,30,.05);
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:600px; margin:0 auto; padding:14px 14px 60px;}

  header.app{position:sticky; top:0; z-index:20; background:linear-gradient(var(--bg) 75%, rgba(243,237,226,0)); padding:6px 2px 10px;}
  .title{font-family:Georgia,"Times New Roman",serif; font-size:23px; font-weight:600; letter-spacing:.2px; margin:0 0 8px;}
  .title .dot{color:var(--terra);}
  .datenav{display:flex; align-items:center; gap:8px;}
  .datenav .lbl{flex:1; text-align:center; font-weight:600; font-size:15px;}
  .datenav .sub{display:block; font-weight:400; font-size:12px; color:var(--muted);}
  .navbtn{border:1px solid var(--line); background:var(--card); color:var(--ink); width:38px; height:38px; border-radius:11px; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .navbtn:active{background:var(--terra-soft);}
  .todaybtn{border:1px solid var(--line); background:var(--card); border-radius:11px; padding:0 12px; height:38px; font-size:13px; font-weight:600; color:var(--terra); cursor:pointer;}

  .banner{background:var(--amber-soft); border:1px solid #e6cf9a; color:#7a5a14; border-radius:12px; padding:9px 12px; font-size:13px; margin:0 0 12px;}

  section.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin:0 0 14px;}
  .sechead{display:flex; align-items:center; gap:8px; margin:0 0 10px;}
  .sechead h2{font-family:Georgia,serif; font-size:16px; margin:0; font-weight:600; flex:1;}
  .sechead .meta{font-size:12px; color:var(--muted);}
  .pill{font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--terra-soft); color:var(--terra);}

  .tabs{display:flex; gap:6px; margin:0 0 12px;}
  .tab{flex:1; text-align:center; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:7px 4px; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer;}
  .tab.on{background:var(--terra); color:#fff; border-color:var(--terra);}
  .tab.on.soon{background:var(--amber); border-color:var(--amber);}
  .tab.on.green{background:var(--sage); border-color:var(--sage);}
  .tab.on.teal{background:var(--teal); border-color:var(--teal);}

  /* weather strip */
  .wx{display:flex; align-items:center; gap:10px; padding:8px 11px; background:var(--sage-soft); border:1px solid #d4ddc4; border-radius:12px; margin:0 0 12px; font-size:13.5px;}
  .wx .big{font-size:22px;}
  .wx .hi{font-weight:700;}
  .wx .lo{color:var(--muted);}
  .wx .rain{margin-left:auto; color:var(--teal); font-weight:600; font-size:12.5px;}

  /* agenda */
  .evt{display:flex; gap:8px; padding:5px 0 2px; align-items:baseline;}
  .evt .t{font-size:12px; color:var(--terra); font-weight:700; min-width:62px;}
  .evt .body{flex:1;}
  .evt .nm{font-size:14px;}
  .evt .loc{font-size:11.5px; color:var(--muted);}
  .noevt{font-size:12.5px; color:#b9af9f; padding:3px 0 2px; font-style:italic;}
  .agendahead{font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:10px 0 2px;}
  .agendahead:first-child{margin-top:0;}

  .task{display:flex; gap:11px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line);}
  .task:first-of-type{border-top:none;}
  .check{flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--terra); background:transparent; cursor:pointer; margin-top:1px; position:relative;}
  .check.bill{border-radius:7px; border-color:var(--amber);}
  .check.soon{border-color:var(--amber);}
  .check.later{border-color:var(--line);}
  .check.done{background:var(--sage); border-color:var(--sage);}
  .check.done::after{content:"✓"; color:#fff; font-size:14px; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .task .info{flex:1; min-width:0;}
  .task .nm{font-size:14.5px;}
  .task .sub{font-size:12px; color:var(--muted); margin-top:1px;}
  .task .sub .due{color:var(--terra); font-weight:700;}
  .task .sub .soon{color:var(--amber); font-weight:700;}
  .task .note{font-size:12px; color:var(--muted); margin-top:3px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:5px 8px; display:none;}
  .task.open .note{display:block;}
  .cat{font-size:10px; font-weight:700; color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:1px 6px; margin-left:6px; white-space:nowrap;}
  .snz{flex:none; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:12px; cursor:pointer; padding:3px 8px; border-radius:9px; margin-top:1px;}
  .xbtn{flex:none; border:none; background:transparent; color:#c9bfb0; font-size:18px; cursor:pointer; padding:0 2px; line-height:1;}
  .empty{font-size:13px; color:var(--muted); padding:10px 2px; text-align:center;}
  .clearday{font-size:13px; color:var(--sage); padding:6px 2px; font-weight:600;}

  /* plan view */
  .pday{display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); align-items:flex-start;}
  .pday:first-child{border-top:none;}
  .pday .pd{min-width:74px;}
  .pday .pd .d1{font-size:12.5px; font-weight:700;}
  .pday .pd .d2{font-size:11px; color:var(--muted);}
  .pday.today .pd .d1{color:var(--terra);}
  .pday .pbody{flex:1; min-width:0;}
  .pday .pitem{font-size:13px; padding:1px 0;}
  .pday .pitem.bill{color:#8a6a1c;}
  .pday .pitem.evt2{color:var(--teal);}
  .pday .pitem .pin{font-size:10.5px; color:var(--muted);}
  .pday .free{font-size:12px; color:#b9af9f; font-style:italic;}
  .pday .pwx{font-size:11.5px; color:var(--muted); white-space:nowrap;}

  .uprow{display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); align-items:baseline;}
  .uprow:first-child{border-top:none;}
  .uprow .when{font-size:12px; font-weight:700; color:var(--terra); min-width:96px;}
  .uprow .nm{font-size:14px; flex:1;}
  .uprow .loc{font-size:11.5px; color:var(--muted);}

  .syncbar{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap;}
  .syncbtn{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:7px 11px; font-size:12.5px; font-weight:600; color:var(--terra); cursor:pointer;}
  .synchint{font-size:11.5px; color:var(--muted); flex:1; min-width:140px;}

  /* habits */
  .progress{height:8px; background:var(--bg); border-radius:6px; overflow:hidden; margin:2px 0 12px; border:1px solid var(--line);}
  .progress > i{display:block; height:100%; background:var(--sage); transition:width .25s;}
  .habit{display:flex; gap:11px; align-items:center; padding:8px 0; border-top:1px solid var(--line);}
  .habit:first-child{border-top:none;}
  .habit .hcheck{flex:none; width:24px; height:24px; border-radius:7px; border:2px solid var(--sage); background:transparent; cursor:pointer; position:relative;}
  .habit .hcheck.done{background:var(--sage);}
  .habit .hcheck.done::after{content:"✓"; color:#fff; font-size:14px; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .habit .hn{flex:1; font-size:14.5px;}
  .habit .hn.done{color:var(--muted); text-decoration:line-through;}
  .streak{font-size:11.5px; color:var(--amber); font-weight:700; white-space:nowrap;}

  /* journal */
  .field{margin:0 0 10px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin:0 0 4px;}
  textarea,input.txt,select.sel{width:100%; border:1px solid var(--line); border-radius:11px; background:#fffefb; padding:9px 11px; font:inherit; font-size:14px; color:var(--ink); resize:vertical;}
  textarea:focus,input.txt:focus{outline:none; border-color:var(--terra);}
  .savedtag{font-size:11px; color:var(--sage); opacity:0; transition:opacity .2s;}
  .savedtag.show{opacity:1;}

  /* breathwork */
  .breathstage{display:flex; flex-direction:column; align-items:center; padding:6px 0 4px;}
  .bcircle{width:180px; height:180px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:radial-gradient(circle at 50% 45%, var(--sage-soft), var(--card)); border:2px solid var(--sage);
    transition:transform 4s ease-in-out, background-color .6s, border-color .6s; transform:scale(.62);}
  .bcircle.out{border-color:var(--sand); background:radial-gradient(circle at 50% 45%, #f3e3cf, var(--card));}
  .bphase{font-size:15px; font-weight:700; color:var(--ink);}
  .bcount{font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--terra); margin-top:2px;}
  .bidle{font-size:13px; color:var(--muted); text-align:center;}
  .bbtn{display:block; width:100%; margin-top:12px; border:none; border-radius:12px; padding:12px; font-size:15px; font-weight:700; cursor:pointer; background:var(--teal); color:#fff;}
  .bbtn.stop{background:#b35442;}
  .btimer{font-size:12px; color:var(--muted);}

  /* projects */
  .proj{padding:11px 0; border-top:1px solid var(--line);}
  .proj:first-child{border-top:none;}
  .proj .top{display:flex; gap:10px; align-items:center;}
  .proj .pcheck{flex:none; width:22px; height:22px; border-radius:6px; border:2px solid var(--terra); background:transparent; cursor:pointer; position:relative;}
  .proj .pcheck.done{background:var(--terra);}
  .proj .pcheck.done::after{content:"✓"; color:#fff; font-size:13px; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .proj .pt{flex:1; font-size:15px; font-weight:600;}
  .proj .pt.done{color:var(--muted); text-decoration:line-through;}

  .addbtn{display:block; width:100%; margin-top:12px; border:1px dashed var(--terra); background:transparent; color:var(--terra); border-radius:11px; padding:10px; font-size:13.5px; font-weight:700; cursor:pointer;}

  /* sheet (editor / dialogs) */
  .ovl{position:fixed; inset:0; background:rgba(58,53,48,.45); z-index:60; display:none; align-items:flex-end; justify-content:center;}
  .ovl.on{display:flex;}
  .sheet{background:var(--card); border-radius:18px 18px 0 0; width:100%; max-width:600px; max-height:85vh; overflow:auto;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));}
  .sheet h3{font-family:Georgia,serif; margin:0 0 12px; font-size:17px;}
  .sheet .row2{display:flex; gap:8px;}
  .sheet .row2 > *{flex:1;}
  .btn{border:none; border-radius:11px; padding:12px 14px; font-size:14.5px; font-weight:700; cursor:pointer; background:var(--terra); color:#fff;}
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line);}
  .btn.danger{background:#b35442;}

  .foot{text-align:center; font-size:11px; color:#b9af9f; padding:8px 0 0;}
  .foot button{border:none; background:none; color:var(--terra); font-size:11px; font-weight:700; cursor:pointer; text-decoration:underline;}
</style>
</head>

    <div class="title">Daily Dashboard<span class="dot">.</span> <a href="workout/index.html" style="float:right;font-size:13px;text-decoration:none" title="Workout tracker">🏋️ Lift</a> <a href="sculpt/index.html" style="float:right;font-size:13px;text-decoration:none;margin-right:12px" title="Lean strength program">💪 Sculpt</a> <a href="storage/index.html" style="float:right;font-size:13px;text-decoration:none;margin-right:12px" title="Storage inventory">📦 Totes</a> <a href="fuel/index.html" style="float:right;font-size:13px;text-decoration:none;margin-right:12px" title="Meal &amp; calorie tracker">🥗 Fuel</a> <a href="chess/index.html" style="float:right;font-size:13px;text-decoration:none;margin-right:12px" title="Chess game review">♞ Review</a></div>

<script>
"use strict";
/* ================= storage (same keys as v1 — existing data survives) ================= */
var PFX = "dd_v1_";
var storageOK = true;
function lsGet(key, dflt){
  try{ var v = localStorage.getItem(PFX+key); return v===null ? dflt : JSON.parse(v); }
  catch(e){ return dflt; }
}
function lsSet(key, val){
  try{ localStorage.setItem(PFX+key, JSON.stringify(val)); return true; }
  catch(e){ storageOK=false; return false; }
}
(function testStorage(){
  try{ localStorage.setItem(PFX+"__t","1"); localStorage.removeItem(PFX+"__t"); }
  catch(e){ storageOK=false; }
})();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ================= date helpers ================= */
function pad(n){ return n<10 ? "0"+n : ""+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseYMD(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d, n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function dayDiff(a, b){
  var ms = new Date(a.getFullYear(),a.getMonth(),a.getDate()) - new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round(ms/86400000);
}
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtLong(d){ return DOW[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate(); }
function fmtShort(d){ return MON[d.getMonth()]+" "+d.getDate(); }
function fmtTime(t){ if(!t) return ""; var p=t.split(":"); var h=+p[0], m=p[1]; var ap=h>=12?"PM":"AM"; var hh=h%12; if(hh===0)hh=12; return hh+(m==="00"?"":":"+m)+" "+ap; }
function nth(n){ var s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function uid(){ return "id"+Math.random().toString(36).slice(2,9); }
function esc(s){ return (s==null?"":""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var TODAY = new Date(); TODAY = new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());
var view = new Date(TODAY);

/* ================= task seeds =================
   Tailored to 5747 Glendavon Pl (Dublin OH, built 2007, ~4300 sqft,
   irrigation, jacuzzi tub, central vac, gas fireplace, water softener,
   city sewer). flex = how many days the scheduler may shift the task
   to keep days to ~one task. Bills have flex 0 (fixed dates).      */
var SEED_MAINT = [
  // ----- weekly chores -----
  {id:"mow", name:"Mow the lawn", type:"interval", interval:7, flex:2, anchor:"2026-06-04", months:[4,5,6,7,8,9,10,11], cat:"Lawn",
   note:"Skip if drought-dormant. Sharpen blade each spring."},
  {id:"trash", name:"Roll out trash & recycling bins", type:"interval", interval:7, flex:0, anchor:"2026-06-16", cat:"Chores",
   note:"Dublin pickup is Wednesday — bins out by 7 AM. (Holiday weeks slide one day.)"},
  // ----- monthly -----
  {id:"smokeco", name:"Test smoke & CO detectors", type:"interval", interval:30, flex:4, anchor:"2026-06-12", cat:"Safety",
   note:"Press-hold test button on each floor. Batteries get replaced once a year (separate task)."},
  {id:"cvac", name:"Empty & clean central vac canister", type:"interval", interval:30, flex:4, anchor:"2026-06-18", cat:"Interior"},
  {id:"jacuzzi", name:"Run jacuzzi tub jet-clean cycle", type:"interval", interval:30, flex:4, anchor:"2026-06-22", cat:"Interior",
   note:"Fill 2\" above jets with hot water + ½ cup dishwasher detergent, run 10 min, drain, refill cold, run 10 min."},
  {id:"softener", name:"Check water softener salt", type:"interval", interval:30, flex:4, anchor:"2026-06-26", cat:"Systems",
   note:"Keep tank at least half full; break up any salt bridge with a broom handle."},
  {id:"hvaccheck", name:"Check HVAC filter", type:"interval", interval:30, flex:4, anchor:"2026-06-30", cat:"HVAC",
   note:"Hold it up to light — if you can't see through it, swap it (quarterly task covers the actual replacement)."},
  {id:"leakcheck", name:"Under-sink & faucet leak check", type:"interval", interval:30, flex:4, anchor:"2026-07-03", cat:"Systems",
   note:"All 4 baths + kitchen + laundry. Feel supply lines, look for staining."},
  // ----- quarterly -----
  {id:"hvacrep", name:"Replace HVAC filter", type:"interval", interval:90, flex:6, anchor:"2026-06-08", cat:"HVAC",
   note:"Two-story 4300 sqft likely = two furnaces/filters. Write the date on the frame."},
  {id:"dryervent", name:"Vacuum dryer vent & duct", type:"interval", interval:90, flex:6, anchor:"2026-06-19", cat:"Safety",
   note:"Pull the dryer, vacuum the duct and the outside flap. Lint fires are the #1 laundry hazard."},
  {id:"disposal", name:"Clean garbage disposal", type:"interval", interval:90, flex:6, anchor:"2026-06-24", cat:"Interior",
   note:"Ice cubes + coarse salt, grind, then citrus peel."},
  {id:"sump", name:"Test sump pump", type:"interval", interval:90, flex:6, anchor:"2026-07-01", cat:"Systems",
   note:"Pour a bucket of water into the pit — float should kick on and drain it. Critical before spring rains."},
  {id:"gfci", name:"Test GFCI outlets", type:"interval", interval:90, flex:6, anchor:"2026-07-08", cat:"Safety",
   note:"Press TEST then RESET on every GFCI (baths, kitchen, garage, exterior)."},
  {id:"hoodfilter", name:"Degrease range-hood filter", type:"interval", interval:90, flex:6, anchor:"2026-07-12", cat:"Appliances",
   note:"Soak in hot water + degreaser, or run through the dishwasher."},
  {id:"caulk", name:"Inspect caulking (kitchen & baths)", type:"interval", interval:90, flex:6, anchor:"2026-07-16", cat:"Interior"},
  {id:"fridge", name:"Clean refrigerator coils", type:"interval", interval:90, flex:6, anchor:"2026-07-22", cat:"Appliances"},
  // ----- semiannual -----
  {id:"fridgefilter", name:"Replace fridge water filter", type:"interval", interval:180, flex:8, anchor:"2026-07-26", cat:"Appliances"},
  {id:"gutters", name:"Clean gutters & check downspouts", type:"interval", interval:180, flex:8, anchor:"2026-11-05", cat:"Exterior",
   note:"Twice a year: after spring helicopters/blooms and after leaf drop. Watch for fascia rot while up there."},
  // ----- annual / seasonal -----
  {id:"fans", name:"Flip ceiling fans (summer ↺ / winter ↻)", type:"interval", interval:182, flex:8, anchor:"2026-10-28", cat:"Interior",
   note:"Counter-clockwise (downdraft) in summer; clockwise low in winter."},
  {id:"smokebatt", name:"Replace smoke/CO detector batteries", type:"interval", interval:365, flex:10, anchor:"2026-11-08", cat:"Safety",
   note:"Even hardwired units have backup batteries. Detectors older than 10 yrs (house is 2007 — check dates) get replaced."},
  {id:"garagespr", name:"Lubricate garage door springs & test auto-reverse", type:"interval", interval:365, flex:10, anchor:"2026-07-30", cat:"Exterior",
   note:"Silicone spray on springs/hinges/track. Lay a 2×4 under the door — it must reverse on contact."},
  {id:"grill", name:"Grill deep clean", type:"interval", interval:365, flex:10, anchor:"2026-06-15", cat:"Exterior"},
  {id:"deck", name:"Inspect deck/patio — clean & reseal if water soaks in", type:"interval", interval:365, flex:12, anchor:"2026-08-12", cat:"Exterior",
   note:"Sprinkle water on the boards: if it soaks in instead of beading, it's time to reseal."},
  {id:"driveway", name:"Inspect driveway & walkway cracks", type:"interval", interval:365, flex:12, anchor:"2026-09-09", cat:"Exterior",
   note:"Fill cracks before winter — Ohio freeze-thaw turns hairlines into spalls. Sealcoat every 2–3 yrs."},
  {id:"extpaint", name:"Exterior paint / stain / trim touch-up", type:"interval", interval:730, flex:14, anchor:"2026-09-20", cat:"Exterior"},

/* merge seeds into stored tasks: keep user's lastDone/snooze/custom tasks,
   refresh seed definitions (names, notes, flex), add new seed tasks unless removed */
(function migrate(){
  var stored = state.maint || [];
  var byId = {};
  stored.forEach(function(t){ byId[t.id]=t; });
  var out = [];
  SEED_MAINT.forEach(function(seed){
    if(state.removed.indexOf(seed.id)!==-1) return;
    var old = byId[seed.id];
    if(old && old.userEdited){ out.push(old); delete byId[seed.id]; return; } // user's edits win over seed refresh
    var t = JSON.parse(JSON.stringify(seed));
    if(old){ t.lastDone = old.lastDone||null; t.snooze = old.snooze||null; }
    else { t.lastDone = null; }
    out.push(t); delete byId[seed.id];
  });
  // user-added custom tasks
  Object.keys(byId).forEach(function(id){
    var t = byId[id];
    if(t.flex===undefined) t.flex = (t.type==="monthly")?0:Math.min(10, Math.max(2, Math.round((t.interval||30)/8)));
    out.push(t);
  });
  state.maint = out; save("maint");
})();

/* ================= scheduling engine =================
   Bills are pinned to their day of month. Flexible tasks are placed on
   the least-loaded day within [due − min(2,flex), due + flex], preferring
   an empty day closest to the natural due date — that's what enforces
   the "about one thing a day" rule. Deterministic for a given state.  */
var PLAN_HORIZON = 400; // days — covers every yearly task so "next" dates always show
var _plan = null;
function invalidatePlan(){ _plan = null; }
function monthAllowed(t, d){ return !t.months || t.months.indexOf(d.getMonth()+1)!==-1; }
/* days you're away (trips / multi-day all-day events) — chores avoid these */
function busyDaySet(){
  var busy={};
  (state.events.events||[]).forEach(function(e){
    var multi = e.end && e.end!==e.start;
    if(!(e.trip || (e.allDay && multi))) return;
    var d=parseYMD(e.start), en=e.end?parseYMD(e.end):d;
    while(d<=en){ busy[ymd(d)]=true; d=addDays(d,1); }
  });
  return busy;
}

function occurrencesFor(t){
  var occs=[], horizon=addDays(TODAY, PLAN_HORIZON);
  if(t.type==="monthly"){
    for(var m=-1;m<14;m++){
      var d=new Date(TODAY.getFullYear(), TODAY.getMonth()+m, Math.min(t.dayOfMonth,28));
      if(d>horizon) break;
      var paid = t.lastDone && (function(){ var ld=parseYMD(t.lastDone);
        return ld.getFullYear()===d.getFullYear() && ld.getMonth()===d.getMonth(); })();
      if(paid) continue;
      // past + unpaid (this month or last) → surface as overdue, up to 25 days back
      if(d<TODAY){ if(dayDiff(TODAY,d)<=25) occs.push(d); continue; }
      occs.push(d);
    }
    return occs;
  }
  // interval task
  var start;
  if(t.lastDone) start = addDays(parseYMD(t.lastDone), t.interval);
  else { start = parseYMD(t.anchor); while(start < addDays(TODAY,-t.interval)) start = addDays(start, t.interval); }
  if(t.snooze){ var sn=parseYMD(t.snooze); if(sn>start) start=sn; }
  var d2 = start, guard=0;
  while(d2<=horizon && guard<800){
    guard++;
    if(monthAllowed(t,d2)){ if(d2>=addDays(TODAY,-45)) occs.push(d2); d2=addDays(d2,t.interval); }
    else d2=addDays(d2,t.interval===7?7:Math.min(t.interval,30));
  }
  return occs;
}

function buildPlan(){
  if(_plan) return _plan;
  var load={}, items=[], busy=busyDaySet();
  function loadOf(ds){ return load[ds]||0; }
  function put(ds, item){ load[ds]=(load[ds]||0)+1; items.push(item); }
  // 1. fixed: bills + zero-flex tasks on their natural dates
  var flexOccs=[];
  state.maint.forEach(function(t){
    occurrencesFor(t).forEach(function(due){
      var overdue = dayDiff(due,TODAY)<0;
      if(t.type==="monthly" || !t.flex){
        var day = overdue ? TODAY : due;
        put(ymd(day), {t:t, due:due, day:day, overdue:overdue?-dayDiff(due,TODAY):0});
      } else flexOccs.push({t:t, due:due});
    });
  });
  // 2. flexible: earliest due first, shorter flex first (less room = pick first)
  flexOccs.sort(function(a,b){ return (a.due-b.due) || (a.t.flex-b.t.flex); });
  flexOccs.forEach(function(o){
    var t=o.t, due=o.due;
    var overdue = dayDiff(due,TODAY)<0;
    if(overdue){ put(ymd(TODAY), {t:t, due:due, day:TODAY, overdue:-dayDiff(due,TODAY)}); return; }
    var early=Math.min(2,t.flex), late=t.flex;
    var best=null, bestScore=1e9;
    for(var off=-early; off<=late; off++){
      var d=addDays(due,off);
      if(d<TODAY) continue;
      if(!monthAllowed(t,d)) continue;
      var score = loadOf(ymd(d))*100 + (busy[ymd(d)]?500:0) + Math.abs(off)*2 + (off<0?1:0);
      if(score<bestScore){ bestScore=score; best=d; }
    }
    // whole window busy (away) → slide to first free day after, up to ~3 weeks
    if(best && bestScore>=500){
      for(var ext=late+1; ext<=late+Math.min(t.interval||21,21); ext++){
        var d3=addDays(due,ext);
        if(d3<TODAY || !monthAllowed(t,d3)) continue;
        if(!busy[ymd(d3)] && loadOf(ymd(d3))===0){ best=d3; break; }
      }
    }
    if(!best) best=due<TODAY?TODAY:due;
    put(ymd(best), {t:t, due:due, day:best, overdue:0});
  });
  var byDay={};
  items.forEach(function(it){
    var ds=ymd(it.day);
    (byDay[ds]=byDay[ds]||[]).push(it);
  });
  Object.keys(byDay).forEach(function(ds){
    byDay[ds].sort(function(a,b){ return (b.overdue-a.overdue) || (a.t.cat==="Bills"?-1:1); });
  });
  _plan = byDay;
  return byDay;
}
function nextAssigned(taskId){
  var plan=buildPlan(), best=null;
  Object.keys(plan).forEach(function(ds){
    plan[ds].forEach(function(it){
      if(it.t.id!==taskId) return;
      if(!best || it.day<best.day) best=it;
    });
  });
  return best;
}
function completeTask(t){
  window._undo = {id:t.id, name:t.name, prevLastDone:t.lastDone||null, prevSnooze:t.snooze||null};
  t.lastDone = ymd(TODAY); t.snooze = null;
  save("maint"); invalidatePlan(); renderAll();
}
function undoLast(){
  var u=window._undo; if(!u) return;
  var t=getTask(u.id);
  if(t){ t.lastDone=u.prevLastDone; t.snooze=u.prevSnooze; save("maint"); invalidatePlan(); }
  window._undo=null; renderAll();
}
function snoozeTask(t, days){
  var it = nextAssigned(t.id);
  var from = it ? (it.day>TODAY?it.day:TODAY) : TODAY;
  t.snooze = ymd(addDays(from, days));
  save("maint"); invalidatePlan(); renderAll();
}
function cadenceLabel(t){
  if(t.type==="monthly") return "Monthly · the "+nth(t.dayOfMonth);
  var i=t.interval;
  if(i===7) return "Weekly"; if(i===14) return "Every 2 weeks";
  if(i>=28&&i<=31) return "Monthly"; if(i>=88&&i<=93) return "Quarterly";
  if(i>=170&&i<=190) return "Every 6 months";
  if(i>=360&&i<=370) return "Yearly"; if(i>=720&&i<=740) return "Every 2 years";
  return "Every "+i+" days";
}

      if(x){ x.done=!x.done; save("grocery"); renderAll(); } };
  });
  document.querySelectorAll("[data-lix]").forEach(function(el){

  });
  var cl=document.getElementById("li-clear");

}

/* ----- TODAY: weather + events + the day's assigned tasks ----- */
function taskRowHTML(it, ctx){
  var t=it.t, isBill=t.cat==="Bills";
  var sub;
  if(it.overdue) sub="<span class='due'>Overdue "+it.overdue+"d</span>"+(isBill?"":" · was due "+fmtShort(it.due));
  else if(isBill) sub="Due "+fmtShort(it.due);
  else if(ymd(it.day)!==ymd(it.due)) sub=cadenceLabel(t)+" · placed here (due ~"+fmtShort(it.due)+")";
  else sub=cadenceLabel(t);
  return "<div class='task' data-task='"+t.id+"'>"+
    "<button class='check"+(isBill?" bill":"")+"' data-done='"+t.id+"'></button>"+
    "<div class='info'><div class='nm'>"+esc(t.name)+"<span class='cat'>"+esc(t.cat)+"</span></div>"+
    "<div class='sub'>"+sub+"</div>"+
    (t.note?"<div class='note'>💡 "+esc(t.note)+"</div>":"")+
    "</div>"+
    (ctx==="today" && !isBill ? "<button class='snz' data-snz='"+t.id+"' title='Push to tomorrow'>↷ later</button>" : "")+
    "</div>";
}
function sectionToday(){
  var plan=buildPlan();

    "<span class='meta'>"+(dayItems.length? dayItems.length+" task"+(dayItems.length===1?"":"s"):"")+"</span></div>";
  if(wx) h+="<div class='wx'><span class='big'>"+wxIcon(wx.code)+"</span>"+
    "<span><span class='hi'>"+wx.hi+"°</span> <span class='lo'>/ "+wx.lo+"°</span></span>"+
    (wx.rain>=20?"<span class='rain'>☔ "+wx.rain+"% rain</span>":"<span class='rain' style='color:var(--muted)'>"+(wx.rain||0)+"% rain</span>")+"</div>";
  // events
  h+="<div class='agendahead'>Schedule</div>";
  if(evs.length){
    evs.forEach(function(e){
      h+="<div class='evt'><div class='t'>"+(e.allDay?"All day":fmtTime(e.startTime))+"</div>"+
        "<div class='body'><div class='nm'>"+(e.emoji?e.emoji+" ":"")+esc(e.title)+"</div>"+
        (e.location?"<div class='loc'>"+esc(e.location)+"</div>":"")+"</div></div>";
    });
  } else h+="<div class='noevt'>Nothing on the calendar</div>";
  // tasks
  h+="<div class='agendahead'>Tasks</div>";
  if(window._undo) h+="<div style='font-size:12px; color:var(--sage); padding:3px 0'>✓ "+esc(window._undo.name)+" logged · "+
    "<button id='undo-btn' style='border:none;background:none;color:var(--terra);font-weight:700;font-size:12px;text-decoration:underline;cursor:pointer;padding:0'>undo</button></div>";
  if(dayItems.length) h+=dayItems.map(function(it){ return taskRowHTML(it,"today"); }).join("");
  else h+="<div class='clearday'>✓ Clear day — nothing assigned.</div>";
  // dinner
  h+="<div class='agendahead'>Dinner</div>"+
    "<div style='display:flex; gap:8px; align-items:center'><span style='font-size:18px'>🍽</span>"+
    "<input class='txt' id='dinner-in' placeholder='What’s for dinner?' value='"+esc(state.dinner[ymd(view)]||"")+"' style='flex:1'></div>";
  h+="</section>";

function bindToday(){
  var di=document.getElementById("dinner-in");
  if(di) di.oninput=function(){
    var ds=ymd(view);
    if(di.value.trim()) state.dinner[ds]=di.value; else delete state.dinner[ds];
    save("dinner");
  };
  var ub=document.getElementById("undo-btn");
  if(ub) ub.onclick=undoLast;
  document.querySelectorAll("[data-done]").forEach(function(el){
    el.onclick=function(){
      var t=getTask(el.getAttribute("data-done")); if(!t) return;
      // a bill already paid this month → offer to mark it unpaid (mis-tap recovery)
      if(t.type==="monthly" && t.lastDone){
        var ld=parseYMD(t.lastDone);
        if(ld.getMonth()===TODAY.getMonth() && ld.getFullYear()===TODAY.getFullYear()){
          if(confirm("“"+t.name+"” is marked paid this month. Mark it UNPAID?")){
            t.lastDone=null; save("maint"); invalidatePlan(); renderAll();
          }
          return;
        }
      }
      el.classList.add("done");
      setTimeout(function(){ completeTask(t); }, 220);
    };
  });
  document.querySelectorAll("[data-snz]").forEach(function(el){
    el.onclick=function(){ var t=getTask(el.getAttribute("data-snz")); if(t) snoozeTask(t,1); };
  });
  document.querySelectorAll(".task .info").forEach(function(el){
    el.onclick=function(){ el.closest(".task").classList.toggle("open"); };
  });
}
function getTask(id){ return state.maint.filter(function(x){return x.id===id;})[0]; }

/* ----- PLAN: 14-day outlook / all tasks / bills ----- */
function sectionPlan(){
  return "<section class='card' id='planCard'>"+
    "<div class='sechead'><h2>The plan</h2><span class='meta'>auto-balanced · ~1/day</span></div>"+
    "<div class='tabs'>"+
    "<div class='tab "+(state.planTab==='plan'?'on':'')+"' data-pt='plan'>Next 14 days</div>"+
    "<div class='tab "+(state.planTab==='all'?'on':'')+"' data-pt='all'>All tasks</div>"+

    (state.planTab!=='plan'?"<button class='addbtn' id='addTask'>+ Add a task or bill</button>":"")+
    "</section>";
}
function planBodyHTML(){
  var plan=buildPlan();
  if(state.planTab==="plan"){
    var h="";
    for(var i=0;i<14;i++){
      var d=addDays(TODAY,i), ds=ymd(d), items=plan[ds]||[], evs=eventsOnDay(d), wx=wxFor(d);
      h+="<div class='pday"+(i===0?" today":"")+"'><div class='pd'><div class='d1'>"+(i===0?"Today":DOW[d.getDay()])+"</div><div class='d2'>"+fmtShort(d)+"</div></div>"+
        "<div class='pbody'>";
      evs.slice(0,2).forEach(function(e){ h+="<div class='pitem evt2'>"+(e.emoji?e.emoji+" ":"📅 ")+esc(e.title)+"</div>"; });
      items.forEach(function(it){
        var bill=it.t.cat==="Bills";
        h+="<div class='pitem"+(bill?" bill":"")+"'>"+(bill?"💵 ":"• ")+esc(it.t.name)+
          (it.overdue?" <span class='pin' style='color:var(--terra)'>overdue</span>":"")+"</div>";
      });
      if(state.dinner[ds]) h+="<div class='pitem'>🍽 "+esc(state.dinner[ds])+"</div>";
      if(!items.length && !evs.length && !state.dinner[ds]) h+="<div class='free'>free</div>";
      h+="</div><div class='pwx'>"+(wx?wxIcon(wx.code)+" "+wx.hi+"°":"")+"</div></div>";
    }
    return h;
  }
  if(state.planTab==="bills"){
    var bills=state.maint.filter(function(t){return t.cat==="Bills";});
    if(!bills.length) return "<div class='empty'>No bills set up.</div>";
    return bills.map(function(t){
      var paidThisMonth = t.lastDone && (function(){var ld=parseYMD(t.lastDone);
        return ld.getMonth()===TODAY.getMonth() && ld.getFullYear()===TODAY.getFullYear();})();
      return "<div class='task'><button class='check bill"+(paidThisMonth?" done":"")+"' data-done='"+t.id+"'></button>"+
        "<div class='info'><div class='nm'>"+esc(t.name)+"</div>"+
        "<div class='sub'>"+cadenceLabel(t)+(paidThisMonth?" · <span style='color:var(--sage);font-weight:700'>paid this month</span>":"")+"</div></div>"+
        "<button class='snz' data-edit='"+t.id+"'>edit</button></div>";
    }).join("");
  }
  // all tasks (management)
  var items = state.maint.filter(function(t){return t.cat!=="Bills";}).map(function(t){
    return {t:t, next:nextAssigned(t.id)};
  });
  items.sort(function(a,b){
    var ad=a.next?a.next.day:addDays(TODAY,999), bd=b.next?b.next.day:addDays(TODAY,999);
    return ad-bd;
  });
  return items.map(function(x){
    var t=x.t, n=x.next;
    var when = n ? (n.overdue?"<span class='due'>Overdue "+n.overdue+"d</span>":
      (dayDiff(n.day,TODAY)===0?"<span class='due'>Today</span>":
       dayDiff(n.day,TODAY)<=10?"<span class='soon'>"+fmtShort(n.day)+"</span>":
       fmtShort(n.day)+(dayDiff(n.day,TODAY)>200?" "+n.day.getFullYear():""))) : "further out";
    return "<div class='task' data-task='"+t.id+"'>"+
      "<button class='check later' data-done='"+t.id+"'></button>"+
      "<div class='info'><div class='nm'>"+esc(t.name)+"<span class='cat'>"+esc(t.cat)+"</span></div>"+
      "<div class='sub'>"+cadenceLabel(t)+" · next: "+when+"</div>"+
      (t.note?"<div class='note'>💡 "+esc(t.note)+"</div>":"")+"</div>"+
      "<button class='snz' data-edit='"+t.id+"'>edit</button></div>";
  }).join("");
}

  document.querySelectorAll("[data-pt]").forEach(function(el){
    el.onclick=function(){ state.planTab=el.getAttribute("data-pt"); renderAll(); };
  });

    el.onclick=function(){ openTaskEditor(getTask(el.getAttribute("data-edit"))); };

function openTaskEditor(t, prefillName){
  var isNew=!t;
  var cad = t ? (t.type==="monthly"?"bill":(t.interval===7?"weekly":t.interval<=31?"monthly":t.interval<=93?"quarterly":t.interval<=190?"semiannual":"yearly")) : "monthly";
  var sheet=document.getElementById("sheet");
  sheet.innerHTML="<h3>"+(isNew?"New task or bill":"Edit task")+"</h3>"+
    "<div class='field'><label>Name</label><input class='txt' id='te-name' value='"+(t?esc(t.name):esc(prefillName||""))+"'></div>"+
    "<div class='row2'><div class='field'><label>How often</label><select class='sel' id='te-cad'>"+
      ["weekly","monthly","quarterly","semiannual","yearly","bill"].map(function(c){
        var lbl={weekly:"Weekly",monthly:"Monthly",quarterly:"Quarterly",semiannual:"Every 6 months",yearly:"Yearly",bill:"Bill (fixed day of month)"}[c];
        return "<option value='"+c+"'"+(c===cad?" selected":"")+">"+lbl+"</option>";
      }).join("")+"</select></div>"+
    "<div class='field'><label>Category</label><select class='sel' id='te-cat'>"+
      ["Chores","Lawn","Interior","Exterior","Systems","HVAC","Safety","Appliances","Sprinklers","Car","Bills","Custom"].map(function(c){
        return "<option"+(t&&t.cat===c?" selected":"")+">"+c+"</option>";
      }).join("")+"</select></div></div>"+
    "<div class='field' id='te-daywrap' style='display:"+(cad==="bill"?"block":"none")+"'><label>Day of month</label><input class='txt' id='te-day' type='number' min='1' max='28' value='"+(t&&t.dayOfMonth?t.dayOfMonth:1)+"'></div>"+
    "<div class='field' id='te-duewrap' style='display:"+(cad==="bill"?"none":"block")+"'><label>Next due date (optional — pin when this lands next)</label><input class='txt' id='te-due' type='date'></div>"+
    "<div class='field'><label>Note / how-to (optional)</label><input class='txt' id='te-note' value='"+(t&&t.note?esc(t.note):"")+"'></div>"+
    "<div class='row2'>"+
    "<button class='btn' id='te-save'>"+(isNew?"Add":"Save")+"</button>"+
    "<button class='btn ghost' id='te-cancel'>Cancel</button>"+
    (isNew?"":"<button class='btn danger' id='te-del'>Delete</button>")+
    "</div>";
  document.getElementById("ovl").classList.add("on");
  document.getElementById("te-cad").onchange=function(){
    document.getElementById("te-daywrap").style.display=this.value==="bill"?"block":"none";
    document.getElementById("te-duewrap").style.display=this.value==="bill"?"none":"block";
  };
  document.getElementById("te-cancel").onclick=closeSheet;
  document.getElementById("te-save").onclick=function(){
    var name=document.getElementById("te-name").value.trim(); if(!name) return;
    var cad2=document.getElementById("te-cad").value;
    var cat=document.getElementById("te-cat").value;
    var note=document.getElementById("te-note").value.trim();
    var obj = t || {id:uid(), lastDone:null};
    obj.userEdited=true; // survives seed refresh on reload
    obj.name=name; obj.cat=(cad2==="bill"?"Bills":cat); obj.note=note||undefined;
    if(cad2==="bill"){
      obj.type="monthly"; obj.dayOfMonth=Math.max(1,Math.min(28,+document.getElementById("te-day").value||1));
      delete obj.interval; delete obj.anchor; obj.flex=0;
    } else {
      obj.type="interval";
      obj.interval={weekly:7,monthly:30,quarterly:90,semiannual:182,yearly:365}[cad2];
      obj.flex={weekly:2,monthly:4,quarterly:6,semiannual:8,yearly:10}[cad2];
      var due=document.getElementById("te-due").value;
      if(due){ obj.anchor=due; obj.lastDone=null; obj.snooze=null; }
      else if(!obj.anchor) obj.anchor=ymd(addDays(TODAY,1));
      delete obj.dayOfMonth;
    }
    if(isNew) state.maint.push(obj);
    save("maint"); invalidatePlan();
    if(window._afterTaskSave){ window._afterTaskSave(); window._afterTaskSave=null; }
    closeSheet(); renderAll();
  };
  var del=document.getElementById("te-del");
  if(del) del.onclick=function(){
    if(!confirm("Delete “"+t.name+"”?")) return;
    state.maint=state.maint.filter(function(x){return x.id!==t.id;});
    if(state.removed.indexOf(t.id)===-1) state.removed.push(t.id);
    save("maint"); save("removed"); invalidatePlan(); closeSheet(); renderAll();
  };
}

/* ----- habits ----- */
function sectionHabits(){
  return "<section class='card' id='habitCard'>"+
    "<div class='sechead'><h2>Daily habits</h2><span class='meta' id='habitMeta'></span></div>"+
    "<div class='progress'><i id='habitBar'></i></div>"+
    "<div id='habitBody'></div>"+
    "<button class='addbtn' id='addHabit'>+ Add a habit</button>"+
    "</section>";
}
function habitStreak(id){
  // grace: if today isn't logged yet, the streak counts from yesterday
  var n=0, d=new Date(TODAY);
  var t0=state.habitLog[ymd(d)];
  if(!(t0 && t0[id])) d=addDays(d,-1);
  while(true){
    var log=state.habitLog[ymd(d)];
    if(log && log[id]){ n++; d=addDays(d,-1); } else break;
  }
  return n;
}
function renderHabits(){
  var ds=ymd(view), log=state.habitLog[ds]||{};
  var done=0;
  var html=state.habits.map(function(h){
    var on=!!log[h.id]; if(on) done++;
    var streak=habitStreak(h.id);
    return "<div class='habit'><button class='hcheck"+(on?" done":"")+"' data-h='"+h.id+"'></button>"+
      "<div class='hn"+(on?" done":"")+"'>"+esc(h.name)+"</div>"+
      (streak>1?"<div class='streak'>🔥 "+streak+"</div>":"")+
      "<button class='xbtn' data-hdel='"+h.id+"'>×</button></div>";
  }).join("");
  var el=document.getElementById("habitBody"); if(el) el.innerHTML=html;
  var pct = state.habits.length? Math.round(done/state.habits.length*100):0;
  var bar=document.getElementById("habitBar"); if(bar) bar.style.width=pct+"%";
  var meta=document.getElementById("habitMeta"); if(meta) meta.textContent=done+"/"+state.habits.length;
  document.querySelectorAll("[data-h]").forEach(function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-h"); var ds=ymd(view);
      if(!state.habitLog[ds]) state.habitLog[ds]={};
      if(state.habitLog[ds][id]) delete state.habitLog[ds][id]; else state.habitLog[ds][id]=true;
      save("habitLog"); renderHabits();
    };
  });
  document.querySelectorAll("[data-hdel]").forEach(function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-hdel"); var h=state.habits.filter(function(x){return x.id===id;})[0];
      if(h && confirm("Remove habit “"+h.name+"”?")){ state.habits=state.habits.filter(function(x){return x.id!==id;}); save("habits"); renderHabits(); }
    };
  });
}
function bindHabits(){
  renderHabits();
  document.getElementById("addHabit").onclick=function(){
    var n=prompt("New daily habit:"); if(!n) return;
    state.habits.push({id:uid(), name:n}); save("habits"); renderHabits();
  };
}

/* ----- breathwork ----- */
var PATTERNS={
  box:{name:"Box", steps:[["in",4],["hold",4],["out",4],["hold",4]]},
  "478":{name:"4-7-8", steps:[["in",4],["hold",7],["out",8]]},
  sigh:{name:"Sigh", steps:[["in",3],["in",1],["out",6]]}
};
var breath={pat:"box", running:false, step:0, remain:0, timer:null, elapsed:0, etimer:null};
function sectionBreath(){
  return "<section class='card' id='breathCard'>"+
    "<div class='sechead'><h2>Breathe</h2><span class='meta btimer' id='btimer'></span></div>"+
    "<div class='tabs'>"+
    "<div class='tab "+(breath.pat==='box'?'on teal':'')+"' data-pat='box'>Box 4·4·4·4</div>"+
    "<div class='tab "+(breath.pat==='478'?'on teal':'')+"' data-pat='478'>4-7-8</div>"+
    "<div class='tab "+(breath.pat==='sigh'?'on teal':'')+"' data-pat='sigh'>Sigh</div>"+
    "</div>"+
    "<div class='breathstage'><div class='bcircle' id='bcircle'><div class='bidle' id='bidle'>Pick a pattern,<br>then begin.</div></div></div>"+
    "<button class='bbtn' id='bbtn'>Begin</button>"+
    "</section>";
}
function bindBreath(){
  document.querySelectorAll("[data-pat]").forEach(function(el){
    el.onclick=function(){ if(breath.running) stopBreath(); breath.pat=el.getAttribute("data-pat"); renderAll(); };
  });
  document.getElementById("bbtn").onclick=function(){ breath.running?stopBreath():startBreath(); };
}
function startBreath(){
  breath.running=true; breath.step=0; breath.elapsed=0;
  var btn=document.getElementById("bbtn"); btn.textContent="Stop"; btn.classList.add("stop");
  breath.etimer=setInterval(function(){ breath.elapsed++; var m=Math.floor(breath.elapsed/60),s=breath.elapsed%60; var el=document.getElementById("btimer"); if(el) el.textContent=m+":"+pad(s); },1000);
  runStep();
}
function runStep(){
  var steps=PATTERNS[breath.pat].steps;
  var st=steps[breath.step % steps.length];
  var phase=st[0], dur=st[1];
  var circle=document.getElementById("bcircle"); var idle=document.getElementById("bidle");
  if(idle) idle.style.display="none";
  circle.innerHTML="<div class='bphase'>"+(phase==="in"?"Breathe in":phase==="out"?"Breathe out":"Hold")+"</div><div class='bcount'>"+dur+"</div>";
  circle.style.transitionDuration=dur+"s";
  if(phase==="in"){ circle.classList.remove("out"); circle.style.transform="scale(1)"; }
  else if(phase==="out"){ circle.classList.add("out"); circle.style.transform="scale(.62)"; }
  breath.remain=dur;
  breath.timer=setInterval(function(){
    breath.remain--;
    var c=document.querySelector("#bcircle .bcount"); if(c) c.textContent=Math.max(breath.remain,0);
    if(breath.remain<=0){ clearInterval(breath.timer); breath.step++; runStep(); }
  },1000);
}
function stopBreath(){
  breath.running=false; clearInterval(breath.timer); clearInterval(breath.etimer);
  var btn=document.getElementById("bbtn"); if(btn){ btn.textContent="Begin"; btn.classList.remove("stop"); }
  var t=document.getElementById("btimer"); if(t) t.textContent="";
  var circle=document.getElementById("bcircle");
  if(circle){ circle.classList.remove("out"); circle.style.transitionDuration=".5s"; circle.style.transform="scale(.62)"; circle.innerHTML="<div class='bidle'>Nice work.<br>Begin again anytime.</div>"; }
}

/* ----- journal ----- */
function sectionJournal(){
  var ds=ymd(view), j=state.journal[ds]||{mode:"guided"};
  var mode=j.mode||"guided";
  var body;
  if(mode==="guided"){
    body=
      field("Grateful for (be specific)", "g", j.g||"", 2)+
      field("Today's focus / intention", "f", j.f||"", 2)+
      field("Open reflection", "r", j.r||"", 4);
  } else {
    body=field("Journal", "free", j.free||"", 7);
  }
  return "<section class='card' id='journalCard'>"+
    "<div class='sechead'><h2>Journal</h2><span class='savedtag' id='jsaved'>saved ✓</span></div>"+
    "<div class='tabs'><div class='tab "+(mode==='guided'?'on':'')+"' data-jm='guided'>Guided</div>"+
    "<div class='tab "+(mode==='free'?'on':'')+"' data-jm='free'>Free-form</div></div>"+
    body+"</section>";
}
function field(label, key, val, rows){
  return "<div class='field'><label>"+label+"</label><textarea rows='"+rows+"' data-j='"+key+"'>"+esc(val)+"</textarea></div>";
}
function bindJournal(){
  document.querySelectorAll("[data-jm]").forEach(function(el){
    el.onclick=function(){
      var ds=ymd(view); if(!state.journal[ds]) state.journal[ds]={};
      state.journal[ds].mode=el.getAttribute("data-jm"); save("journal"); renderAll();
    };
  });
  document.querySelectorAll("[data-j]").forEach(function(el){
    el.oninput=function(){
      var ds=ymd(view); if(!state.journal[ds]) state.journal[ds]={mode:"guided"};
      var key=el.getAttribute("data-j");
      if(!state.journal[ds].mode) state.journal[ds].mode = (key==="free")?"free":"guided";
      state.journal[ds][key]=el.value; save("journal"); flashSaved();
    };
  });
}
var savedT;
function flashSaved(){ var s=document.getElementById("jsaved"); if(!s)return; s.classList.add("show"); clearTimeout(savedT); savedT=setTimeout(function(){s.classList.remove("show");},900); }

/* ----- projects ----- */
function sectionProjects(){
  return "<section class='card' id='projCard'>"+
    "<div class='sechead'><h2>Projects & goals</h2></div>"+
    "<div id='projBody'></div>"+
    "<button class='addbtn' id='addProj'>+ Add a project or goal</button>"+
    "</section>";
}
function renderProjects(){
  var el=document.getElementById("projBody"); if(!el)return;
  if(!state.projects.length){ el.innerHTML="<div class='empty'>No projects yet. Add a goal you’re working toward.</div>"; }
  else{
    el.innerHTML=state.projects.map(function(p){
      return "<div class='proj'><div class='top'><button class='pcheck"+(p.done?" done":"")+"' data-pd='"+p.id+"'></button>"+
        "<div class='pt"+(p.done?" done":"")+"'>"+esc(p.title)+"</div><button class='xbtn' data-pdel='"+p.id+"'>×</button></div>"+
        "<div class='field' style='margin-top:8px;margin-bottom:0'><textarea rows='2' placeholder='Notes, next steps…' data-pn='"+p.id+"'>"+esc(p.notes||"")+"</textarea></div></div>";
    }).join("");
  }
  document.querySelectorAll("[data-pd]").forEach(function(b){ b.onclick=function(){ var p=getP(b.getAttribute("data-pd")); if(p){p.done=!p.done; save("projects"); renderProjects();} }; });
  document.querySelectorAll("[data-pdel]").forEach(function(b){ b.onclick=function(){ var p=getP(b.getAttribute("data-pdel")); if(p&&confirm("Delete “"+p.title+"”?")){ state.projects=state.projects.filter(function(x){return x.id!==p.id;}); save("projects"); renderProjects(); } }; });
  document.querySelectorAll("[data-pn]").forEach(function(t){ t.oninput=function(){ var p=getP(t.getAttribute("data-pn")); if(p){p.notes=t.value; save("projects");} }; });
}
function getP(id){ return state.projects.filter(function(x){return x.id===id;})[0]; }
function bindProjects(){
  renderProjects();
  document.getElementById("addProj").onclick=function(){
    var title=prompt("Project or goal:"); if(!title)return;
    state.projects.push({id:uid(), title:title, notes:"", done:false}); save("projects"); renderProjects();
  };
}

/* ----- utilities ----- */
function copyText(text, btn, restore){
  function ok(){ if(btn){ btn.textContent="Copied — paste to Claude"; setTimeout(function(){btn.textContent=restore;},1800);} }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, function(){ fallback(); }); }
  else fallback();
  function fallback(){ var ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); ok();}catch(e){ prompt("Copy this message to Claude:", text); } document.body.removeChild(ta); }
}

/* ----- backup ----- */
var BACKUP_KEYS=["maint","removed","habits","habitLog","journal","projects","events","grocery","dinner","inbox"];
function exportBackup(){
  var data={_dd:1, exportedAt:new Date().toISOString()};
  BACKUP_KEYS.forEach(function(k){ data[k]=lsGet(k,null); });
  var blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="dashboard-backup-"+ymd(TODAY)+".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importBackup(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d || d._dd!==1) throw 0;
      BACKUP_KEYS.forEach(function(k){ if(d[k]!=null){ state[k]=d[k]; lsSet(k,d[k]); } });
      invalidatePlan(); renderAll();
      alert("Backup restored ✓");
    }catch(e){ alert("That doesn't look like a dashboard backup file."); }
  };
  r.readAsText(file);
}
document.getElementById("importfile").addEventListener("change", function(){
  if(this.files[0]) importBackup(this.files[0]); this.value="";
});
function renderFoot(){
  var f=document.getElementById("foot");
  f.innerHTML = (storageOK?"Saving locally on this device":"⚠ Not saving")+
    (state.events.syncedAt?" · calendar synced "+fmtShort(parseYMD(state.events.syncedAt)):"")+
    " · <button id='bk-ex'>backup</button> · <button id='bk-im'>restore</button>";
  document.getElementById("bk-ex").onclick=exportBackup;
  document.getElementById("bk-im").onclick=function(){ document.getElementById("importfile").click(); };
}

/* ----- nav ----- */
document.getElementById("prevDay").onclick=function(){ view=addDays(view,-1); renderAll(); };
document.getElementById("nextDay").onclick=function(){ view=addDays(view,1); renderAll(); };
document.getElementById("todayBtn").onclick=function(){ view=new Date(TODAY); renderAll(); };

renderAll();
loadEvents();
loadWeather();
loadNoteList();
/* iOS keeps PWAs alive for days — when the app comes back to the foreground,
   roll over to the new day and refresh remote data */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState!=="visible") return;
  var now=new Date();
  if(ymd(now)!==ymd(TODAY)){ location.reload(); return; }
  loadEvents(); loadWeather(); loadNoteList();
});
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
</script>
