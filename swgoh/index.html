<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyber — SWGOH Farm Planner</title>
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#16181d; --card:#1f2229; --card2:#262a33; --line:#32363f;
    --ink:#e8e6e1; --dim:#9aa0ab; --faint:#6b717c;
    --accent:#4ea8de; --accent2:#7ec8f0; --gold:#e0b455; --bad:#d9776f; --good:#58b89a;
    --frag:#58b89a; --inc:#4ea8de; --flaw:#b98cd6;
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:calc(40px + env(safe-area-inset-bottom));}
  header{padding:18px 16px 6px; display:flex; align-items:baseline; gap:10px;}
  header h1{font-size:22px; margin:0; letter-spacing:.3px;}
  header .sub{color:var(--faint); font-size:12px; flex:1;}
  header a.home{color:var(--faint); font-size:13px; text-decoration:none;}
  nav{display:flex; gap:4px; padding:10px 10px; position:sticky; top:0; background:var(--bg);
    z-index:20; border-bottom:1px solid var(--line);}
  nav button{flex:1; padding:10px 2px; border:0; border-radius:10px; background:transparent;
    color:var(--dim); font-size:13.5px; font-weight:600;}
  nav button.on{background:var(--card2); color:var(--accent2);}
  main{padding:14px 12px; max-width:620px; margin:0 auto;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 6px; font-size:16px;}
  .muted{color:var(--dim); font-size:13px;}
  .tiny{color:var(--faint); font-size:12px;}
  .warn{color:var(--gold);} .bad{color:var(--bad);} .good{color:var(--good);}
  button.btn{border:0; border-radius:11px; padding:12px 16px; font-size:15px; font-weight:700;
    background:var(--accent); color:#08202e; transition:background .18s, transform .12s;}
  button.btn:active{transform:scale(.97);}
  button.btn.saved{background:var(--good); color:#0d201a;}
  button.ghost{background:var(--card2); color:var(--ink); border:1px solid var(--line);}
  button.small{padding:7px 12px; font-size:13px; border-radius:9px;}
  button.danger{background:transparent; border:1px solid #6a4441; color:var(--bad);}
  .row{display:flex; gap:8px; align-items:center;}
  .grow{flex:1;}
  input[type=text], input[type=number], input[type=search], input[type=date], textarea, select{
    width:100%; padding:11px; font-size:16px; background:var(--card2); color:var(--ink);
    border:1px solid var(--line); border-radius:10px;}
  input:focus, textarea:focus, select:focus{outline:1px solid var(--accent); border-color:var(--accent);}
  label.f{display:block; font-size:11px; color:var(--faint); text-transform:uppercase;
    letter-spacing:.5px; margin:12px 0 5px;}
  .g2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .g3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .g4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px;}
  .kpis{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:10px;}
  .kpi .v{font-size:19px; font-weight:800; color:var(--accent2);}
  .kpi .v.neg{color:var(--bad);} .kpi .v.pos{color:var(--good);}
  .kpi .k{font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.5px;}
  .tg{display:flex; align-items:flex-start; gap:11px; padding:12px 13px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--r); margin-bottom:9px; cursor:pointer;}
  .tg .nm{font-weight:700; font-size:15.5px;}
  .tg .st{color:var(--dim); font-size:12.5px; margin-top:2px;}
  @keyframes flash{0%{background:#2c4a3d;border-color:var(--good)}100%{background:var(--card);border-color:var(--line)}}
  .tg.flash{animation:flash 1.6s ease-out;}
  .pill{display:inline-flex; align-items:center; justify-content:center; padding:6px 9px;
    border-radius:9px; background:var(--card2); border:1px solid #2f4a5c; color:var(--accent2);
    font-weight:800; font-size:13.5px; flex-shrink:0; white-space:nowrap;}
  .pill.g{border-color:#3a5a4f; color:var(--good);}
  .pill.w{border-color:#5c4c2c; color:var(--gold);}
  .pill.b{border-color:#6a4441; color:var(--bad);}
  .chip{display:inline-block; padding:3px 8px; border-radius:99px; background:var(--card2);
    border:1px solid var(--line); font-size:11.5px; color:var(--dim); margin:0 4px 4px 0;}
  .bar{height:7px; border-radius:99px; background:var(--card2); overflow:hidden; margin-top:7px;}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:99px;}
  .bar i.crit{background:var(--gold);}
  .split{display:flex; height:9px; border-radius:99px; overflow:hidden; background:var(--card2); margin:8px 0 4px;}
  .split i{display:block; height:100%;}
  table.ref{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
  table.ref th,table.ref td{text-align:left; padding:5px 6px; border-bottom:1px solid var(--line);}
  table.ref th{color:var(--faint); font-weight:600; text-transform:uppercase; font-size:10.5px; letter-spacing:.4px;}
  table.ref td.n{text-align:right; font-variant-numeric:tabular-nums;}
  .srcrow{background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:10px; margin-bottom:8px;}
  .lstrow{padding:9px 2px; cursor:pointer;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:30px; background:var(--good);
    color:#0d201a; font-weight:700; padding:11px 20px; border-radius:99px; z-index:90; font-size:14.5px;
    opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; max-width:90vw; text-align:center;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:none;
    align-items:flex-end; justify-content:center;}
  .modal.on{display:flex;}
  .modal .sheet{background:var(--card); border-radius:18px 18px 0 0; padding:18px 16px
    calc(18px + env(safe-area-inset-bottom)); width:100%; max-width:620px; max-height:88vh; overflow:auto;}
  .back{color:var(--accent2); text-decoration:none; font-size:14px; font-weight:600;
    display:inline-block; margin-bottom:10px; background:none; border:0; padding:0;}
  details summary{cursor:pointer; color:var(--accent2); font-size:13.5px; font-weight:600; padding:4px 0;}
  hr.sep{border:0; border-top:1px solid var(--line); margin:14px 0;}
  .est{border-left:2px solid var(--gold); padding-left:9px; margin:8px 0;}
  .sd{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px;}
</style>
</head>
<body>
<header>
  <h1>⚡ Kyber</h1>
  <span class="sub">SWGOH farm planner</span>
  <a class="home" href="../index.html">⌂ dashboard</a>
</header>
<nav>
  <button id="nav-targets" class="on" onclick="go('targets')">Targets</button>
  <button id="nav-squads" onclick="go('squads')">Squads</button>
  <button id="nav-lst" onclick="go('lst')">Lightspeed</button>
  <button id="nav-crystals" onclick="go('crystals')">Crystals</button>
  <button id="nav-setup" onclick="go('setup')">Setup</button>
</nav>
<main id="main"></main>

<div class="modal" id="modal" onclick="if(event.target===this) closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   GAME DATA — sources in the Reference card under Setup.
   Constants are published game facts. Account-specific and
   community-estimated values live in cfg so you can tune them.
   ============================================================ */

const STAR_COST = {1:10, 2:15, 3:25, 4:30, 5:65, 6:85, 7:100};
const CUM = {0:0, 1:10, 2:25, 3:50, 4:80, 5:145, 6:230, 7:330};
const RELIC_STAR_REQ = {1:4, 2:4, 3:5, 4:6, 5:7, 6:7, 7:7, 8:7, 9:7};
const RELIC_CREDITS = {1:10e3, 2:25e3, 3:50e3, 4:75e3, 5:100e3, 6:250e3, 7:500e3, 8:1e6, 9:1.5e6};

// Signal data comes in three grades, farmed from different cantina nodes.
const SIG = {
  frag:{name:"Fragmented", short:"Frag", col:"var(--frag)"},
  inc: {name:"Incomplete", short:"Inc",  col:"var(--inc)"},
  flaw:{name:"Flawed",     short:"Flaw", col:"var(--flaw)"}
};
const SIG_KEYS = ["frag","inc","flaw"];

const LST_TIERS = {
  carbonite:{name:"Carbonite", order:1, star:3, gear:10, relic:0, ability:3, col:"#b08d57"},
  bronzium: {name:"Bronzium",  order:2, star:4, gear:12, relic:0, ability:4, col:"#cd7f32"},
  chromium: {name:"Chromium",  order:3, star:5, gear:13, relic:1, ability:5, col:"#c0c0c0"},
  aurodium: {name:"Aurodium",  order:4, star:6, gear:13, relic:3, ability:6, col:"#e0b455"},
  kyber:    {name:"Kyber",     order:5, star:7, gear:13, relic:5, ability:7, col:"#7ec8f0"}
};
const TIER_KEYS = Object.keys(LST_TIERS);
const LST_EXPIRY_DAYS = 183;

const POOLS = {
  normal: {name:"Normal", regen:240, bonus:135, per:120,
    ladder:[50,50,50,100,100,100,200,200,200,400,400,400,800,800,800]},
  cantina:{name:"Cantina", regen:120, bonus:45, per:120,
    ladder:[100,100,100,200,200,400,400,800,800,800,1600,1600,3200,3200]},
  fleet:  {name:"Fleet", regen:240, bonus:45, per:120,
    ladder:[50,50,50,100,100,100,200,200,200,400,400,400,800,800,800]}
};

const SRC_POOL = {hard:"normal", cantina:"cantina", fleet:"fleet", shop:null, other:null};
const SRC_NAMES = {hard:"Hard node (LS/DS)", cantina:"Cantina node", fleet:"Fleet node",
  shop:"Shard shop / store", other:"Other (flat per day)"};
const SRC_PRESET = {
  hard:   {energy:16, attempts:5, rate:33, per:1, flat:0, refresh:0},
  cantina:{energy:12, attempts:5, rate:33, per:1, flat:0, refresh:0},
  fleet:  {energy:20, attempts:5, rate:33, per:1, flat:0, refresh:0},
  shop:   {energy:0,  attempts:0, rate:0,  per:0, flat:5, refresh:0, crystals:0},
  other:  {energy:0,  attempts:0, rate:0,  per:0, flat:1, refresh:0, crystals:0}
};
// Refreshing a node resets its attempts. First reset 25 crystals, then it doubles.
const NODE_REFRESH_LADDER = [25, 50, 100, 200, 400];

// Community-reported per-character kyrotech totals, for quick entry.
const KYRO_PRESETS = [
  {n:100, label:"older legendary"},
  {n:300, label:"Resistance hero"},
  {n:400, label:"typical marquee"},
  {n:500, label:"Armorer / Saw"}
];
// One "standard farm" of each energy type, for opportunity-cost comparisons.
const FARM_COST = {normal:5*16, cantina:5*12, fleet:5*20};
const FARM_SHARDS = 5*0.33;

/* ---- crystals ---- */
const FLEET_PAYOUT = [
  {max:1,c:400},{max:2,c:375},{max:3,c:350},{max:4,c:325},{max:5,c:300},
  {max:10,c:200},{max:20,c:100},{max:50,c:50},{max:Infinity,c:0}
];
function fleetPayout(r){ return (FLEET_PAYOUT.find(b => r <= b.max) || {c:0}).c; }
const DAILY_ACTIVITY_CRYSTALS = 65;

// Grand Arena: daily crystals by league and division.
const GAC_LEAGUES = {
  kyber:    {name:"Kyber",     daily:[260,240,220,200,180], win:900, loss:200},
  aurodium: {name:"Aurodium",  daily:[170,160,150,140,130], win:550, loss:150},
  chromium: {name:"Chromium",  daily:[125,120,115,110,105], win:350, loss:80},
  bronzium: {name:"Bronzium",  daily:[100,95,90,85,80],     win:200, loss:50},
  carbonite:{name:"Carbonite", daily:[75,70,65,60,55],      win:110, loss:30}
};
// Crystals for finishing a weekly event at each rank.
const GAC_WEEKLY_RANK = {1:750, 2:500, 3:500, 4:500, 5:250, 6:250, 7:250, 8:100};

/* ============================================================
   STATE
   ============================================================ */

const KEY = "swgohFarm";
const DEFAULT_CFG = {
  refresh: {normal:0, cantina:0, fleet:0},

  // What you already have banked. Every other calculator assumes zero, which
  // overstates timelines for anyone with a stockpile.
  have: {kyro:0, frag:0, inc:0, flaw:0},

  // --- kyrotech: the only gear crunch. Monthly income by source. ---
  kyroSources: {dailies:90, guildAB:160, tb:80, tw:65, conquest:40, other:0},
  // Kyrotech is a G12/G13 item. Community totals: most marquees 400, older
  // legendaries ~100. 100 salvage per finished piece, so 400 = 4 pieces.
  kyroPerGear: {10:0, 11:0, 12:150, 13:250},     // fallback when no per-character figure

  // --- signal data: three grades, farmed from separate cantina nodes ---
  // yield is per 120 cantina energy spent on that node (120 = one refresh).
  signalNodes: [
    {id:"n1", label:"Fragmented node", energy:20, yield:{frag:6, inc:0, flaw:0}},
    {id:"n2", label:"Cantina 8-F", energy:20, yield:{frag:0, inc:6, flaw:0}},
    {id:"n3", label:"Cantina 8-G", energy:20, yield:{frag:0, inc:0, flaw:6}}
  ],
  signalPerRelic: {
    1:{frag:15, inc:0,  flaw:0},  2:{frag:25, inc:0,  flaw:0},
    3:{frag:35, inc:15, flaw:0},  4:{frag:45, inc:25, flaw:0},
    5:{frag:55, inc:35, flaw:15}, 6:{frag:55, inc:45, flaw:25},
    7:{frag:55, inc:55, flaw:35}, 8:{frag:55, inc:55, flaw:45},
    9:{frag:55, inc:55, flaw:55}
  },

  crystals: {
    fleetRank: 20,
    dailyActivities: true,
    gac: {on:true, league:"chromium", division:3, wins:3, losses:2, weeklyRank:4},
    // Named after the sources swgohrote.com/budget breaks out; amounts are
    // yours to fill in since none of them are published as fixed figures.
    other: [
      {name:"Daily login reward", amount:0, days:1},
      {name:"Galactic War", amount:0, days:1},
      {name:"Territory Battles", amount:0, days:7},
      {name:"Assault Battles", amount:0, days:7},
      {name:"Peridea Patrol", amount:0, days:7},
      {name:"Duel of the Fates", amount:0, days:7},
      {name:"Conquest (per run)", amount:0, days:14},
      {name:"GAC season end", amount:0, days:30}
    ]
  }
};

let S;
let view = "targets";
let flashId = null;
let baseSim = null;
const soloCache = new Map();
S = load();

function load(){
  let d = {};
  try{ d = JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ d = {}; }
  d.targets = d.targets || [];
  d.squads  = d.squads  || [];
  d.tokens  = d.tokens  || [];
  const c = Object.assign({}, DEFAULT_CFG, d.cfg || {});
  c.refresh     = Object.assign({}, DEFAULT_CFG.refresh, c.refresh || {});
  c.have        = Object.assign({}, DEFAULT_CFG.have, c.have || {});
  c.kyroSources = Object.assign({}, DEFAULT_CFG.kyroSources, c.kyroSources || {});
  c.kyroPerGear = Object.assign({}, DEFAULT_CFG.kyroPerGear, c.kyroPerGear || {});
  c.signalNodes = (c.signalNodes && c.signalNodes.length) ? c.signalNodes
    : JSON.parse(JSON.stringify(DEFAULT_CFG.signalNodes));
  c.signalNodes.forEach(n => { n.yield = Object.assign({frag:0,inc:0,flaw:0}, n.yield||{}); });
  const spr = {};
  for(let r = 1; r <= 9; r++) spr[r] = Object.assign({}, DEFAULT_CFG.signalPerRelic[r], (c.signalPerRelic||{})[r] || {});
  c.signalPerRelic = spr;
  c.crystals = Object.assign({}, DEFAULT_CFG.crystals, c.crystals || {});
  c.crystals.gac = Object.assign({}, DEFAULT_CFG.crystals.gac, c.crystals.gac || {});
  c.crystals.other = c.crystals.other || DEFAULT_CFG.crystals.other.slice();
  d.cfg = c;
  d.targets.forEach(normalizeTarget);
  return d;
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); baseSim = null; soloCache.clear(); }

function normalizeTarget(t){
  t.id = t.id || uid();
  t.name = t.name || "";
  t.eligible = t.eligible !== false;
  t.star = num(t.star, 0); t.shards = num(t.shards, 0); t.targetStar = num(t.targetStar, 7);
  t.gear = num(t.gear, 1); t.targetGear = num(t.targetGear, 13);
  t.relic = num(t.relic, 0); t.targetRelic = num(t.targetRelic, 0);
  // Per-character kyrotech from swgoh.gg. Blank falls back to the per-gear-level estimate.
  t.kyroOverride = (t.kyroOverride === "" || t.kyroOverride == null) ? "" : num(t.kyroOverride, "");
  t.sources = (t.sources || []).map(s => {
    const m = Object.assign({type:"hard"}, SRC_PRESET[s.type] || SRC_PRESET.hard, s);
    m.refresh = num(m.refresh, 0);
    return m;
  });
  return t;
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function num(v, d){ const n = parseFloat(v); return isFinite(n) ? n : d; }
function round(n, p){ const m = Math.pow(10, p||0); return Math.round(n*m)/m; }

/* ============================================================
   ECONOMY
   ============================================================ */

function poolBudget(p){
  const P = POOLS[p], n = Math.max(0, Math.min(P.ladder.length, S.cfg.refresh[p]|0));
  return P.regen + P.bonus + n * P.per;
}
function poolCrystals(p){
  const P = POOLS[p], n = Math.max(0, Math.min(P.ladder.length, S.cfg.refresh[p]|0));
  return P.ladder.slice(0, n).reduce((a,b)=>a+b, 0);
}
function crystalSpend(){
  return Object.keys(POOLS).reduce((a,p)=>a+poolCrystals(p), 0) + nodeRefreshSpend();
}

function gacCrystals(){
  const g = S.cfg.crystals.gac;
  if(!g.on) return {daily:0, rounds:0, weekly:0, total:0};
  const L = GAC_LEAGUES[g.league] || GAC_LEAGUES.chromium;
  const div = Math.max(1, Math.min(5, g.division|0));
  const daily = L.daily[div-1];
  const rounds = (num(g.wins,0) * L.win + num(g.losses,0) * L.loss) / 7;
  const weekly = (GAC_WEEKLY_RANK[Math.max(1, Math.min(8, g.weeklyRank|0))] || 0) / 7;
  return {daily, rounds, weekly, total: daily + rounds + weekly};
}
function crystalIncome(){
  const c = S.cfg.crystals;
  let t = fleetPayout(Math.max(1, c.fleetRank|0));
  if(c.dailyActivities) t += DAILY_ACTIVITY_CRYSTALS;
  t += gacCrystals().total;
  (c.other||[]).forEach(o => t += num(o.amount,0) / Math.max(1, num(o.days,1)));
  return t;
}
function crystalNet(){ return crystalIncome() - crystalSpend(); }

/* ---- shards ---- */
function requiredStar(t){
  let s = t.targetStar;
  if(t.targetRelic > 0) s = Math.max(s, RELIC_STAR_REQ[t.targetRelic] || 7);
  return Math.min(7, s);
}
function shardsNeeded(t){
  return Math.max(0, (CUM[requiredStar(t)] || 0) - (CUM[t.star] || 0) - t.shards);
}
// Each refresh resets the node, granting another full set of attempts.
function srcAttempts(s){ return num(s.attempts,0) * (1 + Math.max(0, num(s.refresh,0))); }
function srcShardsPerDay(s){
  if(SRC_POOL[s.type] === null) return num(s.flat, 0);
  return srcAttempts(s) * (num(s.rate,0)/100) * num(s.per,1);
}
function shardsPerDay(t){ return t.sources.reduce((a,s)=>a+srcShardsPerDay(s), 0); }
function srcEnergyPerDay(s){ return SRC_POOL[s.type] ? srcAttempts(s)*num(s.energy,0) : 0; }
function srcRefreshCrystals(s){
  const n = Math.max(0, Math.min(NODE_REFRESH_LADDER.length, num(s.refresh,0)|0));
  return NODE_REFRESH_LADDER.slice(0, n).reduce((a,b)=>a+b, 0);
}
// Crystals a source costs per day: node refreshes, or shard shipments bought with crystals.
function srcCrystals(s){
  return srcRefreshCrystals(s) + (SRC_POOL[s.type] === null ? num(s.crystals, 0) : 0);
}
// Only counts while that farm is still running.
function nodeRefreshSpend(list){
  return (list || S.targets).reduce((a,t) => a + (shardsNeeded(t) > 0
    ? t.sources.reduce((b,s)=>b+srcCrystals(s), 0) : 0), 0);
}
function shardEnergy(t, pool){
  return t.sources.reduce((a,s) => a + (SRC_POOL[s.type] === pool ? srcEnergyPerDay(s) : 0), 0);
}
function energyDemand(list){
  const d = {normal:0, cantina:0, fleet:0};
  list.forEach(t => { if(shardsNeeded(t) > 0) t.sources.forEach(s => {
    const p = SRC_POOL[s.type]; if(p) d[p] += srcEnergyPerDay(s);
  });});
  return d;
}

/* ---- kyrotech ---- */
function kyroPerDay(){
  const k = S.cfg.kyroSources;
  return Object.keys(k).reduce((a,x)=>a+num(k[x],0), 0) / 30.44;
}
function effTargetGear(t){ return t.targetRelic > 0 ? 13 : t.targetGear; }
function kyroNeeded(t){
  if(t.kyroOverride !== "" && isFinite(t.kyroOverride)) return Math.max(0, t.kyroOverride);
  let k = 0;
  for(let g = t.gear + 1; g <= effTargetGear(t); g++) k += num(S.cfg.kyroPerGear[g], 0);
  return k;
}

/* ---- signal data ---- */
function signalNeeded(t){
  const n = {frag:0, inc:0, flaw:0};
  for(let r = t.relic + 1; r <= t.targetRelic; r++){
    const lv = S.cfg.signalPerRelic[r] || {};
    SIG_KEYS.forEach(k => n[k] += num(lv[k], 0));
  }
  return n;
}
function relicCredits(t){
  let c = 0;
  for(let r = t.relic + 1; r <= t.targetRelic; r++) c += RELIC_CREDITS[r] || 0;
  return c;
}
// Outstanding signal need across every target — the weighting spare cantina
// energy would actually be spent against, so opportunity costs use it too.
function aggregateNeed(list){
  const n = {frag:0, inc:0, flaw:0};
  (list || S.targets).forEach(t => { const s = signalNeeded(t); SIG_KEYS.forEach(k => n[k] += s[k]); });
  return SIG_KEYS.some(k => n[k] > 0) ? n : null;
}
// Spread cantina energy across the signal nodes, weighted by which grades are
// still short. If only Flawed is missing, the energy goes to the Flawed node.
function signalIncome(energy, need){
  const out = {frag:0, inc:0, flaw:0, alloc:[]};
  if(energy <= 0) return out;
  const nodes = S.cfg.signalNodes || [];
  if(!nodes.length) return out;
  const w = nodes.map(n => {
    if(!need) return SIG_KEYS.reduce((a,k)=>a+num(n.yield[k],0), 0);
    return SIG_KEYS.reduce((a,k)=>a + Math.max(0, num(need[k],0)) * num(n.yield[k],0), 0);
  });
  let tot = w.reduce((a,b)=>a+b, 0);
  // Nothing specifically wanted — fall back to an even split.
  const even = tot <= 0;
  nodes.forEach((n,i) => {
    const e = even ? energy/nodes.length : energy * w[i]/tot;
    out.alloc.push({label:n.label, energy:e});
    SIG_KEYS.forEach(k => out[k] += e/120 * num(n.yield[k], 0));
  });
  return out;
}

/* ============================================================
   SIMULATOR
   Three energy pools, one kyrotech stockpile and three signal-data
   stockpiles, all shared. Signal income is whatever cantina energy
   the shard farms left behind, so a cantina shard farm slows every
   relic on the account.
   ============================================================ */

const SIM_MAX = 3650;

function simulate(list){
  const budget = {normal:poolBudget("normal"), cantina:poolBudget("cantina"), fleet:poolBudget("fleet")};
  const kDay = kyroPerDay();
  const st = list.map(t => ({t, shard:shardsNeeded(t), kyro:kyroNeeded(t), sig:signalNeeded(t),
    shardDone:null, kyroDone:null, sigDone:null, done:null}));

  // Spend what's already banked before day one, longest farm first.
  let bankK = num(S.cfg.have.kyro, 0);
  const bankS = {frag:num(S.cfg.have.frag,0), inc:num(S.cfg.have.inc,0), flaw:num(S.cfg.have.flaw,0)};
  st.slice().sort((a,b) => rank(b) - rank(a)).forEach(s => {
    if(s.kyro > 0 && bankK > 0){ const u = Math.min(s.kyro, bankK); s.kyro -= u; bankK -= u; }
    SIG_KEYS.forEach(k => {
      if(s.sig[k] > 0 && bankS[k] > 0){ const u = Math.min(s.sig[k], bankS[k]); s.sig[k] -= u; bankS[k] -= u; }
    });
  });

  st.forEach(s => {
    if(s.shard <= 0) s.shardDone = 0;
    if(s.kyro  <= 0) s.kyroDone  = 0;
    if(sigLeft(s) <= 0) s.sigDone = 0;
    if(s.shard <= 0 && s.kyro <= 0 && sigLeft(s) <= 0) s.done = 0;
  });

  let day = 0, short = false;
  const sigSum = {frag:0, inc:0, flaw:0}; let sigDays = 0;

  while(st.some(s => s.done === null) && day < SIM_MAX){
    day++;
    const avail = Object.assign({}, budget);
    const active = st.filter(s => s.done === null).sort((a,b) => rank(b) - rank(a));

    // 1. shard farms take their energy first
    for(const s of active){
      if(s.shard <= 0) continue;
      let gained = 0;
      for(const src of s.t.sources){
        const pool = SRC_POOL[src.type];
        if(!pool){ gained += num(src.flat, 0); continue; }
        const cost = num(src.energy,0), att = srcAttempts(src);
        let n = att;
        if(cost > 0) n = Math.min(att, Math.floor(avail[pool]/cost));
        if(n < att) short = true;
        if(n > 0){ avail[pool] -= n*cost; gained += n * (num(src.rate,0)/100) * num(src.per,1); }
      }
      s.shard -= gained;
      if(s.shard <= 0 && s.shardDone === null) s.shardDone = day;
    }

    // 2. leftover cantina energy becomes signal data, aimed at the scarcest grade
    const need = {frag:0, inc:0, flaw:0};
    active.forEach(s => SIG_KEYS.forEach(k => need[k] += Math.max(0, s.sig[k])));
    const inc = signalIncome(avail.cantina, need);
    SIG_KEYS.forEach(k => sigSum[k] += inc[k]); sigDays++;

    // 3. share out kyrotech and each signal grade
    const pool = {frag:inc.frag, inc:inc.inc, flaw:inc.flaw};
    let kLeft = kDay;
    for(const s of active){
      SIG_KEYS.forEach(k => {
        if(s.sig[k] > 0 && pool[k] > 0){
          const u = Math.min(s.sig[k], pool[k]); s.sig[k] -= u; pool[k] -= u;
        }
      });
      if(sigLeft(s) <= 0 && s.sigDone === null) s.sigDone = day;
      if(s.kyro > 0 && kLeft > 0){
        const u = Math.min(s.kyro, kLeft); s.kyro -= u; kLeft -= u;
        if(s.kyro <= 0 && s.kyroDone === null) s.kyroDone = day;
      }
    }

    for(const s of active) if(s.shard <= 0 && s.kyro <= 0 && sigLeft(s) <= 0) s.done = day;
  }

  const byId = {}, tracks = {};
  st.forEach(s => {
    byId[s.t.id] = s.done === null ? Infinity : s.done;
    tracks[s.t.id] = {
      shards: s.shardDone === null ? Infinity : s.shardDone,
      gear:   s.kyroDone  === null ? Infinity : s.kyroDone,
      relic:  s.sigDone   === null ? Infinity : s.sigDone
    };
  });
  const perDay = {};
  SIG_KEYS.forEach(k => perDay[k] = sigDays ? sigSum[k]/sigDays : 0);
  return {byId, tracks, makespan: st.reduce((a,s)=>Math.max(a, byId[s.t.id]), 0),
    energyShort: short, signalPerDay: perDay};

  function sigLeft(s){ return SIG_KEYS.reduce((a,k)=>a+Math.max(0, s.sig[k]), 0); }
  function rank(s){
    const r = shardsPerDay(s.t);
    return Math.max(r > 0 ? s.shard/r : (s.shard > 0 ? 1e6 : 0),
                    kDay > 0 ? s.kyro/kDay : (s.kyro > 0 ? 1e6 : 0));
  }
}

function soloFinish(t){
  const k = JSON.stringify([t.id,t.star,t.shards,t.targetStar,t.gear,t.targetGear,t.relic,t.targetRelic,t.kyroOverride,t.sources]);
  if(soloCache.has(k)) return soloCache.get(k);
  const v = simulate([t]).makespan; soloCache.set(k, v); return v;
}

/* ============================================================
   LIGHTSPEED TOKENS
   ============================================================ */

function applyToken(t, tierKey){
  const tier = LST_TIERS[tierKey], c = JSON.parse(JSON.stringify(t));
  if(tier.star > c.star){
    const need = (CUM[tier.star]||0) - (CUM[c.star]||0);
    c.shards = Math.max(0, c.shards - need);   // consumes banked shards, keeps the surplus
    c.star = tier.star;
  }
  if(tier.gear > c.gear){
    // A per-character kyrotech figure is measured from the current gear level,
    // so it no longer applies once the token jumps you forward.
    if(c.kyroOverride !== "" && isFinite(c.kyroOverride)){
      const before = kyroNeeded(t), viaTable = tableKyro(t.gear, effTargetGear(t));
      const after = tableKyro(tier.gear, effTargetGear(t));
      c.kyroOverride = viaTable > 0 ? Math.max(0, round(before * after/viaTable, 0)) : 0;
    }
    c.gear = tier.gear;
  }
  if(tier.relic) c.relic = Math.max(c.relic, tier.relic);
  return c;
}
function tableKyro(from, to){
  let k = 0; for(let g = from+1; g <= to; g++) k += num(S.cfg.kyroPerGear[g], 0); return k;
}
function tokenEffect(t, tierKey){
  const tier = LST_TIERS[tierKey];
  return {tier,
    gainStar:  Math.max(0, Math.min(tier.star,  requiredStar(t))  - t.star),
    gainGear:  Math.max(0, Math.min(tier.gear,  effTargetGear(t)) - t.gear),
    gainRelic: Math.max(0, Math.min(tier.relic, t.targetRelic)    - t.relic),
    overStar:  Math.max(0, tier.star  - requiredStar(t)),
    overRelic: Math.max(0, tier.relic - t.targetRelic),
    dead: t.star >= tier.star && t.gear >= tier.gear && (tier.relic === 0 || t.relic >= tier.relic)};
}

/* A token's real value is account-wide, not personal. Finishing a cantina shard
   farm hands its energy back to signal-data farming, which speeds up every relic
   you own — so a token is worth far more on a cantina farmer than a solo
   comparison suggests. This evaluates the whole roster before and after. */
const CAP = SIM_MAX;
function capped(d){ return isFinite(d) ? d : CAP; }

// The untouched-roster run is identical for every token, so cache it per render.
function baseline(){ return baseSim || (baseSim = simulate(S.targets)); }

/* ============================================================
   DEADLINE PLANNER
   The inverse question: an event lands on a date — what does
   hitting it cost? Greedily buys whichever refresh removes the
   most days per crystal until the deadline is met or the
   refresh ladders run out.
   ============================================================ */

function planForDeadline(list, days){
  const origPool = JSON.parse(JSON.stringify(S.cfg.refresh));
  const origNode = list.map(t => t.sources.map(s => num(s.refresh, 0)));
  const plan = {normal:0, cantina:0, fleet:0};
  const nodePlan = [];
  let best = simulate(list).makespan;
  const start = best;
  let steps = 0;

  try{
    while(best > days && steps < 45){
      let pick = null;
      const weigh = (gain, cost, apply) => {
        if(gain <= 0) return;
        const value = gain / cost;
        if(!pick || value > pick.value) pick = {value, apply, cost};
      };

      // Buying energy only helps if the farms are energy-starved, not attempt-capped.
      for(const p of Object.keys(POOLS)){
        const n = S.cfg.refresh[p] | 0;
        if(n >= POOLS[p].ladder.length) continue;
        S.cfg.refresh[p] = n + 1;
        const got = simulate(list).makespan;
        S.cfg.refresh[p] = n;
        weigh(best - got, POOLS[p].ladder[n], () => { S.cfg.refresh[p] = n + 1; plan[p]++; best = got; });
      }

      // Node refreshes buy more attempts — the real lever on a capped shard farm.
      list.forEach((t, ti) => {
        if(shardsNeeded(t) <= 0) return;
        t.sources.forEach((s, si) => {
          if(SRC_POOL[s.type] === null) return;
          const n = num(s.refresh, 0) | 0;
          if(n >= NODE_REFRESH_LADDER.length) return;
          s.refresh = n + 1;
          const got = simulate(list).makespan;
          s.refresh = n;
          weigh(best - got, NODE_REFRESH_LADDER[n], () => {
            s.refresh = n + 1; best = got;
            nodePlan.push({name:t.name, node:SRC_NAMES[s.type], to:n+1, cost:NODE_REFRESH_LADDER[n]});
          });
        });
      });

      if(!pick) break;                                 // nothing buyable helps any more
      pick.apply(); steps++;
    }
    const spendDay = Object.keys(POOLS).reduce((a,p)=>a+poolCrystals(p), 0) + nodeRefreshSpend(list);
    return {ok: best <= days, days: best, startDays: start, plan, nodePlan,
      crystalsPerDay: spendDay, total: Math.round(spendDay * Math.min(best, days)),
      income: crystalIncome(), attemptCapped: !Object.keys(plan).some(k=>plan[k]>0) && nodePlan.length === 0};
  } finally {
    S.cfg.refresh = origPool;                          // never leave the config changed
    list.forEach((t,ti) => t.sources.forEach((s,si) => s.refresh = origNode[ti][si]));
  }
}

function accountEval(id, tierKey){
  const before = S.targets, after = S.targets.map(t => t.id===id ? applyToken(t,tierKey) : t);
  const b = baseline(), a = simulate(after);
  const sumB = before.reduce((x,t)=>x+capped(b.byId[t.id]), 0);
  const sumA = after.reduce((x,t)=>x+capped(a.byId[t.id]), 0);

  const t0 = before.find(t => t.id === id), t1 = applyToken(t0, tierKey);
  // Energy handed back: only counts if the token actually ends the shard farm.
  const freed = {};
  Object.keys(POOLS).forEach(p => {
    const was = shardsNeeded(t0) > 0 ? shardEnergy(t0, p) : 0;
    const now = shardsNeeded(t1) > 0 ? shardEnergy(t1, p) : 0;
    freed[p] = Math.max(0, was - now);
  });
  const signalGain = signalIncome(freed.cantina, aggregateNeed());
  const crystalsFreed = shardsNeeded(t1) <= 0 && shardsNeeded(t0) > 0
    ? t0.sources.reduce((x,s)=>x+srcRefreshCrystals(s), 0) : 0;

  return {
    ownBefore: b.byId[id], ownAfter: a.byId[id],
    ownSaved: capped(b.byId[id]) - capped(a.byId[id]),
    acctSaved: sumB - sumA,
    makespanBefore: b.makespan, makespanAfter: a.makespan,
    othersSaved: (sumB - sumA) - (capped(b.byId[id]) - capped(a.byId[id])),
    freed, signalGain, crystalsFreed,
    signalBefore: b.signalPerDay, signalAfter: a.signalPerDay
  };
}

// What's still left to farm once the token has landed, and what that farm costs you.
function residual(t, tierKey){
  const after = applyToken(t, tierKey);
  const shards = shardsNeeded(after), kyro = kyroNeeded(after), sig = signalNeeded(after);
  const sigTotal = SIG_KEYS.reduce((a,k)=>a+sig[k], 0);
  const cost = {cantina:0, normal:0, fleet:0};
  if(shards > 0) Object.keys(cost).forEach(p => cost[p] = shardEnergy(after, p));
  const lost = signalIncome(cost.cantina, aggregateNeed());
  return {after, shards, kyro, sig, sigTotal, cost, lost,
    days: simulate([after]).makespan,
    shardsPerDay: shardsPerDay(after),
    farmsTiedUp: {normal: cost.normal/FARM_COST.normal, fleet: cost.fleet/FARM_COST.fleet}};
}

function tokenExpiry(tok){
  if(!tok.acquired) return null;
  const got = new Date(tok.acquired + "T00:00:00");
  const exp = new Date(got.getTime() + LST_EXPIRY_DAYS*864e5);
  return {exp, daysLeft: Math.ceil((exp - new Date())/864e5)};
}

/* ============================================================
   FORMATTING
   ============================================================ */

function fmtDays(d){
  if(d === undefined || d === null || !isFinite(d)) return "never";
  if(d <= 0) return "done";
  const n = Math.ceil(d);
  if(n < 60) return n + "d";
  if(n < 730) return (n/30.44).toFixed(1) + "mo";
  return (n/365.25).toFixed(1) + "y";
}
function fmtDate(d){
  if(!isFinite(d)) return "—";
  return new Date(Date.now() + Math.ceil(d)*864e5)
    .toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"});
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function stateLine(t){
  const now = [`${t.star}★`, `G${t.gear}`]; if(t.relic > 0) now.push(`R${t.relic}`);
  const goal = [`${requiredStar(t)}★`, `G${effTargetGear(t)}`]; if(t.targetRelic > 0) goal.push(`R${t.targetRelic}`);
  return now.join(" ") + " → " + goal.join(" ");
}
function bottleneck(tr){
  const e = [["Shards",tr.shards],["Kyrotech",tr.gear],["Signal data",tr.relic]];
  return e.reduce((a,x)=> x[1] > a[1] ? x : a, e[0])[0];
}
function sigLine(o, dp){
  return SIG_KEYS.filter(k => o[k] > 0.05).map(k =>
    `<span class="sd" style="background:${SIG[k].col}"></span>${round(o[k], dp===undefined?0:dp)} ${SIG[k].short}`).join(" · ") || "—";
}

const VIEWS = ["targets","squads","lst","crystals","setup"];
function go(v){
  view = v;
  VIEWS.forEach(k => document.getElementById("nav-"+k).classList.toggle("on", k === v));
  render();
}

    ({targets:vTargets, squads:vSquads, lst:vLst, crystals:vCrystals, setup:vSetup})[view]();

    if(el){ el.classList.add("flash"); el.scrollIntoView({block:"center", behavior:"smooth"}); }
    flashId = null;
  } else window.scrollTo(0, 0);
}

/* ---------- Targets ---------- */
function vTargets(){
  const list = S.targets;
  if(!list.length){
    return `<div class="card"><h3>No targets yet</h3>
      <p class="muted">Add a character you're farming — stars, banked shards, gear and relic, plus where
      the shards come from. Kyber works out the finish date across all three crunches: shards, kyrotech
      and each grade of signal data.</p>
      <button class="btn" onclick="editTarget()">+ Add a target</button></div>${refCard()}`;
  }
  const sim = simulate(list);
  const rows = list.slice().sort((a,b) => sim.byId[b.id] - sim.byId[a.id]);
  const longest = rows.length ? sim.byId[rows[0].id] : 0;
  const dem = energyDemand(list);
  const cantinaLeft = poolBudget("cantina") - dem.cantina;
  const lost = signalIncome(Math.max(0, dem.cantina), aggregateNeed(list));

  let html = `<div class="kpis">
    <div class="kpi"><div class="v">${list.length}</div><div class="k">Targets</div></div>
    <div class="kpi"><div class="v">${fmtDays(longest)}</div><div class="k">Slowest</div></div>
    <div class="kpi"><div class="v ${crystalNet()<0?"neg":"pos"}">${crystalNet()>=0?"+":""}${Math.round(crystalNet())}</div>
      <div class="k">Crystals/day</div></div></div>`;

  const pct = poolBudget("cantina") > 0 ? Math.max(0, Math.min(100, Math.round(100*dem.cantina/poolBudget("cantina")))) : 0;
  html += `<div class="card"><h3>Cantina split</h3>
    <div class="split"><i style="width:${pct}%;background:var(--gold)"></i>
      <i style="width:${100-pct}%;background:var(--accent)"></i></div>
    <p class="tiny"><span class="warn">■</span> ${Math.round(dem.cantina)} energy on shards ·
      <span style="color:var(--accent)">■</span> ${Math.round(Math.max(0,cantinaLeft))} energy on signal data</p>
    <p class="tiny" style="margin-top:6px">Earning ${sigLine(sim.signalPerDay, 1)} per day</p>
    ${dem.cantina > 0 ? `<p class="tiny warn">Cantina shard farms are costing you
      ${sigLine(lost, 1)} per day.</p>` : ""}
    ${cantinaLeft < 0 ? `<p class="tiny bad">Cantina shard farms exceed your cantina energy —
      no signal data at all, and the shard farms are running short too.</p>` : ""}</div>`;

  if(sim.energyShort){
    html += `<div class="card" style="border-color:#5c4c2c"><h3 class="warn">⚠ Energy-limited</h3>
      <p class="muted">Your farms want more energy than you have, so some nodes go unfarmed on some days.
      The dates below already account for that — the longest farm gets energy first.</p>
      <p class="tiny">Demand vs budget/day — Normal ${Math.round(dem.normal)}/${poolBudget("normal")} ·
        Cantina ${Math.round(dem.cantina)}/${poolBudget("cantina")} · Fleet ${Math.round(dem.fleet)}/${poolBudget("fleet")}</p>
      <button class="btn ghost small" onclick="go('setup')">Adjust energy budget</button></div>`;
  }

  html += rows.map(t => {
    const d = sim.byId[t.id], tr = sim.tracks[t.id];
    const w = longest > 0 && isFinite(d) ? Math.round(100*d/longest) : 100;
    return `<div class="tg" id="tg-${t.id}" onclick="editTarget('${t.id}')">
      <div class="grow">
        <div class="nm">${esc(t.name)}${t.eligible ? "" : ' <span class="tiny bad">LST-ineligible</span>'}</div>
        <div class="st">${stateLine(t)}</div>
        <div class="tiny" style="margin-top:3px">Bottleneck: ${bottleneck(tr)} · ${fmtDate(d)}</div>
        <div class="bar"><i style="width:${w}%"></i></div>
      </div>
      <div class="pill ${d<=0?"g":isFinite(d)?"":"b"}">${fmtDays(d)}</div></div>`;
  }).join("");

  html += `<button class="btn" style="width:100%;margin-top:6px" onclick="editTarget()">+ Add a target</button>`;
  return html + refCard();
}

/* ---------- Squads ---------- */
function vSquads(){
  if(!S.targets.length) return `<div class="card"><h3>Add targets first</h3>
    <p class="muted">Squads group targets into an event or team requirement.</p></div>`;
  let html = `<div class="card"><h3>Squads</h3>
    <p class="muted">A squad finishes when its slowest member does. Members compete for the same energy,
    kyrotech and signal data, so squad dates land later than farming each character alone.</p>
    <button class="btn" onclick="editSquad()">+ New squad</button></div>`;
  if(!S.squads.length) return html;

  html += S.squads.map(q => {
    const mem = q.memberIds.map(id => S.targets.find(t => t.id === id)).filter(Boolean);
    if(!mem.length) return `<div class="card"><h3>${esc(q.name)}</h3><p class="muted">No members yet.</p>
      <button class="btn ghost small" onclick="editSquad('${q.id}')">Edit</button></div>`;
    const sim = simulate(mem);
    const worst = mem.reduce((a,t) => sim.byId[t.id] > sim.byId[a.id] ? t : a, mem[0]);
    const dem = energyDemand(mem);
    const bars = mem.slice().sort((a,b) => sim.byId[b.id] - sim.byId[a.id]).map(t => {
      const d = sim.byId[t.id], solo = soloFinish(t);
      const w = sim.makespan > 0 && isFinite(d) ? Math.round(100*d/sim.makespan) : 100;
      const crit = t.id === worst.id;
      const drag = isFinite(d) && isFinite(solo) ? Math.ceil(d) - Math.ceil(solo) : 0;
      return `<div style="margin:9px 0">
        <div class="row"><span class="grow" style="font-size:14px;font-weight:600">${esc(t.name)}
          ${crit ? '<span class="chip" style="border-color:#5c4c2c;color:var(--gold)">critical path</span>' : ""}</span>
          <span class="tiny">${fmtDays(d)}</span></div>
        <div class="bar"><i class="${crit?"crit":""}" style="width:${w}%"></i></div>
        <div class="tiny">${stateLine(t)} · ${bottleneck(sim.tracks[t.id])}${drag >= 1 ? ` · +${drag}d from sharing` : ""}</div>
      </div>`;
    }).join("");
    return `<div class="card">
      <div class="row"><h3 class="grow">${esc(q.name)}</h3>
        <span class="pill ${isFinite(sim.makespan)?"":"b"}">${fmtDays(sim.makespan)}</span></div>
      <p class="tiny">Complete ${fmtDate(sim.makespan)} · ${mem.length} members${q.note ? " · " + esc(q.note) : ""}</p>
      ${bars}
      <p class="tiny" style="margin-top:10px">Energy/day — Normal ${Math.round(dem.normal)}/${poolBudget("normal")} ·
        Cantina ${Math.round(dem.cantina)}/${poolBudget("cantina")} · Fleet ${Math.round(dem.fleet)}/${poolBudget("fleet")}
        ${sim.energyShort ? '<span class="warn"> — over budget</span>' : '<span class="good"> — within budget</span>'}<br>
        Shared: ${sigLine(sim.signalPerDay,1)} + ${kyroPerDay().toFixed(1)} kyrotech per day, across ${mem.length} members</p>
      ${deadlineBlock(q, mem, sim)}
      <div class="row" style="margin-top:10px">
        <button class="btn ghost small" onclick="editSquad('${q.id}')">Edit</button>
        <button class="btn ghost small" onclick="go('lst')">Lightspeed options</button></div></div>`;
  }).join("");
  return html;
}

// "The event is on this date" — what does hitting it take, and can you afford it?
function deadlineBlock(q, mem, sim){
  if(!q.deadline) return `<div class="row" style="margin-top:8px">
    <span class="tiny grow">No deadline set — add one to see what hitting it would cost.</span>
    <input type="date" style="width:auto" onchange="setDeadline('${q.id}',this.value)"></div>`;

  const days = Math.ceil((new Date(q.deadline + "T00:00:00") - new Date()) / 864e5);
  if(days <= 0) return `<div class="est" style="border-color:var(--bad)">
    <p class="tiny bad">Deadline ${esc(q.deadline)} has passed.
      <button class="btn ghost small" onclick="setDeadline('${q.id}','')">Clear</button></p></div>`;

  if(sim.makespan <= days) return `<div class="est" style="border-color:var(--good)">
    <p class="tiny good"><b>On track for ${new Date(q.deadline+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}</b>
      — done ${fmtDays(sim.makespan)}, ${days - Math.ceil(sim.makespan)} days to spare. No extra spending needed.</p>
    <p class="tiny"><button class="btn ghost small" onclick="setDeadline('${q.id}','')">Clear deadline</button></p></div>`;

  const p = planForDeadline(mem, days);
  const buys = [];
  Object.keys(POOLS).forEach(k => { if(p.plan[k] > 0) buys.push(`${p.plan[k]} ${POOLS[k].name.toLowerCase()} energy refresh${p.plan[k]>1?"es":""}`); });
  const nodeCount = {};
  p.nodePlan.forEach(n => { const key = n.name + " — " + n.node; nodeCount[key] = (nodeCount[key]||0)+1; });
  Object.keys(nodeCount).forEach(k => buys.push(`${nodeCount[k]} node refresh${nodeCount[k]>1?"es":""} on ${k}`));
  const affordable = p.crystalsPerDay <= p.income;

  return `<div class="est" style="border-color:${p.ok ? "var(--gold)" : "var(--bad)"}">
    <p class="tiny"><b>${p.ok ? "⚠ Behind, but reachable" : "✕ Can't make it"}</b> —
      needs ${fmtDays(sim.makespan)}, deadline is in ${days}d.</p>
    ${p.ok ? `<p class="tiny">Buying each day:</p>
      <ul class="tiny" style="margin:4px 0 6px;padding-left:18px">${buys.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>
      <p class="tiny">gets it to <b>${fmtDays(p.days)}</b> — <b class="warn">${p.crystalsPerDay} crystals/day</b>,
        about <b>${p.total.toLocaleString()} crystals</b> in total.</p>
      <p class="tiny ${affordable ? "good" : "bad"}">${affordable
        ? `Within your ${Math.round(p.income)}/day income.`
        : `That's ${Math.round(p.crystalsPerDay - p.income)}/day beyond your ${Math.round(p.income)} income —
           roughly ${Math.round((p.crystalsPerDay-p.income)*Math.min(p.days,days)).toLocaleString()} out of your stockpile.`}</p>`
    : `<p class="tiny bad">Even buying every refresh available it only reaches ${fmtDays(p.days)}.
        ${p.attemptCapped ? "Nothing purchasable moves it — the farms are capped on attempts, not energy." : ""}
        A Lightspeed token or a shard pack is the only way in by then.</p>`}
    <p class="tiny"><button class="btn ghost small" onclick="setDeadline('${q.id}','')">Clear deadline</button></p></div>`;
}
function setDeadline(id, v){
  const q = S.squads.find(x => x.id === id); if(!q) return;
  q.deadline = v || ""; save(); render();
}

/* ---------- Lightspeed ---------- */
function vLst(){
  let html = `<div class="card"><h3>⚡ Lightspeed Tokens</h3>
    <p class="muted">A token sets a <b>floor</b>, it does not add levels. Spending one on a character
    already near that floor throws most of it away — the best use is whoever sits furthest below it.</p>
    <table class="ref"><tr><th>Tier</th><th>Grants</th></tr>
    ${TIER_KEYS.map(k => { const t = LST_TIERS[k];
      return `<tr><td style="color:${t.col};font-weight:700">${t.name}</td>
        <td>Lv85 · ${t.star}★ · Gear ${t.gear}${t.relic ? " · Relic "+t.relic : ""} · Ability ${t.ability}</td></tr>`;
    }).join("")}</table>
    <p class="tiny" style="margin-top:8px">Zetas and omicrons are never granted. Legacy Era characters only
    (excludes Galactic Legends, Conquest and Journey Guide units). Tokens expire ~6 months after you get them.</p></div>`;

  html += `<div class="card"><h3>Your tokens</h3>`;
  if(!S.tokens.length) html += `<p class="muted">None recorded. Add one to track its expiry — you can still compare tiers below.</p>`;
  else html += S.tokens.map(tok => {
    const e = tokenExpiry(tok), tier = LST_TIERS[tok.tier];
    let exp = '<span class="tiny">no date set</span>';
    if(e) exp = e.daysLeft < 0 ? '<span class="tiny bad">expired</span>'
      : `<span class="tiny ${e.daysLeft<30?"warn":""}">${e.daysLeft}d left · ${e.exp.toLocaleDateString(undefined,{day:"numeric",month:"short"})}</span>`;
    return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">
      <span class="grow"><b style="color:${tier.col}">${tier.name}</b>${tok.note ? '<span class="tiny"> · '+esc(tok.note)+"</span>" : ""}<br>${exp}</span>
      <button class="btn ghost small" onclick="delToken('${tok.id}')">✕</button></div>`;
  }).join("");
  html += `<button class="btn ghost small" style="margin-top:10px" onclick="editToken()">+ Add token</button></div>`;

  const elig = S.targets.filter(t => t.eligible);
  if(!elig.length) return html + `<div class="card"><p class="muted">No eligible targets to compare.</p></div>`;

  const owned = [...new Set(S.tokens.map(t => t.tier))];
  const tiers = owned.length ? TIER_KEYS.filter(k => owned.includes(k)) : TIER_KEYS;

  html += `<div class="card"><h3>Best character for each tier</h3>
    <p class="tiny">Ranked by <b>total days saved across your whole roster</b>, not just the one character.
    Ending a cantina shard farm hands that energy back to signal data, so it speeds up every relic you
    own — which usually matters more than the character itself. Tap any row for the full picture.</p>`;
  tiers.forEach(k => {
    const tier = LST_TIERS[k];
    const ranked = elig.map(t => {
      const ev = accountEval(t.id, k), r = residual(t, k);
      return {t, ev, r, eff:tokenEffect(t,k)};
    }).sort((a,b) => b.ev.acctSaved - a.ev.acctSaved);

    html += `<hr class="sep"><div class="row"><b style="color:${tier.col}" class="grow">${tier.name}</b>
      <span class="tiny">${tier.star}★ / G${tier.gear}${tier.relic ? " / R"+tier.relic : ""}</span></div>`;
    html += ranked.slice(0,6).map((x,i) => {
      const notes = [];
      if(x.eff.dead) notes.push('<span class="bad">already at or past this tier</span>');
      if(x.eff.overStar) notes.push(`<span class="warn">${x.eff.overStar}★ past your goal</span>`);
      if(x.eff.overRelic) notes.push(`<span class="warn">R${x.eff.overRelic} past your goal</span>`);
      if(x.ev.freed.cantina > 0) notes.push(`<span class="good">frees ${Math.round(x.ev.freed.cantina)} cantina energy →
        +${sigLine(x.ev.signalGain,1)}/day for every relic</span>`);
      else if(x.ev.freed.normal > 0) notes.push(`<span class="good">frees ${Math.round(x.ev.freed.normal)} normal energy</span>`);
      if(x.ev.othersSaved >= 1) notes.push(`<span class="good">${Math.round(x.ev.othersSaved)}d of that lands on other characters</span>`);
      const left = [];
      if(x.r.shards > 0) left.push(`${x.r.shards} shards`);
      if(x.r.kyro > 0) left.push(`${Math.round(x.r.kyro)} kyro`);
      if(x.r.sigTotal > 0) left.push(`${Math.round(x.r.sigTotal)} signal`);
      const s = x.ev.acctSaved;
      const savedTxt = s <= 0 ? "no gain" : fmtDays(s) + " total";
      return `<div class="row lstrow" style="${i?"border-top:1px solid var(--line)":""}"
          onclick="lstDetail('${x.t.id}','${k}')">
        <span class="grow"><span style="font-weight:600">${esc(x.t.name)}</span> <span class="tiny">›</span>
          <div class="tiny">itself ${fmtDays(x.ev.ownBefore)} → ${fmtDays(x.ev.ownAfter)}${
            left.length ? " · still needs " + left.join(", ") : " · <span class='good'>nothing left</span>"}</div>
          ${notes.length ? '<div class="tiny">'+notes.join(" · ")+"</div>" : ""}</span>
        <span class="pill ${s>0?"g":"b"}">${savedTxt}</span></div>`;
    }).join("");
  });
  html += `</div>`;

  if(S.squads.length){
    html += `<div class="card"><h3>Best squad to spend it on</h3>
      <p class="tiny">Days cut off the whole squad's completion, accounting for shared energy, kyrotech
      and signal data. A token on a non-critical member often saves nothing.</p>`;
    tiers.forEach(k => {
      const tier = LST_TIERS[k], opts = [];
      S.squads.forEach(q => {
        const mem = q.memberIds.map(id => S.targets.find(t => t.id === id)).filter(Boolean);
        if(!mem.length) return;
        const base = simulate(mem).makespan;
        mem.forEach(t => {
          if(!t.eligible) return;
          const swapped = mem.map(x => x.id === t.id ? applyToken(x,k) : x);
          const s2 = simulate(swapped), after = s2.makespan;
          const nc = swapped.reduce((a,x) => s2.byId[x.id] > s2.byId[a.id] ? x : a, swapped[0]);
          opts.push({q, t, base, after,
            saved: (isFinite(base)&&isFinite(after)) ? base-after : (isFinite(after)&&!isFinite(base) ? Infinity : 0),
            nextCrit: nc.id === t.id ? null : nc.name});
        });
      });
      if(!opts.length) return;
      opts.sort((a,b) => (b.saved===Infinity?1e9:b.saved) - (a.saved===Infinity?1e9:a.saved));
      html += `<hr class="sep"><div class="row"><b style="color:${tier.col}" class="grow">${tier.name}</b></div>`;
      html += opts.slice(0,5).map((o,i) => {
        const txt = o.saved===Infinity ? "unblocks" : (o.saved<=0 ? "no gain" : fmtDays(o.saved));
        return `<div class="row lstrow" style="${i?"border-top:1px solid var(--line)":""}"
            onclick="lstDetail('${o.t.id}','${k}')">
          <span class="grow"><span style="font-weight:600">${esc(o.q.name)}</span>
            <span class="tiny"> → ${esc(o.t.name)} ›</span>
            <div class="tiny">squad ${fmtDays(o.base)} → ${fmtDays(o.after)}${
              o.nextCrit ? ` · then <b>${esc(o.nextCrit)}</b> holds it up` : ""}</div></span>
          <span class="pill ${o.saved>0?"g":"b"}">${txt}</span></div>`;
      }).join("");
    });
    html += `</div>`;
  }
  return html;
}

// What remains after the token, and what farming it costs you.
function lstDetail(id, tierKey){
  const t = S.targets.find(x => x.id === id); if(!t) return;
  const tier = LST_TIERS[tierKey], r = residual(t, tierKey), base = soloFinish(t);
  const ev = accountEval(id, tierKey);
  const a = r.after;
  const freedAny = Object.keys(POOLS).some(p => ev.freed[p] > 0);
  const oppRows = [];
  if(r.cost.cantina > 0) oppRows.push(`<div class="srcrow"><b class="warn">${r.cost.cantina} cantina energy/day</b>
    <p class="tiny" style="margin:5px 0 0">That energy can't farm signal data, costing you
      <b>${sigLine(r.lost, 1)}</b> every day until the shards are done —
      about ${Math.round(r.lost.frag + r.lost.inc + r.lost.flaw)} signal data/day slower on every relic you own.</p></div>`);
  if(r.cost.normal > 0) oppRows.push(`<div class="srcrow"><b class="warn">${r.cost.normal} normal energy/day</b>
    <p class="tiny" style="margin:5px 0 0">Ties up ${r.farmsTiedUp.normal.toFixed(1)} hard-node farms' worth of energy —
      roughly ${(r.farmsTiedUp.normal*FARM_SHARDS).toFixed(2)} shards/day you could be earning on someone else.</p></div>`);
  if(r.cost.fleet > 0) oppRows.push(`<div class="srcrow"><b class="warn">${r.cost.fleet} fleet energy/day</b>
    <p class="tiny" style="margin:5px 0 0">Ties up ${r.farmsTiedUp.fleet.toFixed(1)} fleet-node farms' worth of energy.</p></div>`);

  document.getElementById("sheet").innerHTML = `
    <button class="back" onclick="closeModal()">← close</button>
    <h3 style="margin:0 0 2px">${esc(t.name)}</h3>
    <p class="tiny" style="margin:0 0 12px">after a <b style="color:${tier.col}">${tier.name}</b> token</p>

    <div class="srcrow"><div class="row"><span class="grow"><b>${stateLine(t)}</b>
      <div class="tiny">now</div></span>
      <span class="pill">${fmtDays(base)}</span></div>
      <hr class="sep" style="margin:10px 0">
      <div class="row"><span class="grow"><b class="good">${a.star}★ G${a.gear}${a.relic?" R"+a.relic:""}
        → ${requiredStar(a)}★ G${effTargetGear(a)}${a.targetRelic?" R"+a.targetRelic:""}</b>
        <div class="tiny">after the token</div></span>
        <span class="pill g">${fmtDays(r.days)}</span></div></div>

    <hr class="sep"><b>What's still left to farm</b>
    ${r.shards <= 0 && r.kyro <= 0 && r.sigTotal <= 0
      ? `<p class="muted good" style="margin-top:8px">Nothing — the token finishes this character outright.</p>`
      : `<table class="ref">
        <tr><th>Resource</th><th class="n">Remaining</th><th class="n">Rate</th><th class="n">Time</th></tr>
        ${r.shards > 0 ? `<tr><td>Shards to ${requiredStar(a)}★</td><td class="n">${r.shards}</td>
          <td class="n">${r.shardsPerDay.toFixed(2)}/day</td>
          <td class="n">${fmtDays(r.shardsPerDay>0 ? r.shards/r.shardsPerDay : Infinity)}</td></tr>` : ""}
        ${r.kyro > 0 ? `<tr><td>Kyrotech</td><td class="n">${Math.round(r.kyro)}</td>
          <td class="n">${kyroPerDay().toFixed(1)}/day</td>
          <td class="n">${fmtDays(kyroPerDay()>0 ? r.kyro/kyroPerDay() : Infinity)}</td></tr>` : ""}
        ${SIG_KEYS.filter(k => r.sig[k] > 0).map(k => {
          const inc = simulate([a]).signalPerDay[k];
          return `<tr><td><span class="sd" style="background:${SIG[k].col}"></span>${SIG[k].name} signal</td>
            <td class="n">${Math.round(r.sig[k])}</td><td class="n">${inc.toFixed(1)}/day</td>
            <td class="n">${fmtDays(inc>0 ? r.sig[k]/inc : Infinity)}</td></tr>`;
        }).join("")}
      </table>
      ${r.shards > 0 && r.shardsPerDay <= 0 ? `<p class="tiny bad">No shard source set for this character —
        add one in the target editor or it can never finish.</p>` : ""}`}

    ${oppRows.length ? `<hr class="sep"><b>What that farm costs you</b>
      <p class="tiny">Energy still tied up chasing the remainder, and what it's not doing instead.</p>
      ${oppRows.join("")}` : (r.shards > 0 ? "" :
      `<hr class="sep"><p class="tiny good">No energy tied up — nothing left to farm on nodes.</p>`)}

    <hr class="sep"><b>Knock-on effect across your roster</b>
    <p class="tiny">A token doesn't only help the character it's spent on.</p>
    ${freedAny ? `<div class="srcrow">
      <b class="good">Frees ${Object.keys(POOLS).filter(p=>ev.freed[p]>0)
        .map(p=>`${Math.round(ev.freed[p])} ${POOLS[p].name.toLowerCase()}`).join(" + ")} energy/day</b>
      ${ev.freed.cantina > 0 ? `<p class="tiny" style="margin:5px 0 0">That cantina energy goes straight
        back to signal data: <b class="good">+${sigLine(ev.signalGain,1)} per day</b>, speeding up every
        relic on your account. Income rises from ${sigLine(ev.signalBefore,1)} to ${sigLine(ev.signalAfter,1)}.</p>` : ""}
      ${ev.freed.normal > 0 ? `<p class="tiny" style="margin:5px 0 0">That normal energy is
        ${(ev.freed.normal/FARM_COST.normal).toFixed(1)} hard-node farms freed up for someone else.</p>` : ""}
      ${ev.crystalsFreed > 0 ? `<p class="tiny" style="margin:5px 0 0">Also stops
        ${ev.crystalsFreed} crystals/day of node refreshes.</p>` : ""}
    </div>` : `<p class="tiny">No energy freed — this character's shard farm keeps running afterwards.</p>`}
    <table class="ref">
      <tr><th>Measure</th><th class="n">Before</th><th class="n">After</th><th class="n">Saved</th></tr>
      <tr><td>This character</td><td class="n">${fmtDays(ev.ownBefore)}</td>
        <td class="n">${fmtDays(ev.ownAfter)}</td><td class="n">${ev.ownSaved>0?fmtDays(ev.ownSaved):"—"}</td></tr>
      <tr><td>Everyone else</td><td class="n">—</td><td class="n">—</td>
        <td class="n ${ev.othersSaved>0?"good":""}">${ev.othersSaved>=1?fmtDays(ev.othersSaved):"—"}</td></tr>
      <tr><td>Last character done</td><td class="n">${fmtDays(ev.makespanBefore)}</td>
        <td class="n">${fmtDays(ev.makespanAfter)}</td>
        <td class="n">${ev.makespanBefore-ev.makespanAfter>0?fmtDays(ev.makespanBefore-ev.makespanAfter):"—"}</td></tr>
      <tr><td><b>Whole roster</b></td><td class="n">—</td><td class="n">—</td>
        <td class="n"><b class="${ev.acctSaved>0?"good":""}">${ev.acctSaved>0?fmtDays(ev.acctSaved):"none"}</b></td></tr>
    </table>
    <p class="tiny">"Whole roster" adds up the days saved on every character — the number the ranking uses.</p>

    <button class="btn ghost" style="width:100%;margin-top:14px" onclick="closeModal()">Close</button>`;
  openModal();
}

function vSetup(){
  const pools = Object.keys(POOLS).map(p => {
    const P = POOLS[p], n = S.cfg.refresh[p]|0;
    return `<div class="srcrow">
      <div class="row"><b class="grow">${P.name} energy</b><span class="pill">${poolBudget(p)}/day</span></div>
      <div class="tiny" style="margin:5px 0">${P.regen} regen + ${P.bonus} daily bonus${n ? " + "+(n*P.per)+" bought" : ""}
        ${n ? ` · <span class="warn">${poolCrystals(p)} crystals/day</span>` : ""}</div>
      <label class="f">Crystal refreshes per day (max ${P.ladder.length})</label>
      <input type="number" min="0" max="${P.ladder.length}" value="${n}"
        onchange="S.cfg.refresh['${p}']=Math.max(0,Math.min(${P.ladder.length},this.value|0));save();render()"></div>`;
  }).join("");

  const kSrc = [["dailies","Daily challenges"],["guildAB","Guild assault battles"],["tb","Territory Battles"],
    ["tw","Territory Wars"],["conquest","Conquest"],["other","Anything else"]]
    .map(([k,l]) => `<div><label class="f">${l}</label>
      <input type="number" min="0" value="${S.cfg.kyroSources[k]}"
        onchange="S.cfg.kyroSources['${k}']=num(this.value,0);save();render()"></div>`).join("");

  const kGear = [10,11,12,13].map(g => `<div><label class="f">G${g}</label>
    <input type="number" min="0" value="${S.cfg.kyroPerGear[g]}"
      onchange="S.cfg.kyroPerGear['${g}']=num(this.value,0);save();render()"></div>`).join("");

  const nodes = (S.cfg.signalNodes||[]).map((n,i) => `<div class="srcrow">
    <div class="row"><input type="text" class="grow" value="${esc(n.label)}"
      oninput="S.cfg.signalNodes[${i}].label=this.value;save()">
      <button class="btn ghost small" onclick="S.cfg.signalNodes.splice(${i},1);save();render()">✕</button></div>
    <div class="g4" style="margin-top:8px">
      <div><label class="f">Energy</label><input type="number" min="1" value="${n.energy}"
        onchange="S.cfg.signalNodes[${i}].energy=num(this.value,20);save();render()"></div>
      ${SIG_KEYS.map(k => `<div><label class="f" style="color:${SIG[k].col}">${SIG[k].short}</label>
        <input type="number" min="0" step="0.5" value="${n.yield[k]}"
          onchange="S.cfg.signalNodes[${i}].yield['${k}']=num(this.value,0);save();render()"></div>`).join("")}
    </div>
    <p class="tiny">Per 120 energy (one refresh) spent here.</p></div>`).join("");

  const sigTable = `<table class="ref"><tr><th>Relic</th>
    ${SIG_KEYS.map(k=>`<th class="n" style="color:${SIG[k].col}">${SIG[k].short}</th>`).join("")}</tr>
    ${[1,2,3,4,5,6,7,8,9].map(r => `<tr><td>R${r}</td>${SIG_KEYS.map(k =>
      `<td class="n"><input type="number" min="0" style="padding:5px;font-size:13px;text-align:right"
        value="${S.cfg.signalPerRelic[r][k]}"
        onchange="S.cfg.signalPerRelic[${r}]['${k}']=num(this.value,0);save();render()"></td>`).join("")}</tr>`).join("")}</table>`;

  const simNow = simulate(S.targets);

  return `<div class="card"><h3>Energy budget</h3>
    <p class="muted">Free income is what the game gives everyone. Refreshes are what you choose to buy —
    the crystal ladder is built in, so raising the count shows the real daily price.</p>
    ${pools}
    <div class="row" style="margin-top:10px"><span class="grow"><b>Total spend</b></span>
      <span class="pill w">${crystalSpend()}/day</span></div></div>

  <div class="card"><h3>What you already have</h3>
    <p class="muted">Stock on hand is spent before day one, longest farm first. Most calculators
    assume you start from nothing, which overstates every date.</p>
    <div class="g4">
      <div><label class="f">Kyrotech</label><input type="number" min="0" value="${S.cfg.have.kyro}"
        onchange="S.cfg.have.kyro=num(this.value,0);save();render()"></div>
      ${SIG_KEYS.map(k => `<div><label class="f" style="color:${SIG[k].col}">${SIG[k].short}</label>
        <input type="number" min="0" value="${S.cfg.have[k]}"
          onchange="S.cfg.have['${k}']=num(this.value,0);save();render()"></div>`).join("")}
    </div></div>

  <div class="card"><h3>Kyrotech — the gear crunch</h3>
    <p class="muted">Gear is modelled purely as kyrotech salvage. It's one shared stockpile, so gearing
    several characters at once splits it between them.</p>
    <label class="f">Kyrotech per month, by source</label>
    <div class="g3">${kSrc}</div>
    <div class="row" style="margin-top:10px"><span class="grow"><b>Income</b></span>
      <span class="pill">${kyroPerDay().toFixed(1)}/day · ${Math.round(kyroPerDay()*30.44)}/mo</span></div>
    <p class="tiny">Community figures put a no-spend account at roughly 400/month (~13/day) — 90 from
      dailies, 160 from guild assault battles, ~80 Territory Battles, ~65 Territory Wars, 40 Conquest.
      Add more if you buy with GET, GAC currency or crystals.</p>
    <div class="est"><p class="tiny">Kyrotech is widely called <b>the</b> bottleneck for most accounts.
      Reported per-character totals: most marquees <b>400</b>, older legendaries (Jedi Revan, GMY,
      General Kenobi, Vader) around <b>100</b>, Resistance heroes 300, Armorer and Saw 500.
      At ~13/day income, one 400-kyro character is about a month of your entire kyrotech economy.</p></div>
    <hr class="sep">
    <div class="est"><p class="tiny">Per-character kyrotech is public on swgoh.gg, but the site blocks
      automated access so it can't be bundled here. Enter the real figure per character in the target
      editor ("kyrotech still needed") — otherwise these per-gear-level estimates are used.</p></div>
    <label class="f">Fallback: kyrotech to clear each gear level</label>
    <div class="g4">${kGear}</div></div>

  <div class="card"><h3>Signal data — the relic crunch</h3>
    <p class="muted">Three grades, farmed from different cantina nodes. Income is <b>whatever cantina
    energy your shard farms don't eat</b>, aimed at whichever grade you're shortest on — which is why a
    cantina shard farm slows every relic on your account.</p>
    <div class="est"><p class="tiny">Yields are estimates. Sim a node for a day and divide by the energy
      spent to get your real figure. Confirmed: <b>8-F drops Incomplete</b>, <b>8-G drops Flawed</b>,
      0–2 per run each. The wiki lists these at 16 energy; they're set to 20 here per your account.</p></div>
    <label class="f">Signal data nodes</label>
    ${nodes}
    <button class="btn ghost small" onclick="S.cfg.signalNodes.push({id:uid(),label:'New node',energy:20,yield:{frag:0,inc:0,flaw:0}});save();render()">+ Add node</button>
    <div class="row" style="margin-top:12px"><span class="grow"><b>Current income</b></span>
      <span class="tiny">${sigLine(simNow.signalPerDay, 1)} per day</span></div>
    <hr class="sep">
    <label class="f">Signal data required per relic level</label>
    <div class="est"><p class="tiny">Read these off the in-game upgrade screen and correct them —
      the defaults follow the documented 15–55 per grade range but aren't exact.</p></div>
    ${sigTable}</div>

  ${refCard(true)}

  <div class="card"><h3>Backup</h3>
    <div class="row"><button class="btn ghost small" onclick="exportData()">Export</button>
      <button class="btn ghost small" onclick="importData()">Import</button>
      <button class="btn danger small" onclick="wipe()">Erase all</button></div></div>`;
}

let draft = null;

function editTarget(id){
  draft = id ? JSON.parse(JSON.stringify(S.targets.find(t => t.id === id)))
             : normalizeTarget({sources:[Object.assign({type:"hard"}, SRC_PRESET.hard)]});
  drawTargetSheet(); openModal();
  if(!id) setTimeout(() => { const el = document.getElementById("e-name"); if(el) el.focus(); }, 60);
}

  const t = draft, exists = S.targets.some(x => x.id === t.id);

  const cant = shardEnergy(t, "cantina"), sig = signalNeeded(t);

  document.getElementById("sheet").innerHTML = `
    <button class="back" onclick="closeModal()">← close</button>

function srcEditor(s, i){
  const flat = SRC_POOL[s.type] === null;
  return `<div class="srcrow">
    <div class="row"><select class="grow" onchange="srcType(${i},this.value)">
      ${Object.keys(SRC_NAMES).map(k=>`<option value="${k}" ${s.type===k?"selected":""}>${SRC_NAMES[k]}</option>`).join("")}
    </select><button class="btn ghost small" onclick="delSrc(${i})">✕</button></div>
    ${flat ? `<div class="g2"><div><label class="f">Shards per day</label>
        <input type="number" step="0.1" min="0" value="${s.flat}" onchange="srcSet(${i},'flat',this.value)"></div>
      <div><label class="f">Crystals per day</label>
        <input type="number" step="1" min="0" value="${num(s.crystals,0)}" onchange="srcSet(${i},'crystals',this.value)"></div></div>
      <p class="tiny">${num(s.crystals,0) ? num(s.crystals,0)+" crystals/day while this farm runs — counted in your budget."
        : "Leave crystals at 0 for currency-only stores."}</p>`
    : `<div class="g4" style="margin-top:8px">
        <div><label class="f">Energy</label><input type="number" min="0" value="${s.energy}" onchange="srcSet(${i},'energy',this.value)"></div>
        <div><label class="f">Tries/day</label><input type="number" min="0" value="${s.attempts}" onchange="srcSet(${i},'attempts',this.value)"></div>
        <div><label class="f">Drop %</label><input type="number" min="0" max="100" value="${s.rate}" onchange="srcSet(${i},'rate',this.value)"></div>
        <div><label class="f">Per drop</label><input type="number" min="0" step="1" value="${s.per}" onchange="srcSet(${i},'per',this.value)"></div></div>
      <label class="f">Node refreshes per day</label>
      <select onchange="srcSet(${i},'refresh',this.value)">
        ${[0,1,2,3].map(n => `<option value="${n}" ${num(s.refresh,0)===n?"selected":""}>${
          n===0 ? "None" : n + " × " + num(s.attempts,0) + " more tries · " +
          NODE_REFRESH_LADDER.slice(0,n).reduce((a,b)=>a+b,0) + " crystals/day"}</option>`).join("")}</select>
      <p class="tiny">${srcShardsPerDay(s).toFixed(2)} shards/day from ${srcAttempts(s)} tries · ${srcEnergyPerDay(s)} ${POOLS[SRC_POOL[s.type]].name.toLowerCase()} energy/day
        ${srcRefreshCrystals(s) ? ` · <span class="warn">${srcRefreshCrystals(s)} crystals/day</span>` : ""}
        ${s.type==="cantina" ? ` · <span class="warn">costs ${sigLine(signalIncome(srcEnergyPerDay(s), aggregateNeed()),1)}</span>` : ""}</p>`}
  </div>`;
}

// Redraws the sheet. Never call from the name field's oninput — it would rebuild
// the input mid-keystroke and drop focus.
function dset(k,v){ draft[k]=v; drawTargetSheet(); }
function srcSet(i,k,v){ draft.sources[i][k]=num(v,0); drawTargetSheet(); }
function srcType(i,v){ draft.sources[i]=Object.assign({type:v},SRC_PRESET[v]); drawTargetSheet(); }
function addSrc(){ draft.sources.push(Object.assign({type:"hard"},SRC_PRESET.hard)); drawTargetSheet(); }
function delSrc(i){ draft.sources.splice(i,1); drawTargetSheet(); }

function saveTarget(){
  const el = document.getElementById("e-name");
  if(el) draft.name = el.value;
  if(!draft.name.trim()){ toast("Give it a name", true); if(el) el.focus(); return; }
  draft.name = draft.name.trim();
  normalizeTarget(draft);
  const i = S.targets.findIndex(t => t.id === draft.id);
  const isNew = i < 0;
  if(isNew) S.targets.push(draft); else S.targets[i] = draft;
  save();
  const id = draft.id, nm = draft.name;
  confirmSave("e-save", isNew ? "✓ Added" : "✓ Saved", () => {
    flashId = id; closeModal(); render();
    toast((isNew ? "Added " : "Saved ") + nm);
  });
}
function delTarget(id){
  if(!confirm("Delete this target?")) return;
  S.targets = S.targets.filter(t => t.id !== id);
  S.squads.forEach(q => q.memberIds = q.memberIds.filter(m => m !== id));
  save(); closeModal(); render(); toast("Deleted");
}

function editSquad(id){
  draft = id ? JSON.parse(JSON.stringify(S.squads.find(x=>x.id===id)))
             : {id:uid(), name:"", note:"", deadline:"", memberIds:[]};
  const q = draft;
  document.getElementById("sheet").innerHTML = `
    <button class="back" onclick="closeModal()">← close</button>
    <label class="f">Squad / event name</label>
    <input type="text" id="e-sqname" value="${esc(q.name)}" placeholder="e.g. GL Jabba requirements"
      autocomplete="off" oninput="draft.name=this.value">
    <div class="g2"><div><label class="f">Note</label>
      <input type="text" value="${esc(q.note||"")}" placeholder="optional" oninput="draft.note=this.value"></div>
      <div><label class="f">Event deadline</label>
      <input type="date" value="${esc(q.deadline||"")}" onchange="draft.deadline=this.value"></div></div>
    <label class="f">Members</label>
    ${S.targets.length ? S.targets.map(t=>`<label style="display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
      <input type="checkbox" style="width:auto" ${q.memberIds.includes(t.id)?"checked":""} onchange="toggleMember('${t.id}',this.checked)">
      <span class="grow" style="font-size:14.5px">${esc(t.name)}<br><span class="tiny">${stateLine(t)}</span></span>
      <span class="tiny">${fmtDays(soloFinish(t))}</span></label>`).join("") : '<p class="muted">No targets yet.</p>'}
    <div class="row" style="margin-top:12px">
      <button class="btn grow" id="e-sqsave" onclick="saveSquad()">${id?"Save changes":"Create squad"}</button>
      ${id?`<button class="btn danger small" onclick="delSquad('${id}')">Delete</button>`:""}</div>`;
  openModal();
  if(!id) setTimeout(() => { const el = document.getElementById("e-sqname"); if(el) el.focus(); }, 60);
}
function toggleMember(id,on){
  if(on){ if(!draft.memberIds.includes(id)) draft.memberIds.push(id); }
  else draft.memberIds = draft.memberIds.filter(m=>m!==id);
}
function saveSquad(){
  const el = document.getElementById("e-sqname");
  if(el) draft.name = el.value;
  if(!draft.name.trim()){ toast("Give it a name", true); if(el) el.focus(); return; }
  draft.name = draft.name.trim();
  const i = S.squads.findIndex(q=>q.id===draft.id);
  const isNew = i < 0;
  if(isNew) S.squads.push(draft); else S.squads[i] = draft;
  save();
  const nm = draft.name;
  confirmSave("e-sqsave", isNew ? "✓ Created" : "✓ Saved", () => {
    closeModal(); render(); toast((isNew?"Created ":"Saved ")+nm);
  });
}
function delSquad(id){
  if(!confirm("Delete this squad?")) return;
  S.squads = S.squads.filter(q=>q.id!==id);
  save(); closeModal(); render(); toast("Deleted");
}

function editToken(){
  draft = {id:uid(), tier:"kyber", acquired:new Date().toISOString().slice(0,10), note:""};
  document.getElementById("sheet").innerHTML = `
    <button class="back" onclick="closeModal()">← close</button>
    <label class="f">Tier</label>
    <select onchange="draft.tier=this.value">${TIER_KEYS.map(k=>
      `<option value="${k}" ${k==="kyber"?"selected":""}>${LST_TIERS[k].name} — ${LST_TIERS[k].star}★ / G${LST_TIERS[k].gear}${LST_TIERS[k].relic?" / R"+LST_TIERS[k].relic:""}</option>`).join("")}</select>
    <label class="f">Date acquired</label>
    <input type="date" value="${draft.acquired}" onchange="draft.acquired=this.value">
    <label class="f">Note (era / faction lock)</label>
    <input type="text" placeholder="e.g. Separatists only" autocomplete="off" oninput="draft.note=this.value">
    <button class="btn" id="e-toksave" style="width:100%;margin-top:14px" onclick="saveToken()">Add token</button>`;
  openModal();
}
function saveToken(){
  S.tokens.push(draft); save();
  const nm = LST_TIERS[draft.tier].name;
  confirmSave("e-toksave", "✓ Added", () => { closeModal(); render(); toast("Added "+nm+" token"); });
}
function delToken(id){ S.tokens = S.tokens.filter(t=>t.id!==id); save(); render(); toast("Removed"); }

/* ============================================================
   PLUMBING
   ============================================================ */

// Flash the button green, buzz if the device supports it, then continue.
function confirmSave(btnId, label, then){
  const b = document.getElementById(btnId);
  if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
  if(!b){ then(); return; }
  b.textContent = label; b.classList.add("saved"); b.disabled = true;
  setTimeout(then, 420);
}
function openModal(){ document.getElementById("modal").classList.add("on"); }
function closeModal(){ document.getElementById("modal").classList.remove("on"); draft = null; }
let toastT;
function toast(msg, bad){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.background = bad ? "var(--bad)" : "var(--good)";
  el.style.color = bad ? "#2a1210" : "#0d201a";
  el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 2000);
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kyber-swgoh-" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(){
  const i = document.createElement("input");
  i.type = "file"; i.accept = "application/json";
  i.onchange = () => {
    const f = i.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { try{ localStorage.setItem(KEY, r.result); S = load(); render(); toast("Imported"); }
      catch(e){ toast("Bad file", true); } };
    r.readAsText(f);
  };
  i.click();
}
function wipe(){
  if(!confirm("Erase every target, squad and token?")) return;
  localStorage.removeItem(KEY); S = load(); render(); toast("Erased");
}

if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("../sw.js");
render();
</script>
