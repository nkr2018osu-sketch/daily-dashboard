<title>GAC War Table</title>

<style>
:root{
  --bg:#e9edee; --panel:#ffffff; --panel2:#f3f6f7; --sunk:#e2e8ea;
  --line:#d5dee1; --line2:#bcc8cc;
  --ink:#12181b; --dim:#57646a; --faint:#86959b;
  --accent:#0c7a86; --accent-ink:#ffffff; --accent-soft:#d5ecee; --accent-line:#8fc9cf;
  --good:#2c7a52; --good-bg:#dff0e6; --warn:#9a6410; --warn-bg:#f8ecd6; --bad:#ab444d; --bad-bg:#f8e3e5;
  --shadow:0 1px 2px rgba(16,32,36,.08), 0 6px 18px -10px rgba(16,32,36,.35);
  --r:10px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Chakra Petch","IBM Plex Sans",-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1417; --panel:#171d21; --panel2:#1e262b; --sunk:#131a1e;
    --line:#283238; --line2:#3a464e;
    --ink:#e3eaed; --dim:#95a3aa; --faint:#6a7880;
    --accent:#3bb3bf; --accent-ink:#052429; --accent-soft:#10353b; --accent-line:#245e66;
    --good:#5dbb87; --good-bg:#14291f; --warn:#d8a54a; --warn-bg:#2c2416; --bad:#e2787f; --bad-bg:#2e1a1c;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px -12px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1417; --panel:#171d21; --panel2:#1e262b; --sunk:#131a1e;
  --line:#283238; --line2:#3a464e;
  --ink:#e3eaed; --dim:#95a3aa; --faint:#6a7880;
  --accent:#3bb3bf; --accent-ink:#052429; --accent-soft:#10353b; --accent-line:#245e66;
  --good:#5dbb87; --good-bg:#14291f; --warn:#d8a54a; --warn-bg:#2c2416; --bad:#e2787f; --bad-bg:#2e1a1c;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px -12px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45;
  -webkit-text-size-adjust:100%;}
h1,h2,h3,h4{font-family:var(--disp); font-weight:700; margin:0; text-wrap:balance; letter-spacing:.2px}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---- shell ---- */
.shell{max-width:1480px; margin:0 auto; padding:0 14px 80px}
.topbar{position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--line);
  padding:10px 0 0; margin-bottom:14px}
.brandrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.mark{font-family:var(--disp); font-weight:700; font-size:19px; letter-spacing:.5px; display:flex; align-items:center; gap:8px}
.mark .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.mark small{font-family:var(--sans); font-weight:500; font-size:11px; color:var(--faint);
  text-transform:uppercase; letter-spacing:.9px}
.spacer{flex:1}
.tabs{display:flex; gap:2px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0; background:transparent; color:var(--dim); font-weight:600; font-size:13px;
  padding:8px 12px; border-bottom:2px solid transparent; white-space:nowrap; font-family:var(--disp); letter-spacing:.3px}
.tabs button.on{color:var(--ink); border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

/* ---- stat readouts ---- */
.readout{display:flex; gap:16px; flex-wrap:wrap; align-items:baseline}
.readout .r{display:flex; align-items:baseline; gap:6px}
.readout .r b{font-family:var(--mono); font-weight:600; font-size:15px; font-variant-numeric:tabular-nums}
.readout .r span{font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--faint)}

/* ---- generic bits ---- */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r)}
.pad{padding:12px 14px}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) 452px; gap:14px; align-items:start}
@media (max-width:1080px){ .grid2{grid-template-columns:minmax(0,1fr)} }
.rail{position:sticky; top:104px}
@media (max-width:1080px){ .rail{position:static} }
.eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--faint); font-weight:600}
.muted{color:var(--dim)}
.faint{color:var(--faint)}
.tiny{font-size:11.5px}
.sechead{display:flex; align-items:center; gap:10px; margin:0 0 8px}
.sechead h3{font-size:14px}
.hr{height:1px; background:var(--line); border:0; margin:12px 0}

.btn{border:1px solid var(--line2); background:var(--panel2); color:var(--ink); border-radius:8px;
  padding:6px 11px; font-size:13px; font-weight:600; line-height:1.3}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08); color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad); border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:3px 8px; font-size:11.5px; border-radius:6px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
input[type=text],input[type=number],input[type=search],select,textarea{
  width:100%; background:var(--panel); border:1px solid var(--line2); border-radius:8px; padding:7px 9px;
  font-size:13px}
textarea{font-family:var(--mono); font-size:12px; line-height:1.5; min-height:120px; resize:vertical}
input:focus,select:focus,textarea:focus{outline:0; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--faint);
  font-weight:600; margin:0 0 4px}
.field{margin-bottom:10px}
.row{display:flex; gap:8px; align-items:center}
.row.wrap{flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 7px;
  border-radius:999px; border:1px solid var(--line2); background:var(--panel2); color:var(--dim); white-space:nowrap}
.chip.good{color:var(--good); background:var(--good-bg); border-color:transparent}
.chip.warn{color:var(--warn); background:var(--warn-bg); border-color:transparent}
.chip.bad{color:var(--bad); background:var(--bad-bg); border-color:transparent}
.chip.acc{color:var(--accent); background:var(--accent-soft); border-color:transparent}

/* ---- board ---- */
.zone{border:1px solid var(--line); border-radius:var(--r); background:var(--panel); margin-bottom:10px; overflow:hidden}
.zone > header{display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel2);
  border-bottom:1px solid var(--line)}
.zone > header h4{font-size:12.5px; letter-spacing:.6px; text-transform:uppercase}
.slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:8px; padding:10px}
.slot{border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:8px 9px; text-align:left;
  display:flex; flex-direction:column; gap:5px; min-height:78px; width:100%; position:relative}
.slot:hover{border-color:var(--accent-line)}
.slot.sel{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.slot.empty{background:var(--sunk); border-style:dashed; color:var(--faint); justify-content:center; align-items:center}
.slot .sq{font-size:12.5px; font-weight:600; line-height:1.3}
.slot .mem{font-size:11px; color:var(--dim); line-height:1.35}
.slot .lead{color:var(--accent); font-weight:600}
.slot .plan{display:flex; align-items:center; gap:6px; margin-top:auto; padding-top:5px; border-top:1px dashed var(--line);
  font-size:11.5px}
.slot .plan .nm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.slot .idx{position:absolute; top:6px; right:8px; font-family:var(--mono); font-size:10px; color:var(--faint)}

/* ---- counter table ---- */
.ctable{width:100%; border-collapse:collapse; font-size:12.5px}
.ctable th{font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--faint); font-weight:600;
  text-align:right; padding:5px 6px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer}
.ctable th.l{text-align:left}
.ctable th.sorted{color:var(--accent)}
.ctable td{padding:7px 6px; border-bottom:1px solid var(--line); text-align:right; vertical-align:top}
.ctable td.l{text-align:left}
.ctable tbody tr:hover{background:var(--panel2)}
.ctable tr.blocked td{color:var(--faint)}
.ctable tr.blocked .teamname{text-decoration:line-through}
.ctable tr.picked{background:var(--accent-soft)}
.ctable tr.picked:hover{background:var(--accent-soft)}
.teamname{font-weight:600; color:var(--ink)}
tr.blocked .teamname{color:var(--faint)}
.mems{font-size:11px; color:var(--dim); line-height:1.35}
.why{font-size:11px; color:var(--bad); margin-top:3px; line-height:1.35}
.why.warn{color:var(--warn)}
.pbar{height:3px; border-radius:2px; background:var(--sunk); margin-top:4px; overflow:hidden}
.pbar i{display:block; height:100%; background:var(--accent)}

/* ---- misc ---- */
.list{border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.list .it{display:flex; gap:10px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--line); font-size:12.5px}
.list .it:last-child{border-bottom:0}
.list .it:nth-child(even){background:var(--panel2)}
.ac{position:relative}
.acmenu{position:absolute; z-index:60; left:0; right:0; top:100%; margin-top:4px; background:var(--panel);
  border:1px solid var(--line2); border-radius:8px; box-shadow:var(--shadow); max-height:230px; overflow:auto}
.acmenu div{padding:6px 9px; font-size:12.5px; cursor:pointer}
.acmenu div.on{background:var(--accent-soft); color:var(--accent)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:90; background:var(--ink);
  color:var(--bg); padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow)}
.modal{position:fixed; inset:0; z-index:100; background:rgba(8,14,16,.55); display:flex; align-items:center;
  justify-content:center; padding:16px}
.modal .box{background:var(--panel); border:1px solid var(--line2); border-radius:12px; max-width:520px; width:100%;
  padding:16px; box-shadow:var(--shadow)}
.scroll{overflow-x:auto}
.samp{display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
  color:var(--warn); background:var(--warn-bg); padding:1px 5px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

<script type="text/plain" class="appsrc">
const {useState, useEffect, useMemo, useRef, useCallback} = React;

/* ============================ name handling ============================ */

const ALIASES = {
  slkr:"Supreme Leader Kylo Ren", kru:"Kylo Ren (Unmasked)", fost:"Sith Trooper",
  hux:"General Hux", foo:"First Order Officer",
  jmk:"Jedi Master Kenobi", gk:"General Kenobi", cat:"Commander Ahsoka Tano",
  jkck:"Jedi Knight Cal Kestis", cal:"Jedi Knight Cal Kestis",
  jml:"Jedi Master Luke Skywalker", hy:"Hermit Yoda", gmy:"Grand Master Yoda",
  jkl:"Jedi Knight Luke Skywalker", jkr:"Jedi Knight Revan",
  dr:"Darth Revan", malak:"Darth Malak", bsf:"Bastila Shan (Fallen)", hk:"HK-47",
  see:"Sith Eternal Emperor", ep:"Emperor Palpatine", traya:"Darth Traya",
  nihilus:"Darth Nihilus", sion:"Darth Sion", malgus:"Darth Malgus",
  lv:"Lord Vader", dv:"Darth Vader", gat:"Grand Admiral Thrawn", rg:"Royal Guard",
  gm:"Great Mothers", talzin:"Mother Talzin", av:"Asajj Ventress",
  jabba:"Jabba the Hutt", boushh:"Princess Leia (Boushh)", bfsoj:"Boba Fett, Scion of Jango",
  bkm:"Bo-Katan Kryze (Mand'alor)", msc:"Mandalorian Super Commando", bk:"Bo-Katan Kryze",
  trench:"Admiral Trench", b1:"B1 Battle Droid", b2:"B2 Super Battle Droid",
  magna:"IG-100 MagnaGuard", gg:"General Grievous", nute:"Nute Gunray",
  holdo:"Amilyn Holdo", rose:"Rose Tico", finn:"Finn", bensolo:"Ben Solo",
  jolee:"Jolee Bindo", mace:"Mace Windu", ahsoka:"Ahsoka Tano", sa:"Sith Assassin",
  krrsantan:"Black Krrsantan", bib:"Bib Fortuna", merrin:"Merrin", daughter:"Daughter",
  sabine:"Sabine Wren", gar:"Gar Saxon",
};

const norm = s => String(s||"").toLowerCase()
  .replace(/[‘’']/g,"").replace(/[^a-z0-9]+/g," ").trim();

/* Canonical key for a character: alias-expanded, punctuation-free. */
function charKey(name){
  const n = norm(name);
  const compact = n.replace(/\s+/g,"");
  if(ALIASES[compact]) return norm(ALIASES[compact]);
  return n;
}
function displayName(name){
  const compact = norm(name).replace(/\s+/g,"");
  return ALIASES[compact] || String(name||"").trim();
}

/* A squad is an array of display names; index 0 is the leader. */
function parseSquad(text){
  if(Array.isArray(text)) return text.map(displayName).filter(Boolean);
  let t = String(text||"").trim();
  if(!t) return [];
  let parts = t.split(/\s*[|;/•]\s*|\s*,\s*|\s{2,}/).map(s=>s.trim()).filter(Boolean);
  let leadIdx = parts.findIndex(p=>/\((l|lead|leader)\)\s*$/i.test(p));
  parts = parts.map(p=>p.replace(/\s*\((l|lead|leader)\)\s*$/i,"").trim());
  if(leadIdx > 0){ const [ld] = parts.splice(leadIdx,1); parts.unshift(ld); }
  return parts.map(displayName).filter(Boolean).slice(0,8);
}
const squadText = sq => (sq||[]).join(" | ");
const squadLabel = sq => !sq||!sq.length ? "—" : sq[0] + (sq.length>1 ? " +"+(sq.length-1) : "");
const squadKey = sq => (sq||[]).map(charKey).slice().sort().join("~");

/* How well a counter-DB defense row matches the squad sitting in a slot. */
function matchScore(a, b){
  if(!a.length || !b.length) return 0;
  const A = a.map(charKey), B = b.map(charKey);
  const inter = A.filter(x=>B.includes(x)).length;
  const overlap = inter / Math.max(A.length, B.length);
  const leader = A[0] === B[0];
  if(leader && overlap === 1) return 1;
  if(leader) return 0.55 + overlap*0.4;
  return overlap >= 0.6 ? overlap*0.5 : 0;
}
function matchLabel(s){
  if(s >= 1) return {t:"exact", cls:"good"};
  if(s >= 0.75) return {t:"close", cls:"acc"};
  if(s >= 0.55) return {t:"same leader", cls:""};
  return {t:"loose", cls:"warn"};
}

/* ============================ statistics ============================ */

/* Inverse normal CDF (Acklam). Used to turn a confidence level into z. */
function invNorm(p){
  if(p<=0) return -Infinity; if(p>=1) return Infinity;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425;
  let _q, _r;
  if(p<pl){ _q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*_q+c[1])*_q+c[2])*_q+c[3])*_q+c[4])*_q+c[5])/((((d[0]*_q+d[1])*_q+d[2])*_q+d[3])*_q+1); }
  if(p>1-pl){ _q=Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*_q+c[1])*_q+c[2])*_q+c[3])*_q+c[4])*_q+c[5])/((((d[0]*_q+d[1])*_q+d[2])*_q+d[3])*_q+1); }
  _q=p-0.5; _r=_q*_q;
  return (((((a[0]*_r+a[1])*_r+a[2])*_r+a[3])*_r+a[4])*_r+a[5])*_q/(((((b[0]*_r+b[1])*_r+b[2])*_r+b[3])*_r+b[4])*_r+1);
}
/* One-sided Wilson score lower bound. */
function wilsonLower(pRaw, n, conf){
  if(!n || n<=0) return 0;
  const z = invNorm(Math.min(0.9999, Math.max(0.5, conf)));
  const p = Math.min(1, Math.max(0, pRaw));
  const den = 1 + z*z/n;
  const centre = p + z*z/(2*n);
  const margin = z*Math.sqrt((p*(1-p) + z*z/(4*n))/n);
  return Math.max(0, Math.min(1, (centre - margin)/den));
}
const pct = x => (x*100).toFixed(1);
const b1 = x => (Math.round(x*10)/10).toFixed(1);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);

/* ============================ CSV / paste parsing ============================ */

function splitDelimited(text){
  const rows=[]; let row=[], cell="", q=false;
  const delim = (text.split("\t").length > text.split(",").length) ? "\t" : ",";
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"'; i++;} else q=false; }
      else cell+=c;
    } else if(c==='"'){ q=true; }
    else if(c===delim){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c==="\r"){ /* skip */ }
    else cell+=c;
  }
  row.push(cell); rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
const HEAD = {
  name:["name","character","unit","toon"],
  stars:["stars","star","rarity"],
  gear:["gear","gearlevel","gear level","g"],
  relic:["relic","relics","relic level","r"],
  zeta:["zeta","zetas","key zeta","has zeta"],
  omicron:["omicron","omicrons","omi","key omicron"],
  defense:["defense","defence","defense squad","enemy","opponent","opposing squad","target"],
  counter:["counter","counter squad","attack","my squad","offense"],
  win:["win %","win%","winpct","win rate","winrate","win","wins %","success %"],
  battles:["battles","battles seen","n","sample","seen","count","games"],
  banners:["avg banners","banners","avg banner","average banners","points"],
  mode:["mode","game mode","format","size"],
  minrelic:["min relic","minrelic","relic req","required relic","min r"],
  notes:["notes","note","comment"],
};
function headerIndex(headerRow){
  const idx={}; const cells=headerRow.map(h=>norm(h));
  for(const key in HEAD){
    for(let i=0;i<cells.length;i++){
      if(HEAD[key].some(alt=>norm(alt)===cells[i])){ idx[key]=i; break; }
    }
  }
  return idx;
}

<script type="text/plain" class="appsrc">
/* ============================ scoring engine ============================ */

function slotList(board){
  const out=[];
  (board.zones||[]).forEach(z=>{
    for(let i=0;i<z.slots;i++){
      const id = z.id+":"+i;
      out.push({id, zoneId:z.id, zone:z.name, idx:i+1, squad:board.squads[id]||null});
    }
  });
  return out;
}
function slotName(s){ return s.zone + " #" + s.idx; }

/* One pass over the whole board: candidates, gating, availability, cleanup cost, EV. */
function buildEngine(state){
  const S = state.settings;
  const rosterMap = new Map();
  state.roster.forEach(r=>rosterMap.set(charKey(r.name), r));

  const slots = slotList(state.board);
  const filled = slots.filter(s=>s.squad && s.squad.length);

  /* who is holding which character right now */
  const held = new Map();  /* charKey -> slotId */
  filled.forEach(s=>{
    const rowId = state.assign[s.id];
    if(!rowId) return;
    const row = state.counters.find(c=>c.id===rowId);
    if(!row) return;
    row.cnt.forEach(n=>held.set(charKey(n), s.id));
  });

  const perSlot = {};
  filled.forEach(slot=>{
    const raw = [];
    state.counters.forEach(row=>{
      if(row.mode && S.mode && row.mode !== S.mode) return;
      const m = matchScore(row.def, slot.squad);
      if(m <= 0) return;
      const n = Math.max(0, Math.round(row.battles||0));
      const pRaw = Math.min(1, Math.max(0, (row.win||0)/100));
      const pAdj = wilsonLower(pRaw, n, S.conf);
      const banners = Number(row.banners)||0;
      const missing=[], under=[];
      row.cnt.forEach(nm=>{
        const rec = rosterMap.get(charKey(nm));
        if(!rec) missing.push(nm);
        else if((row.minRelic||0) > 0 && (Number(rec.relic)||0) < row.minRelic) under.push(nm+" R"+(rec.relic||0));
      });
      const blocked = [];
      row.cnt.forEach(nm=>{
        const at = held.get(charKey(nm));
        if(at && at !== slot.id) blocked.push({char:nm, slotId:at});
      });
      raw.push({
        row, rowId:row.id, match:m, n, pRaw, pAdj, banners,
        evSimple: pAdj*banners, missing, under, blocked,
        fieldable: missing.length===0,
        assigned: state.assign[slot.id]===row.id,
        belowSample: n < S.minSample,
      });
    });

    /* cleanup cost: the next-best team I could still field on the retry */
    const partial = (S.partialFrac||0) * (S.fullClear||0);
    raw.forEach(c=>{
      let best = 0;
      raw.forEach(o=>{
        if(o===c || !o.fieldable || o.blocked.length) return;
        const overlap = o.row.cnt.some(nm=>c.row.cnt.map(charKey).includes(charKey(nm)));
        if(overlap) return;
        if(o.evSimple > best) best = o.evSimple;
      });
      c.cleanup = best;
      c.partial = partial;
      c.adjEV = c.pAdj*c.banners + (1-c.pAdj)*(partial - best);
    });
    perSlot[slot.id] = raw;
  });

  return {slots, filled, perSlot, rosterMap, held};
}

const SORTS = {
  padj:  {label:"Adj win %", get:c=>c.pAdj},
  adjev: {label:"Adj EV",    get:c=>c.adjEV},
  raw:   {label:"Raw win %", get:c=>c.pRaw},
  n:     {label:"Battles",   get:c=>c.n},
  ban:   {label:"Avg banners", get:c=>c.banners},
};
function sortCands(list, key){
  const g = (SORTS[key]||SORTS.padj).get;
  return list.slice().sort((a,b)=>{
    if(a.assigned !== b.assigned) return a.assigned ? -1 : 1;
    const d = g(b)-g(a);
    if(d) return d;
    return b.match - a.match;
  });
}

/* ============================ small UI pieces ============================ */

function Chip({kind, children, title}){
  return <span className={"chip "+(kind||"")} title={title||""}>{children}</span>;
}
function Readout({items}){
  return (
    <div className="readout">
      {items.map((it,i)=>(
        <div className="r" key={i}><b style={it.color?{color:it.color}:null}>{it.v}</b><span>{it.k}</span></div>
      ))}
    </div>
  );
}
function Confirm({title, body, okLabel, onOk, onCancel, danger}){
  return (
    <div className="modal" onClick={e=>{ if(e.target===e.currentTarget) onCancel(); }}>
      <div className="box" role="dialog" aria-modal="true">
        <h3 style={{fontSize:"15px", marginBottom:"8px"}}>{title}</h3>
        <div className="muted" style={{fontSize:"13px"}}>{body}</div>
        <div className="row" style={{marginTop:"14px", justifyContent:"flex-end"}}>
          <button className="btn ghost" onClick={onCancel}>Cancel</button>
          <button className={"btn "+(danger?"danger":"primary")} onClick={onOk} autoFocus>{okLabel}</button>
        </div>
      </div>
    </div>
  );
}

/* Character + whole-squad autocomplete. Leader is whatever sits first. */
function SquadInput({value, onSave, onCancel, pool, squads, placeholder}){
  const [text, setText] = useState(value||"");
  const [open, setOpen] = useState(true);
  const [hi, setHi] = useState(0);
  const ref = useRef(null);
  useEffect(()=>{ if(ref.current) ref.current.focus(); }, []);

  const cut = Math.max(text.lastIndexOf("|"), text.lastIndexOf(","), text.lastIndexOf(";"));
  const head = cut>=0 ? text.slice(0, cut+1) : "";
  const token = (cut>=0 ? text.slice(cut+1) : text).trim();
  const tk = norm(token);

  const suggestions = useMemo(()=>{
    const out=[];
    if(tk.length>0){
      squads.forEach(sq=>{
        if(out.filter(o=>o.kind==="squad").length>=4) return;
        const hay = sq.map(n=>norm(n)).join(" ");
        if(hay.includes(tk) || norm(displayName(token))===norm(sq[0])) out.push({kind:"squad", squad:sq});
      });
    }
    const used = new Set(parseSquad(head).map(charKey));
    pool.forEach(nm=>{
      if(out.filter(o=>o.kind==="char").length>=10) return;
      if(used.has(charKey(nm))) return;
      const n = norm(nm), alias = norm(displayName(token));
      if(!tk || n.includes(tk) || n.split(" ").some(w=>w.startsWith(tk)) || (alias && n===alias))
        out.push({kind:"char", name:nm});
    });
    return out;
  }, [tk, head, pool, squads]);

  const accept = (s)=>{
    if(!s) return;
    if(s.kind==="squad"){ onSave(s.squad); return; }
    const next = (head ? head+" " : "") + s.name + " | ";
    setText(next); setHi(0); setOpen(true);
    if(ref.current) ref.current.focus();
  };
  const key = (e)=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); setOpen(true); setHi(h=>Math.min(h+1, suggestions.length-1)); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setHi(h=>Math.max(0,h-1)); }
    else if(e.key==="Escape"){ e.preventDefault(); if(open && token) setOpen(false); else onCancel(); }
    else if(e.key==="Tab" && open && suggestions.length){ e.preventDefault(); accept(suggestions[hi]); }
    else if(e.key==="Enter"){
      e.preventDefault();
      if(open && token && suggestions.length) accept(suggestions[hi]);
      else onSave(parseSquad(text));
    }
  };
  return (
    <div className="ac">
      <input ref={ref} type="text" value={text} placeholder={placeholder||"Leader first, then members"}
        onChange={e=>{setText(e.target.value); setOpen(true); setHi(0);}}
        onKeyDown={key} onBlur={()=>setTimeout(()=>setOpen(false), 160)} onFocus={()=>setOpen(true)} />
      {open && suggestions.length>0 &&
        <div className="acmenu">
          {suggestions.map((s,i)=>(
            <div key={i} className={i===hi?"on":""} onMouseDown={e=>{e.preventDefault(); accept(s);}}
                 onMouseEnter={()=>setHi(i)}>
              {s.kind==="squad"
                ? <span><span className="samp" style={{marginRight:"6px"}}>squad</span>{squadText(s.squad)}</span>
                : s.name}
            </div>
          ))}
        </div>}
      <div className="tiny faint" style={{marginTop:"4px"}}>
        Separate with <b>|</b> or commas. First name is the leader. Enter picks the highlighted line, Enter again saves.
      </div>
    </div>
  );
}
</script>

<script type="text/plain" class="appsrc">
/* ============================ the board ============================ */

function Slot({slot, cand, selected, editing, onSelect, onEdit, onSave, onClear, pool, squads}){
  if(editing){
    return (
      <div className="slot sel" style={{minHeight:"96px"}}>
        <div className="eyebrow">{slotName(slot)}</div>
        <SquadInput value={slot.squad?squadText(slot.squad):""} pool={pool} squads={squads}
          onSave={sq=>onSave(sq)} onCancel={()=>onEdit(null)} />
        <div className="row" style={{marginTop:"6px"}}>
          <button className="btn sm" onMouseDown={e=>e.preventDefault()} onClick={()=>onEdit(null)}>Done</button>
          {slot.squad && <button className="btn sm danger" onMouseDown={e=>e.preventDefault()}
            onClick={()=>onClear()}>Clear slot</button>}
        </div>
      </div>
    );
  }
  if(!slot.squad || !slot.squad.length){
    return (
      <button className="slot empty" onClick={()=>{onSelect(); onEdit(slot.id);}}>
        <span className="idx">{slot.idx}</span>
        <span className="tiny">+ add squad</span>
      </button>
    );
  }
  return (
    <button className={"slot"+(selected?" sel":"")} onClick={onSelect} onDoubleClick={()=>onEdit(slot.id)}>
      <span className="idx">{slot.idx}</span>
      <span className="sq"><span className="lead">{slot.squad[0]}</span></span>
      <span className="mem">{slot.squad.slice(1).join(", ")||"—"}</span>
      <span className="plan">
        {cand
          ? <><Chip kind={cand.blocked.length?"bad":"good"}>{pct(cand.pAdj)}%</Chip>
              <span className="nm">{cand.row.cnt[0]}</span>
              <span className="num faint" style={{marginLeft:"auto"}}>{b1(cand.adjEV)}</span></>
          : <span className="faint">no attack planned</span>}
      </span>
    </button>
  );
}

function BoardGrid({state, eng, sel, setSel, editing, setEditing, actions, pool, defSquads}){
  const byId = {};
  eng.slots.forEach(s=>byId[s.id]=s);
  return (
    <div>
      {(state.board.zones||[]).map(z=>(
        <section className="zone" key={z.id}>
          <header>
            <h4>{z.name}</h4>
            <span className="tiny faint num">
              {Array.from({length:z.slots}).filter((_,i)=>state.board.squads[z.id+":"+i]).length}/{z.slots} filled
            </span>
            <span className="spacer" style={{flex:1}}></span>
            <span className="tiny faint num">
              {Array.from({length:z.slots}).filter((_,i)=>state.assign[z.id+":"+i]).length} planned
            </span>
          </header>
          <div className="slots">
            {Array.from({length:z.slots}).map((_,i)=>{
              const id = z.id+":"+i;
              const slot = byId[id] || {id, zone:z.name, idx:i+1, squad:state.board.squads[id]||null};
              const rowId = state.assign[id];
              const cand = rowId ? (eng.perSlot[id]||[]).find(c=>c.rowId===rowId) : null;
              return <Slot key={id} slot={slot} cand={cand} selected={sel===id} editing={editing===id}
                onSelect={()=>setSel(id)} onEdit={setEditing} pool={pool} squads={defSquads}
                onSave={sq=>{ actions.setSquad(id, sq); setEditing(null); setSel(id); }}
                onClear={()=>{ actions.setSquad(id, null); setEditing(null); }} />;
            })}
          </div>
        </section>
      ))}
    </div>
  );
}

/* ============================ counter suggestions ============================ */

function CounterTable({state, eng, slot, actions}){
  const S = state.settings;
  const [confirm, setConfirm] = useState(null);
  const all = eng.perSlot[slot.id] || [];
  const shown = sortCands(all.filter(c=>c.n >= S.minSample || c.assigned), S.sortKey);
  const hidden = all.length - shown.length;
  const nameOf = id => { const s = eng.slots.find(x=>x.id===id); return s?slotName(s):id; };

  const pick = (c)=>{
    if(c.assigned){ actions.assign(slot.id, null); return; }
    if(c.blocked.length){
      const slots = Array.from(new Set(c.blocked.map(b=>b.slotId)));
      setConfirm({c, slots});
      return;
    }
    actions.assign(slot.id, c.rowId);
  };

  const TIPS = {
    padj:"Adjusted win % — the win rate this counter has actually proven, after discounting for how few battles back it up.",
    raw:"Raw win % exactly as recorded in your counter database.",
    n:"Battles seen. The bigger this is, the closer the adjusted number sits to the raw one.",
    ban:"Average banners this counter scores when it wins.",
    adjev:"Loss-adjusted expected banners: what the attack is worth once the cost of failing and re-clearing is priced in.",
  };
  const th = (k, label, cls)=>(
    <th className={(cls||"")+(S.sortKey===k?" sorted":"")} onClick={()=>actions.setSetting("sortKey",k)}
        title={TIPS[k]+" Click to sort by it."}>{label}{S.sortKey===k?" ▾":""}</th>
  );

  return (
    <div>
      {confirm &&
        <Confirm title="That team is committed elsewhere"
          okLabel="Free it and use it here" danger
          onCancel={()=>setConfirm(null)}
          onOk={()=>{ confirm.slots.forEach(sid=>actions.assign(sid,null)); actions.assign(slot.id, confirm.c.rowId); setConfirm(null); }}
          body={<span>
            {squadLabel(confirm.c.row.cnt)} needs {confirm.c.blocked.map(b=>b.char).join(", ")}, currently attacking{" "}
            {confirm.slots.map(nameOf).join(" and ")}. Freeing it leaves {confirm.slots.length>1?"those slots":"that slot"} with no attack planned.
          </span>} />}

      <div className="scroll">
        <table className="ctable">
          <thead><tr>
            <th className="l">Counter team</th>
            {th("padj","Adj %")}{th("raw","Raw")}{th("n","n")}{th("ban","Ban")}{th("adjev","Adj EV")}
          </tr></thead>
          <tbody>
            {shown.map(c=>{
              const cls = [c.blocked.length?"blocked":"", c.assigned?"picked":""].filter(Boolean).join(" ");
              return (
                <tr key={c.rowId} className={cls} onClick={()=>pick(c)} style={{cursor:"pointer"}}
                    tabIndex={0} role="button"
                    title={c.assigned?"Click to unassign":(c.blocked.length?"Committed elsewhere — click to move it here":"Click to plan this attack")}
                    onKeyDown={e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(c); } }}>
                  <td className="l" style={{maxWidth:"240px"}}>
                    <div className="row" style={{gap:"6px", alignItems:"baseline"}}>
                      <span className="teamname">{c.row.cnt[0]}</span>
                      {c.assigned && <Chip kind="acc">planned</Chip>}
                      {c.match<1 && <Chip kind={matchLabel(c.match).cls} title="How closely this row's defense matches the squad in the slot">{matchLabel(c.match).t}</Chip>}
                    </div>
                    <div className="mems">{c.row.cnt.slice(1).join(", ")}</div>
                    {c.missing.length>0 && <div className="why">✕ not on your roster: {c.missing.join(", ")}</div>}
                    {c.under.length>0 && <div className="why warn">⚠ under the relic you set (R{c.row.minRelic}): {c.under.join(", ")}</div>}
                    {c.blocked.map((b,i)=>(
                      <div className="why" key={i}>⛔ {b.char} is attacking {nameOf(b.slotId)}</div>
                    ))}
                    {c.row.notes && <div className="mems faint">{c.row.notes}</div>}
                    <div className="pbar"><i style={{width:Math.round(c.pAdj*100)+"%"}}></i></div>
                  </td>
                  <td className="num" style={{fontWeight:600}}>{pct(c.pAdj)}</td>
                  <td className="num faint">{pct(c.pRaw)}</td>
                  <td className="num faint">{c.n.toLocaleString()}</td>
                  <td className="num">{b1(c.banners)}</td>
                  <td className="num" style={{color:c.adjEV<0?"var(--bad)":"inherit", fontWeight:600}}>{b1(c.adjEV)}</td>
                </tr>
              );
            })}

        <div className="tiny faint" style={{marginTop:"6px"}}>

  );
}

      <div className="pad">

          <label className="tiny faint" style={{whiteSpace:"nowrap"}}>Min battles</label>
          <input type="range" min="0" max="500" step="10" value={S.minSample} style={{flex:1}}
            onChange={e=>actions.setSetting("minSample", Number(e.target.value))} />
          <span className="num" style={{width:"38px", textAlign:"right"}}>{S.minSample}</span>
        </div>
        <div className="tiny faint" style={{marginBottom:"6px"}}>
          Sorted by <b>{(SORTS[S.sortKey]||SORTS.padj).label}</b> — click a column heading to change that.
          Click a row to plan it; struck-through rows are teams already committed elsewhere.
        </div>
        <CounterTable state={state} eng={eng} slot={slot} actions={actions} />
      </div>
    </div>
  );
}

<script type="text/plain" class="appsrc">
/* ============================ opportunity cost ============================ */

function opportunityRows(state, eng){
  const out=[];
  eng.filled.forEach(slot=>{
    const rowId = state.assign[slot.id];
    if(!rowId) return;
    const list = eng.perSlot[slot.id]||[];
    const here = list.find(c=>c.rowId===rowId);
    if(!here) return;
    const key = squadKey(here.row.cnt);

    let bestElse = null;
    eng.filled.forEach(other=>{
      if(other.id===slot.id) return;
      (eng.perSlot[other.id]||[]).forEach(c=>{
        if(squadKey(c.row.cnt)!==key) return;
        if(c.n < state.settings.minSample) return;
        if(!bestElse || c.adjEV > bestElse.adjEV) bestElse = {...c, slot:other, taken:!!state.assign[other.id]};
      });
    });

    let replacement = null;
    list.forEach(c=>{
      if(c.rowId===rowId || !c.fieldable || c.blocked.length) return;
      if(c.n < state.settings.minSample) return;
      if(!replacement || c.adjEV > replacement.adjEV) replacement = c;
    });
    out.push({slot, here, bestElse, replacement});
  });
  return out;
}

function OpportunityPanel({state, eng, setSel}){
  const rows = opportunityRows(state, eng);
  if(!rows.length) return null;
  return (
    <div className="panel" style={{marginTop:"14px"}}>
      <div className="pad" style={{borderBottom:"1px solid var(--line)"}}>
        <div className="eyebrow">Opportunity cost</div>
        <div className="tiny muted">What each committed team is worth here, where else it could go, and what would take its place.</div>
      </div>
      <div className="scroll">
        <table className="ctable">
          <thead><tr>
            <th className="l">Slot</th><th className="l">Team</th><th>Here</th>
            <th className="l">Best other slot</th><th className="l">If it moved, this slot gets</th>
          </tr></thead>
          <tbody>
            {rows.map(r=>(
              <tr key={r.slot.id} onClick={()=>setSel(r.slot.id)} style={{cursor:"pointer"}}>
                <td className="l"><span className="teamname">{slotName(r.slot)}</span>
                  <div className="mems">vs {squadLabel(r.slot.squad)}</div></td>
                <td className="l"><span className="teamname">{r.here.row.cnt[0]}</span>
                  <div className="mems">{r.here.row.cnt.slice(1).join(", ")}</div></td>
                <td className="num" style={{fontWeight:600}}>{b1(r.here.adjEV)}</td>
                <td className="l">
                  {r.bestElse
                    ? <span>{slotName(r.bestElse.slot)} <span className="num">({b1(r.bestElse.adjEV)})</span>
                        {r.bestElse.adjEV > r.here.adjEV && <Chip kind="warn" title="Worth more there than here">+{b1(r.bestElse.adjEV-r.here.adjEV)}</Chip>}
                        {r.bestElse.taken && <span className="faint tiny"> — already planned</span>}</span>
                    : <span className="faint">nowhere else on this board</span>}
                </td>
                <td className="l">
                  {r.replacement
                    ? <span>{r.replacement.row.cnt[0]} <span className="num">({b1(r.replacement.adjEV)})</span>
                        <span className={r.replacement.adjEV<r.here.adjEV?"why":"why warn"} style={{color:"var(--dim)"}}>
                          {b1(r.replacement.adjEV-r.here.adjEV)} banners</span></span>
                    : <span className="faint">nothing left that beats it</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================ optimizer ============================ */

function optimize(state, eng){
  const S = state.settings;
  const partial = (S.partialFrac||0)*(S.fullClear||0);
  const slots = eng.filled.map(s=>s.id);
  const cands = {};
  slots.forEach(id=>{
    const raw = (eng.perSlot[id]||[]).filter(c=>
      c.n >= S.minSample && c.fieldable && (S.allowUnderGeared || c.under.length===0));
    const list = raw.map(c=>({
      rowId:c.rowId, row:c.row, pAdj:c.pAdj, banners:c.banners, n:c.n,
      chars:c.row.cnt.map(charKey), evSimple:c.evSimple, sk:squadKey(c.row.cnt),
    }));
    list.forEach(c=>{
      let best=0;
      list.forEach(o=>{
        if(o===c) return;
        if(o.chars.some(k=>c.chars.includes(k))) return;
        if(o.evSimple>best) best=o.evSimple;
      });
      c.score = c.pAdj*c.banners + (1-c.pAdj)*(partial - best);
    });
    cands[id] = list.sort((a,b)=>b.score-a.score);
  });

  const plan = {};                 /* slotId -> cand */
  const owner = new Map();         /* charKey -> slotId */
  const canPlace = (id,c)=>c.chars.every(k=>{ const o=owner.get(k); return !o || o===id; });
  const place = (id,c)=>{ plan[id]=c; c.chars.forEach(k=>owner.set(k,id)); };
  const lift = (id)=>{ const c=plan[id]; if(!c) return; c.chars.forEach(k=>{ if(owner.get(k)===id) owner.delete(k); }); delete plan[id]; };

  /* greedy seed */
  const pairs=[];
  slots.forEach(id=>cands[id].forEach(c=>pairs.push({id,c})));
  pairs.sort((a,b)=>b.c.score-a.c.score);
  pairs.forEach(p=>{ if(plan[p.id]) return; if(p.c.score<=0) return; if(canPlace(p.id,p.c)) place(p.id,p.c); });

  /* local search: single replacements, then pairwise swaps */
  const total = ()=>slots.reduce((t,id)=>t+(plan[id]?plan[id].score:0),0);
  for(let pass=0; pass<60; pass++){
    let moved=false;
    for(const id of slots){
      const cur = plan[id];
      let best=null;
      for(const c of cands[id]){
        if(cur && c.rowId===cur.rowId) continue;
        if(c.score <= (cur?cur.score:0)) continue;
        lift(id);
        const ok = canPlace(id,c);
        if(cur) place(id,cur);
        if(ok && (!best || c.score>best.score)) best=c;
      }
      if(best){ lift(id); place(id,best); moved=true; }
    }
    for(let i=0;i<slots.length && !moved;i++){
      for(let j=i+1;j<slots.length;j++){
        const a=slots[i], b=slots[j], ca=plan[a], cb=plan[b];
        if(!ca && !cb) continue;
        const altA = cb ? cands[a].find(c=>c.sk===cb.sk) : null;
        const altB = ca ? cands[b].find(c=>c.sk===ca.sk) : null;
        const before = (ca?ca.score:0)+(cb?cb.score:0);
        const after  = (altA?altA.score:0)+(altB?altB.score:0);
        if(after<=before+1e-9) continue;
        lift(a); lift(b);
        if((!altA||canPlace(a,altA))){ if(altA) place(a,altA); }
        if((!altB||canPlace(b,altB))){ if(altB) place(b,altB); }
        if(!plan[a] && ca && canPlace(a,ca)) place(a,ca);
        if(!plan[b] && cb && canPlace(b,cb)) place(b,cb);
        moved=true; break;
      }
    }
    if(!moved) break;
  }

  /* cleanup reserve: hold back retries for the shakiest attacks */
  const reserves=[]; const freed=[];
  const targets = slots.filter(id=>plan[id]).sort((a,b)=>plan[a].pAdj-plan[b].pAdj).slice(0, Math.max(0,S.reserveN||0));
  targets.forEach(id=>{
    const pick = ()=>cands[id].find(c=>c.rowId!==plan[id].rowId && c.chars.every(k=>!owner.has(k)));
    let backup = pick();
    if(!backup){
      const donor = slots.filter(s=>plan[s] && !targets.includes(s))
        .sort((a,b)=>plan[a].score-plan[b].score)[0];
      if(donor){ const keep=plan[donor]; lift(donor); backup=pick();
        if(backup){ freed.push(donor); } else { place(donor,keep); } }
    }
    if(backup){ backup.chars.forEach(k=>owner.set(k,"reserve:"+id)); reserves.push({slotId:id, cand:backup}); }
  });

  return {plan, reserves, freed, total:total(), cands};
}

function OptimizerPanel({state, eng, actions, onClose}){
  const res = useMemo(()=>optimize(state, eng), [state, eng]);
  const S = state.settings;
  const partial = (S.partialFrac||0)*(S.fullClear||0);
  const curTotal = eng.filled.reduce((t,s)=>{
    const rowId = state.assign[s.id]; if(!rowId) return t;
    const c=(res.cands[s.id]||[]).find(x=>x.rowId===rowId);
    if(c) return t+c.score;
    const c2=(eng.perSlot[s.id]||[]).find(x=>x.rowId===rowId);
    return t + (c2 ? c2.pAdj*c2.banners + (1-c2.pAdj)*(partial - c2.cleanup) : 0);
  },0);
  const diff = res.total - curTotal;
  const planned = Object.keys(res.plan).length;
  const nameOf = id => { const s=eng.slots.find(x=>x.id===id); return s?slotName(s):id; };

  const accept = ()=>{
    const next={};
    Object.keys(res.plan).forEach(id=>next[id]=res.plan[id].rowId);
    actions.replaceAssign(next);
    onClose();
  };
  return (
    <div className="panel" style={{marginTop:"14px", borderColor:"var(--accent-line)"}}>
      <div className="pad" style={{borderBottom:"1px solid var(--line)", background:"var(--accent-soft)"}}>
        <div className="row wrap">
          <div>
            <div className="eyebrow" style={{color:"var(--accent)"}}>Proposed plan</div>
            <div className="row" style={{gap:"14px", marginTop:"4px"}}>
              <span className="num" style={{fontSize:"17px", fontWeight:600}}>{b1(res.total)}</span>
              <span className="tiny muted">optimizer total</span>
              <span className="num muted">{b1(curTotal)}</span>
              <span className="tiny muted">yours</span>
              <Chip kind={diff>0.05?"good":(diff<-0.05?"bad":"")}>{diff>=0?"+":""}{b1(diff)} banners</Chip>
            </div>
          </div>
          <span style={{flex:1}}></span>
          <button className="btn ghost" onClick={onClose}>Dismiss</button>
          <button className="btn primary" onClick={accept}>Accept this plan</button>
        </div>
        <div className="tiny muted" style={{marginTop:"6px"}}>
          Nothing on your board changes until you accept. {planned} slot{planned===1?"":"s"} attacked,
          {" "}{res.reserves.length} team{res.reserves.length===1?"":"s"} held in reserve.
        </div>
      </div>
      <div className="scroll">
        <table className="ctable">
          <thead><tr><th className="l">Slot</th><th className="l">Attack with</th><th>Adj %</th><th>Adj EV</th><th className="l">Change</th></tr></thead>
          <tbody>
            {eng.filled.map(s=>{
              const c = res.plan[s.id];
              const cur = state.assign[s.id];
              const same = c && cur === c.rowId;
              return (
                <tr key={s.id}>
                  <td className="l"><span className="teamname">{slotName(s)}</span>
                    <div className="mems">vs {squadLabel(s.squad)}</div></td>
                  <td className="l">{c ? <span><span className="teamname">{c.row.cnt[0]}</span>
                      <div className="mems">{c.row.cnt.slice(1).join(", ")}</div></span>
                    : res.freed.indexOf(s.id)>=0
                      ? <span className="faint">left open so a cleanup team stays free</span>
                      : <span className="faint">skip — nothing you can field beats it well enough</span>}</td>
                  <td className="num">{c?pct(c.pAdj):"—"}</td>
                  <td className="num" style={{fontWeight:600}}>{c?b1(c.score):"—"}</td>
                  <td className="l tiny">{
                    !c ? (cur ? <Chip kind="bad">dropped</Chip> : <span className="faint">—</span>)
                    : same ? <span className="faint">unchanged</span>
                    : cur ? <Chip kind="warn">swapped</Chip>
                    : <Chip kind="good">new</Chip>}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="pad" style={{borderTop:"1px solid var(--line)"}}>
        <div className="eyebrow">Cleanup reserve</div>
        {res.reserves.length===0
          ? <div className="tiny muted" style={{marginTop:"4px"}}>
              No spare team could be held back — every fieldable counter is already committed. Lower the reserve size
              in Settings if that is what you want.
            </div>
          : <div className="list" style={{marginTop:"6px"}}>
              {res.reserves.map((r,i)=>(
                <div className="it" key={i}>
                  <Chip kind="acc">held</Chip>
                  <div style={{flex:1}}>
                    <span className="teamname">{r.cand.row.cnt[0]}</span>
                    <span className="mems"> {r.cand.row.cnt.slice(1).join(", ")}</span>
                  </div>
                  <span className="tiny muted">retries {nameOf(r.slotId)}</span>
                  <span className="num tiny">{pct(r.cand.pAdj)}%</span>
                </div>
              ))}
            </div>}
        {res.freed.length>0 &&
          <div className="tiny warn" style={{marginTop:"6px", color:"var(--warn)"}}>
            {res.freed.map(nameOf).join(", ")} left unattacked so the reserve could be kept whole.
          </div>}
      </div>
    </div>
  );
}
</script>

<script type="text/plain" class="appsrc">
/* ============================ data tabs ============================ */

function Paster({label, hint, onImport}){
  const [txt, setTxt] = useState("");
  const [msg, setMsg] = useState("");
  return (
    <div className="panel pad" style={{marginBottom:"14px"}}>
      <div className="eyebrow">{label}</div>
      <div className="tiny muted" style={{margin:"4px 0 8px"}}>{hint}</div>

        placeholder="Paste here — a copied spreadsheet block or CSV, header row included." />
      <div className="row" style={{marginTop:"8px"}}>
        <button className="btn primary" disabled={!txt.trim()}
          onClick={()=>{ const r=onImport(txt); setMsg(r); setTxt(r.startsWith("Could not")?txt:""); }}>Import</button>
        {txt && <button className="btn ghost" onClick={()=>{setTxt(""); setMsg("");}}>Clear</button>}

}

                </tr>

          </table>

}

    <>

  const [q, setQ] = useState("");

    (r.def.concat(r.cnt).some(n=>norm(n).includes(norm(q)))));
  return (
    <div>
      <Paster label="Import counters"

        onImport={actions.importCounters} />
      <div className="panel">
        <div className="pad row" style={{borderBottom:"1px solid var(--line)"}}>
          <div className="eyebrow" style={{flex:1}}>Counter database — {state.counters.length} rows</div>
          <input type="search" placeholder="Filter by character" value={q} onChange={e=>setQ(e.target.value)} style={{width:"180px"}} />
          <button className="btn" onClick={()=>actions.addCounter()}>Add row</button>
        </div>
        <div className="scroll">
          <table className="ctable">
            <thead><tr>
              <th className="l">Defense squad</th><th className="l">Counter squad</th>
              <th>Win %</th><th>Battles</th><th>Ban</th><th>Mode</th><th>Min R</th><th></th>
            </tr></thead>
            <tbody>
              {rows.map(r=><CounterRow key={r.id} row={r} actions={actions} />)}
              {rows.length===0 && <tr><td colSpan="8" className="l muted" style={{padding:"14px"}}>
                No rows. Paste your counter data above.</td></tr>}
            </tbody>
          </table>
        </div>
        <div className="pad tiny muted">Click any row to edit or delete it.</div>
      </div>
    </div>
  );
}

function OppTab({state, actions}){
  return (
    <div>
      <Paster label="Import opponent offense history"
        hint="One squad per line — members separated by | or commas, leader first. Add a notes column if you like."
        onImport={actions.importOpp} />
      <div className="panel">
        <div className="pad row" style={{borderBottom:"1px solid var(--line)"}}>
          <div className="eyebrow" style={{flex:1}}>Squads this opponent has attacked with — {state.opp.length}</div>
          <button className="btn" onClick={()=>actions.addOpp()}>Add squad</button>
        </div>
        <div className="list" style={{border:0, borderRadius:0}}>
          {state.opp.map(o=>(
            <div className="it" key={o.id}>
              <input type="text" value={squadText(o.squad)} onChange={e=>actions.editOpp(o.id,{squad:parseSquad(e.target.value)})} />
              <input type="text" value={o.notes||""} placeholder="notes" style={{maxWidth:"180px"}}
                onChange={e=>actions.editOpp(o.id,{notes:e.target.value})} />
              <button className="btn sm danger" onClick={()=>actions.delOpp(o.id)}>Delete</button>
            </div>
          ))}
          {state.opp.length===0 && <div className="it muted">Nothing recorded yet. This feeds the defense planner in Phase 2.</div>}
        </div>
      </div>
    </div>
  );
}

function SetupTab({state, actions}){
  const zones = state.board.zones||[];
  return (
    <div className="panel">
      <div className="pad" style={{borderBottom:"1px solid var(--line)"}}>
        <div className="eyebrow">Zone layout</div>
        <div className="tiny muted">GAC formats change every season. Name the zones and set how many squads each holds.</div>
      </div>
      <div className="pad">
        {zones.map((z,i)=>(
          <div className="row" key={z.id} style={{marginBottom:"8px"}}>
            <input type="text" value={z.name} style={{maxWidth:"260px"}}
              onChange={e=>actions.editZone(z.id,{name:e.target.value})} />
            <input type="number" min="1" max="12" value={z.slots} style={{width:"80px"}} className="num"
              onChange={e=>actions.editZone(z.id,{slots:Math.max(1,Math.min(12,Number(e.target.value)||1))})} />
            <span className="tiny faint">squads</span>
            <span style={{flex:1}}></span>
            <button className="btn sm" disabled={i===0} onClick={()=>actions.moveZone(z.id,-1)}>↑</button>
            <button className="btn sm" disabled={i===zones.length-1} onClick={()=>actions.moveZone(z.id,1)}>↓</button>
            <button className="btn sm danger" onClick={()=>actions.delZone(z.id)}>Remove</button>
          </div>
        ))}
        <button className="btn" onClick={actions.addZone}>Add zone</button>
        <hr className="hr" />
        <div className="row">
          <label className="tiny faint">Game mode</label>
          <select value={state.settings.mode} style={{width:"110px"}}
            onChange={e=>actions.setSetting("mode", e.target.value)}>
            <option>5v5</option><option>3v3</option>
          </select>
          <span className="tiny muted">Counter rows recorded in the other mode are ignored while planning.</span>
        </div>
      </div>
    </div>
  );
}

function SettingsTab({state, actions, storageNote}){
  const S = state.settings;
  const [dump, setDump] = useState("");
  const [ask, setAsk] = useState(null);
  const partial = (S.partialFrac||0)*(S.fullClear||0);
  return (
    <div>
      {ask==="reset" && <Confirm title="Erase everything?" danger okLabel="Erase it all"
        body="Roster, counter database, board, plan and settings all go. This cannot be undone."
        onCancel={()=>setAsk(null)} onOk={()=>{actions.resetAll(); setAsk(null);}} />}
      {ask==="samples" && <Confirm title="Remove the sample data?" danger okLabel="Remove samples"
        body="Everything marked SAMPLE goes — the demo roster, the demo counter rows, the demo board. Anything you added stays."
        onCancel={()=>setAsk(null)} onOk={()=>{actions.wipeSamples(); setAsk(null);}} />}

      <div className="panel pad" style={{marginBottom:"14px"}}>
        <div className="eyebrow">Scoring</div>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:"14px", marginTop:"10px"}}>
          <div className="field">
            <label className="f">Confidence level</label>
            <select value={String(S.conf)} onChange={e=>actions.setSetting("conf", Number(e.target.value))}>
              <option value="0.8">80%</option><option value="0.9">90%</option>
              <option value="0.95">95%</option><option value="0.99">99%</option>
            </select>
            <div className="tiny muted" style={{marginTop:"4px"}}>
              Higher means more proof demanded before a win rate counts. The adjusted % is a one-sided Wilson lower bound.
            </div>
          </div>
          <div className="field">
            <label className="f">Partial banners on a loss — {Math.round(S.partialFrac*100)}%</label>
            <input type="range" min="0" max="100" step="5" value={Math.round(S.partialFrac*100)}
              onChange={e=>actions.setSetting("partialFrac", Number(e.target.value)/100)} />
            <div className="tiny muted">A failed attack still banks roughly {b1(partial)} banners.</div>
          </div>
          <div className="field">
            <label className="f">Banners for a full clear</label>
            <input className="num" type="number" min="1" max="200" value={S.fullClear}
              onChange={e=>actions.setSetting("fullClear", Number(e.target.value)||1)} />
            <div className="tiny muted">Used only as the base for the partial-banner figure above.</div>
          </div>
          <div className="field">
            <label className="f">Minimum battles — {S.minSample}</label>
            <input type="range" min="0" max="500" step="10" value={S.minSample}
              onChange={e=>actions.setSetting("minSample", Number(e.target.value))} />
            <div className="tiny muted">Counter rows with fewer recorded battles are hidden. Zero shows everything.</div>
          </div>
          <div className="field">
            <label className="f">Cleanup reserve — {S.reserveN} team{S.reserveN===1?"":"s"}</label>
            <input type="range" min="0" max="5" step="1" value={S.reserveN}
              onChange={e=>actions.setSetting("reserveN", Number(e.target.value))} />
            <div className="tiny muted">Teams the optimizer holds back to retry its shakiest attacks.</div>
          </div>
          <div className="field">
            <label className="f">Under-geared teams</label>
            <label className="row tiny" style={{gap:"6px"}}>
              <input type="checkbox" style={{width:"auto"}} checked={!!S.allowUnderGeared}
                onChange={e=>actions.setSetting("allowUnderGeared", e.target.checked)} />
              <span>Let the optimizer use teams below the relic I required</span>
            </label>
            <div className="tiny muted" style={{marginTop:"4px"}}>They always stay visible in the list either way.</div>
          </div>
        </div>
        <hr className="hr" />
        <div className="tiny muted">
          Adjusted EV = adjusted win % × avg banners + (1 − adjusted win %) × (partial banners − cleanup cost),
          where cleanup cost is the expected banners of the next team you would have to spend on the retry.
        </div>
      </div>

      <div className="panel pad" style={{marginBottom:"14px"}}>
        <div className="eyebrow">Backup</div>
        <div className="tiny muted" style={{margin:"4px 0 8px"}}>{storageNote}</div>
        <div className="row wrap">
          <button className="btn" onClick={()=>setDump(JSON.stringify(actions.snapshot(), null, 1))}>Show backup text</button>
          <button className="btn" disabled={!dump.trim()} onClick={()=>{
            const r = actions.restore(dump); alert(r);
          }}>Restore from the text below</button>
        </div>
        {dump && <textarea style={{marginTop:"8px"}} value={dump} onChange={e=>setDump(e.target.value)} spellCheck="false" />}
      </div>

      <div className="panel pad">
        <div className="eyebrow">Danger zone</div>
        <div className="row wrap" style={{marginTop:"8px"}}>
          <button className="btn danger" onClick={()=>setAsk("samples")}>Remove sample data</button>
          <button className="btn danger" onClick={()=>setAsk("reset")}>Reset all data</button>
        </div>
      </div>
    </div>
  );
}
</script>

<script type="text/plain" class="appsrc">
/* ============================ app ============================ */

function App(){
  const [state, setState] = useState(()=>freshState(true));
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("board");
  const [sel, setSel] = useState(null);
  const [editing, setEditing] = useState(null);
  const [showOpt, setShowOpt] = useState(false);
  const [toast, setToast] = useState("");
  const [store, setStore] = useState("local");
  const dbRef = useRef(null);
  const saveTimer = useRef(null);

  /* ---- load ---- */
  useEffect(()=>{
    let alive = true;
    (async ()=>{
      const local = migrate(loadLocal());
      if(local && alive) setState(local);
      let db = null;
      try{ if(window.claude && window.claude.use) db = await window.claude.use("db"); }catch(e){ db = null; }
      if(!alive) return;
      if(db){
        dbRef.current = db;
        setStore("cloud");
        try{
          const snap = await db.doc(DB_COLL+"/"+DB_DOC).get();
          if(!alive) return;
          if(snap && snap.exists){
            const body = snap.data() || {};
            const parsed = migrate(typeof body.json==="string" ? JSON.parse(body.json) : body.state);
            if(parsed) setState(parsed);
          } else if(local){
            await db.doc(DB_COLL+"/"+DB_DOC).set({json: JSON.stringify(local), at: Date.now()});
          }
        }catch(e){ setStore("local"); }
      }
      if(alive) setReady(true);
    })();
    return ()=>{ alive = false; };
  }, []);

  /* ---- save (debounced) ---- */
  useEffect(()=>{
    if(!ready) return;
    saveLocal(state);
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>{
      const db = dbRef.current;
      if(!db) return;
      db.doc(DB_COLL+"/"+DB_DOC).set({json: JSON.stringify(state), at: Date.now()})
        .catch(()=>setStore("local"));
    }, 700);
  }, [state, ready]);

  const flash = msg => { setToast(msg); setTimeout(()=>setToast(t=>t===msg?"":t), 1800); };
  const patch = fn => setState(s=>{ const n = fn(s); return n===s ? s : {...n}; });

  /* ---- actions ---- */
  const actions = useMemo(()=>({
    setSetting:(k,v)=>patch(s=>({...s, settings:{...s.settings,[k]:v}})),
    setSquad:(slotId, squad)=>patch(s=>{
      const squads = {...s.board.squads};
      const assign = {...s.assign};
      if(squad && squad.length) squads[slotId] = squad;
      else { delete squads[slotId]; }
      if(!squad || !squad.length || squadKey(squad)!==squadKey(s.board.squads[slotId]||[])) delete assign[slotId];
      return {...s, board:{...s.board, squads}, assign};
    }),
    assign:(slotId, rowId)=>patch(s=>{
      const a = {...s.assign};
      if(rowId) a[slotId] = rowId; else delete a[slotId];
      return {...s, assign:a};
    }),
    replaceAssign:(next)=>{ patch(s=>({...s, assign:next})); flash("Plan accepted"); },
    addRoster:()=>patch(s=>({...s, roster:[{id:uid(), name:"", stars:7, gear:13, relic:0, zeta:false, omicron:false}, ...s.roster]})),
    editRoster:(id,p)=>patch(s=>({...s, roster:s.roster.map(r=>r.id===id?{...r,...p}:r)})),
    delRoster:(id)=>patch(s=>({...s, roster:s.roster.filter(r=>r.id!==id)})),
    addCounter:()=>patch(s=>({...s, counters:[{id:uid(), def:[], cnt:[], win:50, battles:0, banners:40,
      mode:s.settings.mode, minRelic:0, notes:""}, ...s.counters]})),
    editCounter:(id,p)=>patch(s=>({...s, counters:s.counters.map(r=>r.id===id?{...r,...p}:r)})),
    delCounter:(id)=>patch(s=>({...s, counters:s.counters.filter(r=>r.id!==id),
      assign:Object.fromEntries(Object.entries(s.assign).filter(([k,v])=>v!==id))})),
    addOpp:()=>patch(s=>({...s, opp:[{id:uid(), squad:[], notes:""}, ...s.opp]})),
    editOpp:(id,p)=>patch(s=>({...s, opp:s.opp.map(r=>r.id===id?{...r,...p}:r)})),
    delOpp:(id)=>patch(s=>({...s, opp:s.opp.filter(r=>r.id!==id)})),
    addZone:()=>patch(s=>({...s, board:{...s.board, zones:[...s.board.zones,{id:uid(), name:"New zone", slots:4}]}})),
    editZone:(id,p)=>patch(s=>({...s, board:{...s.board, zones:s.board.zones.map(z=>z.id===id?{...z,...p}:z)}})),
    delZone:(id)=>patch(s=>{
      const squads={...s.board.squads}, assign={...s.assign};
      Object.keys(squads).forEach(k=>{ if(k.split(":")[0]===id) delete squads[k]; });
      Object.keys(assign).forEach(k=>{ if(k.split(":")[0]===id) delete assign[k]; });
      return {...s, board:{...s.board, zones:s.board.zones.filter(z=>z.id!==id), squads}, assign};
    }),
    moveZone:(id,dir)=>patch(s=>{
      const zs=[...s.board.zones]; const i=zs.findIndex(z=>z.id===id); const j=i+dir;
      if(i<0||j<0||j>=zs.length) return s;
      [zs[i],zs[j]]=[zs[j],zs[i]];
      return {...s, board:{...s.board, zones:zs}};
    }),
    importRoster:(text)=>{
      const rows = splitDelimited(text);
      if(rows.length<1) return "Could not read that — nothing in it.";
      const idx = headerIndex(rows[0]);
      const hasHeader = idx.name!=null || idx.relic!=null || idx.gear!=null;
      const body = hasHeader ? rows.slice(1) : rows;
      const map = hasHeader ? idx : {name:0, stars:1, gear:2, relic:3, zeta:4, omicron:5};
      const out=[]; 
      body.forEach(r=>{
        const name = String(r[map.name!=null?map.name:0]||"").trim();
        if(!name) return;
        out.push({id:uid(), name:displayName(name),
          stars: numOf(r[map.stars]) || 7, gear: numOf(r[map.gear]) || 13,
          relic: numOf(r[map.relic]) || 0, zeta: boolOf(r[map.zeta]), omicron: boolOf(r[map.omicron])});
      });
      if(!out.length) return "Could not read that — no character names found.";
      patch(s=>{
        const keep = s.roster.filter(r=>!out.some(n=>charKey(n.name)===charKey(r.name)));
        return {...s, roster:[...out, ...keep]};
      });
      return "Imported "+out.length+" characters.";
    },
    importCounters:(text)=>{
      const rows = splitDelimited(text);
      if(rows.length<1) return "Could not read that — nothing in it.";
      const idx = headerIndex(rows[0]);
      const hasHeader = idx.defense!=null && idx.counter!=null;
      const body = hasHeader ? rows.slice(1) : rows;
      const map = hasHeader ? idx
        : {defense:0, counter:1, win:2, battles:3, banners:4, mode:5, minrelic:6, notes:7};
      const out=[]; let skipped=0;
      body.forEach(r=>{
        const def = parseSquad(r[map.defense]), cnt = parseSquad(r[map.counter]);
        if(!def.length || !cnt.length){ skipped++; return; }
        const battles = numOf(r[map.battles]);
        if(battles==null){ skipped++; return; }
        const modeCell = String(r[map.mode]||"").trim();
        out.push({id:uid(), def, cnt,
          win: numOf(r[map.win]) ?? 50, battles: Math.round(battles),
          banners: numOf(r[map.banners]) ?? 0,
          mode: /3/.test(modeCell) ? "3v3" : (modeCell ? "5v5" : "5v5"),
          minRelic: numOf(r[map.minrelic]) || 0,
          notes: String(r[map.notes]||"").trim()});
      });
      if(!out.length) return "Could not read that — every row was missing a squad or a battle count.";
      patch(s=>({...s, counters:[...out, ...s.counters]}));
      return "Imported "+out.length+" rows"+(skipped?", skipped "+skipped+" (no squad or no battle count)":"")+".";
    },
    importOpp:(text)=>{
      const rows = splitDelimited(text);
      const out=[];
      rows.forEach((r,i)=>{
        if(i===0 && headerIndex(r).counter!=null) return;
        const squad = parseSquad(r[0]);
        if(!squad.length) return;
        out.push({id:uid(), squad, notes:String(r[1]||"").trim()});
      });
      if(!out.length) return "Could not read that — no squads found.";
      patch(s=>({...s, opp:[...out, ...s.opp]}));
      return "Imported "+out.length+" squads.";
    },
    wipeSamples:()=>patch(s=>{
      const counters = s.counters.filter(r=>!r.sample);
      const keptIds = new Set(counters.map(r=>r.id));
      const squads = s.board.sample ? {} : s.board.squads;
      const assign = s.board.sample ? {} :
        Object.fromEntries(Object.entries(s.assign).filter(([k,v])=>keptIds.has(v)));
      return {...s, roster:s.roster.filter(r=>!r.sample), counters, opp:s.opp.filter(o=>!o.sample),
        board:{...s.board, squads, sample:false}, assign, seeded:false};
    }),
    resetAll:()=>{ setState(freshState(false)); setSel(null); setEditing(null); flash("Everything erased"); },
    snapshot:()=>state,
    restore:(txt)=>{
      try{ const parsed = migrate(JSON.parse(txt));
        if(!parsed) return "That text is not a backup.";
        setState(parsed); return "Restored.";
      }catch(e){ return "That text is not valid backup data."; }
    },
  }), [state]);

  const eng = useMemo(()=>buildEngine(state), [state]);

  const pool = useMemo(()=>{
    const set = new Map();
    state.roster.forEach(r=>{ if(r.name) set.set(charKey(r.name), r.name); });
    state.counters.forEach(r=>r.def.concat(r.cnt).forEach(n=>{ if(!set.has(charKey(n))) set.set(charKey(n), n); }));
    Object.values(state.board.squads).forEach(sq=>sq.forEach(n=>{ if(!set.has(charKey(n))) set.set(charKey(n), n); }));
    return Array.from(set.values()).sort();
  }, [state.roster, state.counters, state.board.squads]);

  const defSquads = useMemo(()=>{
    const m = new Map();
    state.counters.forEach(r=>{ const k=squadKey(r.def); if(!m.has(k)) m.set(k, r.def); });
    return Array.from(m.values());
  }, [state.counters]);

  /* ---- totals ---- */
  const totals = useMemo(()=>{
    let ev=0, planned=0;
    eng.filled.forEach(s=>{
      const rowId = state.assign[s.id]; if(!rowId) return;
      const c = (eng.perSlot[s.id]||[]).find(x=>x.rowId===rowId);
      if(c){ ev += c.adjEV; planned++; }
    });
    const usedKeys = new Set(Array.from(eng.held.keys()));
    const rosterKeys = new Set(state.roster.map(r=>charKey(r.name)));
    let usedOnRoster = 0;
    usedKeys.forEach(k=>{ if(rosterKeys.has(k)) usedOnRoster++; });
    return {ev, planned, filled:eng.filled.length, slots:eng.slots.length,
      used:usedKeys.size, left:Math.max(0, rosterKeys.size - usedOnRoster)};
  }, [state, eng]);

  useEffect(()=>{ if(!sel && eng.filled.length) setSel(eng.filled[0].id); }, [eng.filled.length]);

  const storageNote = store==="cloud"
    ? "Saved to your private artifact store, so it follows you between sessions and devices. A copy is kept in this browser too."
    : "Saved in this browser only — the private store was not reachable. Keep a backup copy of the text below.";

  return (
    <div className="shell">
      <div className="topbar">
        <div className="brandrow">
          <div className="mark"><span className="dot"></span>GAC War Table <small>offense planner</small></div>
          <span style={{flex:1}}></span>
          <Readout items={[
            {k:"exp. banners", v:b1(totals.ev)},
            {k:"attacks planned", v:totals.planned+"/"+totals.filled},
            {k:"slots empty", v:(totals.slots-totals.filled)},
            {k:"chars committed", v:totals.used},
            {k:"chars free", v:totals.left},
          ]} />
        </div>
        <div className="tabs">
          {[["board","Board"],["roster","Roster"],["counters","Counters"],["opp","Opponent"],
            ["setup","Zones"],["settings","Settings"]].map(([k,label])=>(
            <button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}>{label}</button>
          ))}
        </div>
      </div>

      {tab==="board" &&
        <div>
          <div className="row wrap" style={{marginBottom:"10px"}}>
            <button className="btn primary" onClick={()=>setShowOpt(v=>!v)}>
              {showOpt ? "Hide optimizer" : "Optimize the board"}
            </button>
            <span className="tiny muted">
              Click a slot to plan it. Double-click to change the squad in it.
            </span>
            {state.seeded && <span className="samp">sample data loaded</span>}
          </div>
          {showOpt && <div style={{marginBottom:"14px"}}>
            <OptimizerPanel state={state} eng={eng} actions={actions} onClose={()=>setShowOpt(false)} /></div>}
          <div className="grid2">
            <div>
              <BoardGrid state={state} eng={eng} sel={sel} setSel={setSel} editing={editing}
                setEditing={setEditing} actions={actions} pool={pool} defSquads={defSquads} />
              <OpportunityPanel state={state} eng={eng} setSel={setSel} />
            </div>
            <div className="rail">
              <SlotRail state={state} eng={eng} sel={sel} actions={actions} setEditing={setEditing} />
            </div>
          </div>
        </div>}

      {tab==="roster" && <RosterTab state={state} actions={actions} />}
      {tab==="counters" && <CountersTab state={state} actions={actions} />}
      {tab==="opp" && <OppTab state={state} actions={actions} />}
      {tab==="setup" && <SetupTab state={state} actions={actions} />}
      {tab==="settings" && <SettingsTab state={state} actions={actions} storageNote={storageNote} />}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
