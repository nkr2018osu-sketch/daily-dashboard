<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Totes — Storage Inventory</title>
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#16181d; --card:#1f2229; --card2:#262a33; --line:#32363f;
    --ink:#e8e6e1; --dim:#9aa0ab; --faint:#6b717c;
    --accent:#58b89a; --accent2:#7fd4b8; --warn:#e0b455; --bad:#d9776f;
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:calc(40px + env(safe-area-inset-bottom));}
  header{padding:18px 16px 6px; display:flex; align-items:baseline; gap:10px;}
  header h1{font-size:22px; margin:0; letter-spacing:.3px;}
  header .sub{color:var(--faint); font-size:12px; flex:1;}
  header a.home{color:var(--faint); font-size:13px; text-decoration:none;}
  nav{display:flex; gap:6px; padding:10px 12px; position:sticky; top:0; background:var(--bg);
    z-index:20; border-bottom:1px solid var(--line);}
  nav button{flex:1; padding:10px 4px; border:0; border-radius:10px; background:transparent;
    color:var(--dim); font-size:14px; font-weight:600;}
  nav button.on{background:var(--card2); color:var(--accent2);}
  main{padding:14px 12px; max-width:560px; margin:0 auto;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px; margin-bottom:12px;}
  .card h3{margin:0 0 6px; font-size:16px;}
  .muted{color:var(--dim); font-size:13px;}
  .tiny{color:var(--faint); font-size:12px;}
  button.btn{border:0; border-radius:11px; padding:12px 16px; font-size:15px; font-weight:700;
    background:var(--accent); color:#0d201a;}
  button.ghost{background:var(--card2); color:var(--ink); border:1px solid var(--line);}
  button.small{padding:7px 12px; font-size:13px; border-radius:9px;}
  button.danger{background:transparent; border:1px solid #6a4441; color:var(--bad);}
  .row{display:flex; gap:8px; align-items:center;}
  .grow{flex:1;}
  input[type=text], input[type=number], input[type=search], textarea, select{
    width:100%; padding:12px; font-size:16px; background:var(--card2); color:var(--ink);
    border:1px solid var(--line); border-radius:10px;}
  input:focus, textarea:focus, select:focus{outline:1px solid var(--accent); border-color:var(--accent);}
  label.f{display:block; font-size:12px; color:var(--faint); text-transform:uppercase;
    letter-spacing:.5px; margin:12px 0 5px;}
  /* search */
  #q{padding:14px; font-size:17px; border-radius:12px;}
  .hl{color:var(--accent2);}
  .res{display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line);}
  .res:last-child{border-bottom:0;}
  .res .nm{font-weight:600;}
  .res .sub2{color:var(--faint); font-size:12px; margin-top:1px;}
  .badge{display:inline-flex; align-items:center; justify-content:center; min-width:42px; padding:6px 8px;
    border-radius:9px; background:var(--card2); border:1px solid #3a5a4f; color:var(--accent2);
    font-weight:800; font-size:14px; flex-shrink:0;}
  .badge.big{min-width:54px; font-size:18px; padding:10px;}
  .qty{color:var(--faint); font-weight:600; font-size:13px;}
  /* tote cards */
  .tote{display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--card);
    border:1px solid var(--line); border-radius:var(--r); margin-bottom:9px; cursor:pointer;}
  .tote .nm{font-weight:700; font-size:15.5px;}
  .tote .loc{color:var(--dim); font-size:13px; margin-top:1px;}
  .tote .n{color:var(--faint); font-size:12px; flex-shrink:0; text-align:right;}
  .item{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); cursor:pointer;}
  .item:last-child{border-bottom:0;}
  .item .nm{font-weight:600;}
  .item .nt{color:var(--faint); font-size:12px;}
  .kpis{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:10px;}
  .kpi .v{font-size:20px; font-weight:800; color:var(--accent2);}
  .kpi .k{font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.5px;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:30px; background:var(--accent);
    color:#0d201a; font-weight:700; padding:10px 18px; border-radius:99px; z-index:90; font-size:14px;
    opacity:0; transition:opacity .25s; pointer-events:none; max-width:90vw; text-align:center;}
  .toast.on{opacity:1;}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:none;
    align-items:flex-end; justify-content:center;}
  .modal.on{display:flex;}
  .modal .sheet{background:var(--card); border-radius:18px 18px 0 0; padding:18px 16px
    calc(18px + env(safe-area-inset-bottom)); width:100%; max-width:560px; max-height:85vh; overflow:auto;}
  .back{color:var(--accent2); text-decoration:none; font-size:14px; font-weight:600;
    display:inline-block; margin-bottom:10px; background:none; border:0; padding:0;}
  /* print label */
  #printarea{display:none;}
  @media print{
    body > *{display:none !important;}
    body{background:#fff; color:#000; padding:0;}
    #printarea{display:block !important; color:#000; font-family:-apple-system,"Segoe UI",Roboto,sans-serif;}
    #printarea .pid{font-size:90px; font-weight:900; letter-spacing:2px; margin:0;}
    #printarea .pnm{font-size:30px; font-weight:700; margin:4px 0 2px;}
    #printarea .ploc{font-size:18px; color:#444; margin-bottom:14px;}
    #printarea ul{font-size:15px; columns:2; margin:0; padding-left:20px;}
    #printarea .pfoot{margin-top:16px; font-size:12px; color:#777;}
  }
</style>
</head>
<body>
<header>
  <h1>📦 Totes</h1>
  <span class="sub">storage inventory</span>
  <a class="home" href="../index.html">⌂ dashboard</a>
</header>
<nav>
  <button id="nav-find" class="on" onclick="go('find')">Find</button>
  <button id="nav-totes" onclick="go('totes')">Totes</button>
  <button id="nav-more" onclick="go('more')">More</button>
</nav>
<main id="main"></main>

<div class="modal" id="modal" onclick="if(event.target===this) closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="printarea"></div>

<script>
"use strict";
/* ---------- state ---------- */
const KEY="storageInv";
let S=load();
function load(){
  try{ const d=JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.totes) && Array.isArray(d.items)) return d;
  }catch(e){}
  return {totes:[], items:[], nextTote:1, nextItem:1};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

let V={tab:"find", tote:null, q:""};

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return String(s||"").toLowerCase().trim(); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"), 2200); }
function modal(html){ $("sheet").innerHTML=html; $("modal").classList.add("on"); }
function closeModal(){ $("modal").classList.remove("on"); }
function toteById(id){ return S.totes.find(t=>t.id===id); }
function itemsIn(toteId){ return S.items.filter(i=>i.tote===toteId); }
function toteLabel(id){ const t=toteById(id); return t ? t.id+(t.name?" · "+t.name:"") : "Loose (no tote)"; }
function hi(text,q){ /* highlight match */
  const t=String(text), i=norm(t).indexOf(q);
  if(q && i>=0) return esc(t.slice(0,i))+'<b class="hl">'+esc(t.slice(i,i+q.length))+'</b>'+esc(t.slice(i+q.length));
  return esc(t);
}

/* ---------- nav ---------- */
function go(tab){ V.tab=tab; V.tote=null; render(); }
function openTote(id){ V.tab="totes"; V.tote=id; render(); }

function render(){
  ["find","totes","more"].forEach(t=>$("nav-"+t).classList.toggle("on", V.tab===t));
  const m=$("main");
  if(V.tab==="find") m.innerHTML=findHTML();
  else if(V.tab==="totes") m.innerHTML = V.tote!==null ? toteHTML(V.tote) : totesHTML();
  else m.innerHTML=moreHTML();
  if(V.tab==="find"){ const q=$("q"); q.value=V.q; q.oninput=()=>{V.q=q.value; $("results").innerHTML=resultsHTML();}; }
  if(V.tab==="totes" && V.tote!==null){
    const a=$("quickadd");
    a.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); quickAdd(); } };
  }
}

/* ---------- Find ---------- */
function findHTML(){
  const nI=S.items.reduce((n,i)=>n+(i.qty||1),0);
  return `
  <input type="search" id="q" placeholder="Search your stuff… (e.g. christmas lights)" autocomplete="off">
  <div class="tiny" style="margin:8px 2px 0">${S.items.length} item${S.items.length===1?"":"s"} (${nI} counting quantities) across ${S.totes.length} tote${S.totes.length===1?"":"s"} — check here before you buy something.</div>
  <div class="card" style="margin-top:12px"><div id="results">${resultsHTML()}</div></div>`;
}
function resultsHTML(){
  const q=norm(V.q);
  if(!q){
    if(!S.items.length) return `<div class="muted">Nothing catalogued yet. Go to <b>Totes</b>, create your first tote, and add items as you pack it.</div>`;
    const recent=S.items.slice().sort((a,b)=>(b.added||0)-(a.added||0)).slice(0,8);
    return `<div class="tiny" style="margin-bottom:6px">RECENTLY ADDED</div>`+recent.map(itemRow).join("");
  }
  const items=S.items.filter(i=> norm(i.name).includes(q) || norm(i.notes).includes(q));
  const totes=S.totes.filter(t=> norm(t.name).includes(q) || norm(t.loc).includes(q) || norm(t.id).includes(q));
  let h="";
  if(items.length) h+=items.map(i=>itemRow(i,q)).join("");
  if(totes.length) h+=`<div class="tiny" style="margin:10px 0 4px">TOTES</div>`+totes.map(t=>{
    const n=itemsIn(t.id).length;
    return `<div class="res" onclick="openTote('${t.id}')"><span class="badge">${esc(t.id)}</span>
      <div class="grow"><div class="nm">${hi(t.name||"(unnamed)",q)}</div>
      <div class="sub2">${hi(t.loc||"no location",q)} · ${n} item${n===1?"":"s"}</div></div></div>`;
  }).join("");
  if(!h) h=`<div class="muted">No matches for “${esc(V.q)}” — looks like you don't have it packed away. 👍</div>`;
  return h;
}
function itemRow(i,q){
  q=q||"";
  const t=toteById(i.tote);
  const where=t ? `${esc(t.id)}${t.loc?" · "+esc(t.loc):""}` : "Loose (no tote)";
  return `<div class="res" onclick="editItem(${i.id})">
    <div class="grow"><div class="nm">${hi(i.name,q)} ${(i.qty||1)>1?`<span class="qty">×${i.qty}</span>`:""}</div>
    ${i.notes?`<div class="sub2">${hi(i.notes,q)}</div>`:""}</div>
    <span class="badge" onclick="event.stopPropagation();openTote('${esc(i.tote)}')">${t?esc(t.id):"—"}</span>
  </div><div class="tiny" style="margin:-7px 0 6px 2px">${where}</div>`;
}

/* ---------- Totes list ---------- */
function totesHTML(){
  let h=`<button class="btn" style="width:100%" onclick="newTote()">+ New tote</button><div style="height:12px"></div>`;
  const loose=itemsIn("").length;
  if(loose) h+=`<div class="tote" onclick="openTote('')"><span class="badge big">📦</span>
    <div class="grow"><div class="nm">Loose items</div><div class="loc">not in any tote</div></div>
    <div class="n">${loose} item${loose===1?"":"s"}</div></div>`;
  if(!S.totes.length && !loose)
    h+=`<div class="card"><h3>No totes yet</h3><div class="muted">Tap <b>+ New tote</b>, give it a number-matching label (write “T1” on the real tote with a marker or print a label), then add items as you pack.</div></div>`;
  h+=S.totes.slice().sort(toteSort).map(t=>{
    const n=itemsIn(t.id).length;
    return `<div class="tote" onclick="openTote('${t.id}')"><span class="badge big">${esc(t.id)}</span>
      <div class="grow"><div class="nm">${esc(t.name||"(unnamed)")}</div><div class="loc">${esc(t.loc||"no location set")}</div></div>
      <div class="n">${n} item${n===1?"":"s"}</div></div>`;
  }).join("");
  return h;
}
function num(id){ const m=String(id).match(/\d+/); return m?+m[0]:0; }
function toteSort(a,b){ /* T totes first, then other prefixes (e.g. B cable bins), numerically within each */
  const pa=String(a.id)[0], pb=String(b.id)[0];
  if(pa!==pb) return pa==="T"?-1 : pb==="T"?1 : pa.localeCompare(pb);
  return num(a.id)-num(b.id);
}

/* ---------- Tote detail ---------- */
function toteHTML(id){
  const t=toteById(id);
  const items=itemsIn(id).slice().sort((a,b)=>(b.added||0)-(a.added||0));
  const title=t ? `${esc(t.id)} — ${esc(t.name||"(unnamed)")}` : "Loose items";
  const loc=t ? (t.loc||"no location set") : "not in any tote";
  let h=`<button class="back" onclick="go('totes')">‹ All totes</button>
  <div class="card">
    <div class="row"><div class="grow"><h3 style="margin:0">${title}</h3>
      <div class="muted">${esc(loc)}${t&&t.notes?" · "+esc(t.notes):""}</div></div>
      ${t?`<button class="ghost small" onclick="editTote('${t.id}')">Edit</button>
      <button class="ghost small" onclick="printLabel('${t.id}')">Label</button>`:""}
    </div>
  </div>
  <div class="card">
    <div class="row">
      <input type="text" id="quickadd" class="grow" placeholder="Add item… (e.g. extension cord x2)" autocomplete="off">
      <button class="btn small" style="padding:12px 16px" onclick="quickAdd()">Add</button>
    </div>
    <div class="tiny" style="margin-top:7px">Tip: end with “x3” to set quantity. Press Enter to keep adding while you pack.</div>
  </div>
  <div class="card">`;
  if(!items.length) h+=`<div class="muted">Empty so far.</div>`;
  else h+=items.map(i=>`<div class="item" onclick="editItem(${i.id})">
      <div class="grow"><span class="nm">${esc(i.name)}</span> ${(i.qty||1)>1?`<span class="qty">×${i.qty}</span>`:""}
      ${i.notes?`<div class="nt">${esc(i.notes)}</div>`:""}</div>
      <span class="tiny">›</span></div>`).join("");
  h+=`</div>`;
  return h;
}
function quickAdd(){
  const inp=$("quickadd"); let name=inp.value.trim(); if(!name) return;
  let qty=1; const m=name.match(/\s+[x×*](\d+)$/i);
  if(m){ qty=Math.max(1,+m[1]); name=name.slice(0,m.index).trim(); }
  const dup=S.items.find(i=> norm(i.name)===norm(name) && i.tote!==V.tote);
  S.items.push({id:S.nextItem++, name, qty, tote:V.tote, notes:"", added:Date.now()});
  save(); render();
  const inp2=$("quickadd"); inp2.focus();
  toast(dup ? `Added — heads up, also in ${toteLabel(dup.tote)}` : `Added “${name}”`);
}

/* ---------- editors ---------- */
function newTote(){
  const id="T"+S.nextTote;
  modal(toteForm({id, name:"", loc:"", notes:""}, true));
}
function editTote(id){ const t=toteById(id); if(t) modal(toteForm(t,false)); }
function toteForm(t,isNew){
  const locs=[...new Set(S.totes.map(x=>x.loc).filter(Boolean))];
  return `<h3 style="margin-top:0">${isNew?"New tote":"Edit "+esc(t.id)}</h3>
  <div class="muted">This will be <b>${esc(t.id)}</b> — write that on the physical tote (marker or printed label).</div>
  <label class="f">Name / what's the theme</label>
  <input type="text" id="tf-name" value="${esc(t.name)}" placeholder="e.g. Christmas decorations">
  <label class="f">Location</label>
  <input type="text" id="tf-loc" value="${esc(t.loc)}" list="locs" placeholder="e.g. Garage shelf A / Basement / Attic">
  <datalist id="locs">${locs.map(l=>`<option value="${esc(l)}">`).join("")}</datalist>
  <label class="f">Notes (optional)</label>
  <input type="text" id="tf-notes" value="${esc(t.notes)}" placeholder="e.g. fragile, keep upright">
  <div class="row" style="margin-top:16px">
    ${isNew?"":`<button class="danger small" onclick="deleteTote('${t.id}')">Delete</button>`}
    <div class="grow"></div>
    <button class="ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="saveTote('${t.id}',${isNew})">${isNew?"Create":"Save"}</button>
  </div>`;
}
function saveTote(id,isNew){
  const name=$("tf-name").value.trim(), loc=$("tf-loc").value.trim(), notes=$("tf-notes").value.trim();
  if(isNew){ S.totes.push({id, name, loc, notes, created:Date.now()}); S.nextTote++; }
  else{ const t=toteById(id); t.name=name; t.loc=loc; t.notes=notes; }
  save(); closeModal();
  if(isNew) openTote(id); else render();
}
function deleteTote(id){
  const n=itemsIn(id).length;
  modal(`<h3 style="margin-top:0">Delete ${esc(id)}?</h3>
  <div class="muted" style="margin-bottom:14px">${n?`It has ${n} item${n===1?"":"s"}.`:"It's empty."}</div>
  ${n?`<button class="ghost" style="width:100%;margin-bottom:8px" onclick="reallyDeleteTote('${id}',true)">Delete tote, keep items as “Loose”</button>`:""}
  <button class="danger" style="width:100%;margin-bottom:8px;padding:12px" onclick="reallyDeleteTote('${id}',false)">Delete tote${n?" and its items":""}</button>
  <button class="ghost" style="width:100%" onclick="closeModal()">Cancel</button>`);
}
function reallyDeleteTote(id,keepItems){
  if(keepItems) S.items.forEach(i=>{ if(i.tote===id) i.tote=""; });
  else S.items=S.items.filter(i=>i.tote!==id);
  S.totes=S.totes.filter(t=>t.id!==id);
  save(); closeModal(); go("totes");
}
function editItem(id){
  const i=S.items.find(x=>x.id===id); if(!i) return;
  const opts=[{id:"",label:"Loose (no tote)"}].concat(S.totes.slice().sort(toteSort).map(t=>({id:t.id,label:t.id+(t.name?" · "+t.name:"")})));
  modal(`<h3 style="margin-top:0">Edit item</h3>
  <label class="f">Name</label><input type="text" id="if-name" value="${esc(i.name)}">
  <label class="f">Quantity</label><input type="number" id="if-qty" value="${i.qty||1}" min="1" inputmode="numeric">
  <label class="f">Which tote</label>
  <select id="if-tote">${opts.map(o=>`<option value="${esc(o.id)}" ${o.id===i.tote?"selected":""}>${esc(o.label)}</option>`).join("")}</select>
  <label class="f">Notes (optional)</label><input type="text" id="if-notes" value="${esc(i.notes)}" placeholder="e.g. the good one, missing remote">
  <div class="row" style="margin-top:16px">
    <button class="danger small" onclick="deleteItem(${i.id})">Delete</button><div class="grow"></div>
    <button class="ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="saveItem(${i.id})">Save</button>
  </div>`);
}
function saveItem(id){
  const i=S.items.find(x=>x.id===id); if(!i) return;
  i.name=$("if-name").value.trim()||i.name;
  i.qty=Math.max(1, +$("if-qty").value||1);
  i.tote=$("if-tote").value;
  i.notes=$("if-notes").value.trim();
  save(); closeModal(); render();
}
function deleteItem(id){
  S.items=S.items.filter(x=>x.id!==id);
  save(); closeModal(); render(); toast("Item deleted");
}

/* ---------- print label ---------- */
function printLabel(id){
  const t=toteById(id); if(!t) return;
  const items=itemsIn(id);
  $("printarea").innerHTML=`<p class="pid">${esc(t.id)}</p>
    <p class="pnm">${esc(t.name||"")}</p>
    <p class="ploc">${esc(t.loc||"")}</p>
    <ul>${items.slice(0,24).map(i=>`<li>${esc(i.name)}${(i.qty||1)>1?" ×"+i.qty:""}</li>`).join("")}</ul>
    ${items.length>24?`<p class="pfoot">…and ${items.length-24} more — full list in the Totes app.</p>`:""}
    <p class="pfoot">Totes inventory · ${location.host}${location.pathname}</p>`;
  window.print();
}

/* ---------- More ---------- */
function moreHTML(){
  const nI=S.items.length, nT=S.totes.length;
  const locs=[...new Set(S.totes.map(t=>t.loc).filter(Boolean))];
  return `
  <div class="kpis">
    <div class="kpi"><div class="v">${nT}</div><div class="k">totes</div></div>
    <div class="kpi"><div class="v">${nI}</div><div class="k">items</div></div>
    <div class="kpi"><div class="v">${locs.length}</div><div class="k">locations</div></div>
  </div>
  <div class="card"><h3>Backup</h3>
    <div class="muted" style="margin-bottom:10px">Your inventory lives only in this browser on this device. Export a backup occasionally (it downloads a small file you can keep in Files/iCloud) — and use it to load the inventory onto another device.</div>
    <div class="row">
      <button class="btn small" onclick="exportData()">Export backup</button>
      <label class="ghost small" style="border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;border:1px solid var(--line)">Restore<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>
    </div>
  </div>
  <div class="card"><h3>How it works</h3>
    <div class="muted">1. Create a tote here → it gets a number (T1, T2…).<br>
    2. Write that number on the real tote with a marker, or tap <b>Label</b> to print one.<br>
    3. Add items while you pack — Enter keeps the keyboard up.<br>
    4. Later, <b>Find</b> tells you exactly which tote and shelf something is in — check it at the store before buying a duplicate.</div>
  </div>
  <div class="card"><h3>Danger zone</h3>
    <button class="danger small" onclick="eraseAll()">Erase all data</button>
  </div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="totes-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d || !Array.isArray(d.totes) || !Array.isArray(d.items)) throw 0;
      S=d; save(); render(); toast("Backup restored");
    }catch(e){ toast("That file doesn't look like a Totes backup"); } };
  r.readAsText(f);
}
function eraseAll(){
  modal(`<h3 style="margin-top:0">Erase all inventory data?</h3>
  <div class="muted" style="margin-bottom:12px">This cannot be undone. Export a backup first.</div>
  <div class="row"><div class="grow"></div>
    <button class="ghost" onclick="closeModal()">Cancel</button>
    <button class="danger" style="padding:12px 16px" onclick="S={totes:[],items:[],nextTote:1,nextItem:1};save();closeModal();go('find')">Erase everything</button>
  </div>`);
}

render();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("../sw.js");

/* First run: offer the starter inventory imported from the home-maintenance spreadsheet */
if(!S.totes.length && !S.items.length && !localStorage.getItem(KEY+"SeedDismissed")){
  fetch("seed.json").then(r=> r.ok ? r.json() : null).then(d=>{
    if(!d || !Array.isArray(d.totes) || !Array.isArray(d.items)) return;
    if(S.totes.length || S.items.length) return; // user started entering meanwhile
    window._seed=d;
    modal(`<h3 style="margin-top:0">Load your existing inventory?</h3>
    <div class="muted" style="margin-bottom:14px">I found your storage catalog from the “5747 Home Maintenance” spreadsheet:
      <b>${d.totes.length} containers</b> (totes T1–T14 + cable bins B1–B6) holding <b>${d.items.length} items</b>.
      Everything stays editable afterwards.</div>
    <button class="btn" style="width:100%;margin-bottom:8px" onclick='loadSeed()'>Load it</button>
    <button class="ghost" style="width:100%" onclick='localStorage.setItem(KEY+"SeedDismissed","1");closeModal()'>No thanks, start empty</button>`);
  }).catch(()=>{});
}
function loadSeed(){
  S=window._seed; save();
  localStorage.setItem(KEY+"SeedDismissed","1");
  closeModal(); go("totes");
  toast("Loaded "+S.items.length+" items — tap a tote to review");
}
</script>
</body>
</html>
